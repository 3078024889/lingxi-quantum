<title>LINGXIFIELD SIAI Finder</title>
<style>
:root{font:14px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#1f3150;background:#f5f8ff}
*{box-sizing:border-box}body{width:380px;min-height:340px;margin:0;padding:18px}
h1{font-size:19px;margin:0;color:#17305c}p{margin:7px 0 14px;color:#5d6d85}input,select{padding:10px 12px;border:1px solid #c8d7eb;border-radius:10px;color:#203b64;font:inherit;background:white;width:100%}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0 12px}

</style>
</head>

<h1>LINGXIFIELD · Global SIAI</h1>
<p id="lead">Reviewed SI/AI platform information</p>
<label for="query" id="searchLabel">Search platforms and capabilities</label>
<input id="query" type="search" maxlength="80" autocomplete="off" placeholder="Search…" />
<div class="filters">
<select id="category" aria-label="Category"></select>

</div>

</footer>

</body>
