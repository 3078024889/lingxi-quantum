<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SASI 本地模型体验</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#172139;font:16px/1.7 system-ui,sans-serif}main{max-width:820px;margin:7vh auto;padding:24px}h1{font-size:32px;letter-spacing:-1px;margin-bottom:4px}.brand{color:#7652d1;font-weight:700;letter-spacing:3px}.muted{color:#657087}.card{background:white;border:1px solid #e2e5ed;border-radius:24px;padding:24px;margin-top:24px;box-shadow:0 10px 50px #17213908}button,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:12px 22px;background:#6845c1;color:#fff;cursor:pointer}button:disabled{opacity:.5;cursor:default}select{padding:10px;border:1px solid #d7dce7;border-radius:10px;background:#fff;max-width:100%}textarea{display:block;width:100%;min-height:160px;margin:18px 0;padding:16px;border:1px solid #d7dce7;border-radius:14px;resize:vertical}#result{white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:100%;border-radius:12px}a{color:#6845c1}.status{font-size:14px}footer{font-size:13px;color:#657087;margin-top:24px}@media(max-width:500px){main{margin:0;padding:20px}.card{padding:18px}h1{font-size:27px}}
</style><main><div class="brand">LINGXIFIELD · SASI</div><h1>先把一个想法做出来。</h1><p class="muted">本机模型体验。无需充值，不调用付费模型 API。</p><section class="card"><label for="kind">你想完成什么？</label><br><select id="kind"><option value="text">问问题 · 写文字</option><option value="image">描述画面 · 生成图片</option><option value="video">生成视频 · 尚未验收</option></select><label id="qualityLabel" hidden> 图片质量 <select id="quality"><option value="clear">更清晰 · 20 步，等待更久</option><option value="fast">快速预览 · 8 步</option></select></label><p id="status" class="status" role="status">正在检查本地模型…</p><label for="prompt">说说你的想法</label><textarea id="prompt" maxlength="2000" placeholder="例如：帮我把这段想法整理成三条清晰的行动建议。"></textarea><button id="submit" disabled>开始</button><p id="message" role="status"></p><div id="result"></div></section><footer>文字：Qwen3-0.6B，轻量入门模型，回答可能出错。图片：Stable Diffusion 1.5，256px 测试配置，英文描述效果通常更好。当前页面只在这台电脑使用，不代表网站已上线。视频模型仍需硬件与效果验收。</footer></main>
<script>
const kind=document.querySelector('#kind'),promptBox=document.querySelector('#prompt'),button=document.querySelector('#submit'),status=document.querySelector('#status'),message=document.querySelector('#message'),result=document.querySelector('#result');let capabilities={},running=false;
function update(){document.querySelector('#qualityLabel').hidden=kind.value!=='image';document.querySelector('#quality').disabled=running;status.textContent=capabilities.busy?'本机正在处理一个任务，请等待完成。':kind.value==='video'?'视频尚未在本机跑通，不会转用付费 API。':capabilities[kind.value]?'本地模型可用。输入内容后即可测试。':'本地模型尚未启动或仍在准备中。';button.disabled=running||capabilities.busy||!capabilities[kind.value]||!promptBox.value.trim();}
async function refresh(){try{const r=await fetch('/status');capabilities=await r.json()}catch{capabilities={}}update()}
kind.onchange=()=>{result.replaceChildren();message.textContent='';update()};promptBox.oninput=update;
button.onclick=async()=>{running=true;kind.disabled=true;promptBox.disabled=true;result.replaceChildren();message.textContent='正在本机处理，图片生成可能需要几分钟…';update();try{const response=await fetch('/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:kind.value,prompt:promptBox.value,quality:document.querySelector('#quality').value})});const created=await response.json();if(!response.ok)throw Error(created.error);let job;do{await new Promise(r=>setTimeout(r,1200));const r=await fetch('/jobs/'+created.id);if(!r.ok)throw Error('任务已失效，请重新测试');job=await r.json()}while(['queued','running'].includes(job.state));if(job.state!=='succeeded')throw Error(job.error||'生成未完成');if(job.text)result.textContent=job.text;if(job.image){const img=document.createElement('img');img.src=job.image;img.alt='本地模型生成的测试图片';result.append(img);const link=document.createElement('a');link.href=job.image;link.download='SASI-local.png';link.textContent='下载图片';result.append(document.createElement('br'),link)}message.textContent='已完成 · '+job.elapsedSeconds+' 秒'}catch(e){message.textContent='未完成：'+e.message}finally{running=false;kind.disabled=false;promptBox.disabled=false;refresh()}};
refresh();setInterval(refresh,15000);
</script></html>
