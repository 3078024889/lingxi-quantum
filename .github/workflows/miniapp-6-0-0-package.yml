name: Miniapp 6.0.0 isolated package (NO WECHAT UPLOAD)
on:
  workflow_dispatch:
  push:
    branches: [release/miniapp-6.0.0-20261116]
    paths:
      - 'miniapp/**'
      - 'app/api/wechat/mini/cny-topup/**'
      - 'app/account/MiniAccountLinkPanel.tsx'
      - 'app/checkout-usd/page.tsx'
      - 'app/tools/pay/page.tsx'
      - 'components/AccountProfileCard.tsx'
      - 'components/MiniPaymentBoundary.tsx'
      - 'components/Nav.tsx'
      - 'components/WalletLivePanel.tsx'
      - 'lib/mini/**'
      - 'lib/money/provider-adapters.ts'
      - 'scripts/audit-mini-program.mjs'
      - 'scripts/audit-v164_4-offline-final.mjs'
      - 'scripts/audit/mini-*.mjs'
      - 'scripts/build-miniapps-v80.cjs'
      - 'scripts/package-miniapp-6-0-0.cjs'
      - 'scripts/test-mini-profiles-v80.cjs'
      - 'tests/miniapp-6.0.0-release-contract.test.mjs'
      - 'tests/mini-recharge-single-entry.test.mjs'
      - 'tests/mobile-account-trigger-20261116.test.mjs'
      - 'tests/usd-wallet-topup-readiness.test.mjs'
      - 'supabase/migrations/20261116120000_mini_cny_topup_atomic_reservation.sql'
      - '.github/workflows/miniapp-6-0-0-package.yml'
permissions:
  contents: read
concurrency:
  group: miniapp-6-0-0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run miniapp, payment, wallet and security contracts
        run: |
          set -Eeuo pipefail
          node scripts/generate-social-assets.mjs
          node --test tests/miniapp-6.0.0-release-contract.test.mjs tests/mini-recharge-single-entry.test.mjs tests/mobile-account-trigger-20261116.test.mjs tests/usd-wallet-topup-readiness.test.mjs tests/home-layout-20261115.test.mjs
          node scripts/audit/mini-unified-surface.mjs
          node scripts/audit/mini-virtual-payment.mjs
          node scripts/audit/mini-recharge-navigation.mjs
          node scripts/audit/mini-cny-native-usd-website.mjs
          node scripts/audit/balance-topups.mjs
          node scripts/audit/mini-balance-checkout.mjs
          node scripts/audit/mini-web-account-sync.mjs
          node scripts/audit/mini-retired-purchases.mjs
          node scripts/audit/mini-api-recovery.mjs
          node scripts/audit-mini-program.mjs
          node scripts/audit-v164_4-offline-final.mjs
          node scripts/test-mini-sharing-v78.cjs
          node scripts/test-mini-profiles-v80.cjs
          pnpm exec tsc --noEmit
      - name: Build isolated main and companion projects
        run: |
          set -Eeuo pipefail
          node scripts/build-miniapps-v80.cjs main
          node scripts/build-miniapps-v80.cjs temp-mail
          node scripts/test-mini-profiles-v80.cjs --check-builds
          node scripts/package-miniapp-6-0-0.cjs
      - name: Upload importable main Mini Program ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lingxifield-miniapp-6.0.0-${{ github.sha }}
          path: |
            dist/lingxifield-miniapp-6.0.0.zip
            dist/lingxifield-miniapp-6.0.0.zip.sha256
            dist/miniapp-6.0.0/release-notes.txt
          retention-days: 14
          if-no-files-found: error
      - name: Confirm no external release actions
        run: echo NO_WECHAT_UPLOAD_NO_WECHAT_REVIEW_NO_PRODUCTION_PAYMENT_ENABLE_NO_ECS_DEPLOY
