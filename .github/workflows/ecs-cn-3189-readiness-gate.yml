name: CN 3189 read-only staging readiness static gate (no deploy)
on:
  push:
    branches: [feature/cn-r2-cors-upload-lifecycle-20261106]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Validate no action unless explicit read-only switch
        run: |
          set -Eeuo pipefail
          node --check scripts/ops/ecs-cn-3189-live-readiness.mjs
          node --check scripts/ops/ecs-cn-runtime-triage.mjs
          bash -n scripts/ops/ecs-cn-stage-r2-reload.sh
          node --check scripts/ops/ecs-cn-real-document-gateway-3189.mjs
          test "$(node scripts/ops/ecs-cn-real-document-gateway-3189.mjs || true)" = CN_DOCUMENT_REAL_GATE_REQUIRES_EXPLICIT_3189_FLAG
          grep -Fq 'CN_DOC_STAGE_USER_API_REAL_DOCX' scripts/ops/ecs-cn-real-document-gateway-3189.mjs
          grep -Fq 'CN_DOC_GATEWAY_REPLAY_HTTP' scripts/ops/ecs-cn-real-document-gateway-3189.mjs
          grep -Fq 'CN_REAL_DOCUMENT_GATE_RESULT=' scripts/ops/ecs-cn-real-document-gateway-3189.mjs
          grep -Fq 'CN_3189_R2_ENV_RELOADED_ROUTES_AND_AUTH_PASS_PRODUCTION_3188_UNCHANGED' scripts/ops/ecs-cn-stage-r2-reload.sh
          grep -Fq 'CN_3189_ENV_ISOLATION_ABORT' scripts/ops/ecs-cn-stage-r2-reload.sh
          test "$(node scripts/ops/ecs-cn-runtime-triage.mjs 2>&1 || true)" = CN_TRIAGE_REQUIRES_READ_ONLY_FLAG
          grep -Fq 'CN_R2_ENDPOINT_KIND=' scripts/ops/ecs-cn-runtime-triage.mjs
          grep -Fq 'CN_SIAI_FIRST' scripts/ops/ecs-cn-runtime-triage.mjs
          grep -Fq 'CN_DOC_POST_CONVERT_NO_AUTH' scripts/ops/ecs-cn-runtime-triage.mjs
          s="$(node scripts/ops/ecs-cn-3189-live-readiness.mjs || true)"
          test "$s" = CN_STAGE_READINESS_REQUIRES_EXPLICIT_READ_ONLY_FLAG
          grep -q 'CN_STAGE_JOBS_NO_AUTH' scripts/ops/ecs-cn-3189-live-readiness.mjs
          grep -q 'CN_STAGE_PAYMENTS_DISABLED' scripts/ops/ecs-cn-3189-live-readiness.mjs
          grep -q 'CN_REAL_PROVIDER_GENERATION_AND_PAYMENT_CALLBACKS=NOT_VERIFIED' scripts/ops/ecs-cn-3189-live-readiness.mjs
          echo CN_READ_ONLY_STAGE_CHECK_SCRIPT_VERIFIED
