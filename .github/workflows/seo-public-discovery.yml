name: LINGXIFIELD Public SEO GEO discovery gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/sitemap.ts'
      - 'app/robots.ts'
      - 'app/llms.txt/route.ts'
      - 'app/tools/**/page.tsx'
      - 'app/**/tools/**/page.tsx'
      - 'app/tools/layout.tsx'
      - 'components/seo/**'
      - 'lib/tools/seo.ts'
      - 'app/siai/**'
      - 'app/[locale]/siai/**'
      - 'lib/seo/**'
      - 'lib/siai-seo-policy.ts'
      - 'scripts/seo/**'
      - 'scripts/audit-seo-geo-v1579.mjs'
      - 'scripts/audit/v59-global-discoverability.mjs'
      - 'tests/seo-fullsite-coverage.test.mjs'
      - 'tests/siai-localized-indexing.test.mjs'
      - 'package.json'
      - '.github/workflows/seo-public-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-seo-geo:
    name: canonical-sitemaps-124-tools-9-languages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Node from project
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Locked install
        run: pnpm install --frozen-lockfile
      - name: Audit all indexable public content
        run: pnpm seo:audit:fullsite
      - name: Production-indexing-mode build (without deployment)
        env:
          VERCEL_ENV: production
        run: pnpm build
      - name: Check actual server-rendered URLs and metadata
        env:
          VERCEL_ENV: production
        run: node scripts/seo/verify-built-pages.mjs
