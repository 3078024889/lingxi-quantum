name: LINGXIFIELD Cloudflare credentials and public R2 readiness (NO DEPLOY)
on:
  push:
    branches: [ops/lingxifield-cloudflare-credentials-preflight-20261107]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingxi-cloudflare-credentials-preflight
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare-com-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24.19.0'}
      - name: Check Cloudflare deployment permissions and existing public assets bucket WITHOUT releasing
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN_SECRET_NOT_CONNECTED"
            exit 1
          fi
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID_VARIABLE_MISSING_OR_INVALID"
            exit 1
          fi
          echo "CLOUDFLARE_DEPLOYMENT_SECRET_AND_ACCOUNT_VARIABLE_PRESENT"
          set +e
          npx --yes wrangler@4.158.0 r2 bucket list > "$RUNNER_TEMP/r2-buckets.txt" 2> "$RUNNER_TEMP/r2-error.txt"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::CLOUDFLARE_R2_REMOTE_BUCKET_LIST_DENIED"
            echo "Cloudflare token may be restricted to Workers; no deployment attempted."
            exit 1
          fi
          if ! grep -Fq 'lingxifield-com-large-public' "$RUNNER_TEMP/r2-buckets.txt"; then
            echo "::warning::REQUIRED_R2_PUBLIC_BUCKET_NOT_FOUND"
            echo "NEXT_ACTION_CREATE_DEDICATED_PUBLIC_BUCKET_AFTER_REVIEW"
          else
            echo "PUBLIC_R2_BUCKET_ALREADY_EXISTS"
          fi
          echo "CLOUDFLARE_PRECHECK_ONLY_NO_WORKER_OR_DNS_MUTATION"
