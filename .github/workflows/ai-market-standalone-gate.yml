name: AI Market standalone release gate

on:
  pull_request:
    paths:
      - "lingxifield-ai-market/**"
      - ".github/workflows/ai-market-standalone-gate.yml"
  push:
    branches: [main]
    paths:
      - "lingxifield-ai-market/**"
      - ".github/workflows/ai-market-standalone-gate.yml"

permissions:
  contents: read

concurrency:
  group: ai-market-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lingxifield-ai-market
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lingxifield-ai-market/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run data, contract, type and production build gates
        run: npm run gate
