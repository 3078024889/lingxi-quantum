name: AI Market standalone release gate

on:
  pull_request:
    paths:
      - "lingxifield-ai-market/**"
      - ".github/workflows/ai-market-standalone-gate.yml"
  push:
    branches: [main]
    paths:
      - "lingxifield-ai-market/**"
      - ".github/workflows/ai-market-standalone-gate.yml"

permissions:
  contents: read

concurrency:
  group: ai-market-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lingxifield-ai-market
    steps:
      - name: Checkout exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
          cache: npm
          cache-dependency-path: lingxifield-ai-market/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run data, contract, type and production build gates
        run: npm run gate
      - name: Probe 32 public publisher entry URLs (nonblocking, no accounts)
        run: node scripts/probe-official-use.mjs --live
        timeout-minutes: 3
        continue-on-error: true
