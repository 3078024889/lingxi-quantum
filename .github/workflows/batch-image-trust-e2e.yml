name: LINGXIFIELD Batch Image Safe Real Delivery E2E
on:
  push:
    branches: [feature/batch-image-simple-safe-20261104]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingxi-batch-image-safe-20261104
  cancel-in-progress: true
jobs:
  batch-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pin pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Pin Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production bundle locally
        run: pnpm build
      - name: Install Chrome with bounded retry on transient network errors
        run: |
          for attempt in 1 2 3; do
            if pnpm exec playwright install --with-deps chrome; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      - name: Verify real input and decoded downloads on desktop and Pixel7
        run: pnpm exec playwright test -c playwright.final.config.ts --workers=2 tests/final-closure/batch-zip-v83.spec.ts tests/final-closure/batch-image-trust-e2e.spec.ts
      - name: Upload browser traces
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: batch-image-safe-e2e
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
