name: Global SIAI 4290 canary and two-domain rollback source audit (NO deploy)
on:
  push:
    branches: [feature/release-announcement-auth-readiness-20261106]
permissions:
  contents: read
jobs:
  operator-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: Test ECS inline Python scripts on genuine Python 3.6
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 --memory=256m \
            -v "$PWD:/src:ro" -w /src python:3.6.15-slim \
            python -c '
          import pathlib,re,subprocess,sys
          files = [
            "scripts/ops/cn-market-memory-auth-readonly-v2.sh",
            "scripts/ops/globalsiai-notice-4290-canary.sh",
            "scripts/ops/globalsiai-notice-dual-host-cutover.sh",
          ]
          count=0
          for name in files:
              lines=pathlib.Path(name).read_text().splitlines()
              for index,line in enumerate(lines):
                  if not (line.strip().endswith("<<\x27PY\x27") or line.strip().endswith("<<PY")):
                      continue
                  end=index+1
                  while end < len(lines) and lines[end].strip() != "PY":
                      end+=1
                  if end == len(lines):
                      raise SystemExit("UNTERMINATED_PYTHON_HEREDOC")
                  compile(chr(10).join(lines[index+1:end]),name+":inline","exec")
                  count+=1
          if count < 3:
              raise SystemExit("EXPECTED_INLINE_PYTHON_HEREDOC_MISSING")
          example=subprocess.run([sys.executable,"-c","print(123)"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,universal_newlines=True)
          assert example.returncode==0 and example.stdout.strip()=="123"
          diag=pathlib.Path(files[0]).read_text()
          assert "capture_output=" not in diag and "text=True" not in diag
          print("ECS_PYTHON_36_SUBPROCESS_AND_INLINE_SYNTAX_PASS COUNT="+str(count))
          '
      - name: Validate pinned archive, blue-green isolation, fail-closed gates and rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in scripts/ops/globalsiai-notice-4290-canary.sh scripts/ops/globalsiai-notice-dual-host-cutover.sh; do
            bash -n "$f"
          done
          bash -n scripts/ops/cn-market-memory-auth-readonly-v2.sh
          grep -Fq 'AUTH_SYNTHETIC PORT=$port' scripts/ops/cn-market-memory-auth-readonly-v2.sh
          grep -Fq 'MEMORY_BYTES=$memory' scripts/ops/cn-market-memory-auth-readonly-v2.sh
          c=scripts/ops/globalsiai-notice-4290-canary.sh
          s=scripts/ops/globalsiai-notice-dual-host-cutover.sh
          grep -Fq 'SHA256=bcb466a235f55b4b5cb6d839b10fa16aff956bd255e68de20e1647c5a62f370e' "$c"
          grep -Fq 'PORT=4290' "$c"
          grep -Fq 'MEM_AVAILABLE_KB=' "$c"
          grep -Fq 'MemoryHigh=340M' "$c"
          grep -Fq 'MemoryMax=450M' "$c"
          grep -Fq 'max-old-space-size=256' "$c"
          grep -Fq 'GLOBALSIAI_NOTICE_MEMORY_BUDGET_ABORT_NEED_480M_AVAILABLE' "$c"
          grep -Fq 'GLOBALSIAI_NOTICE_4290_ACCEPTED_4289_AND_PUBLIC_NGINX_UNCHANGED' "$c"
          grep -Fq 'GLOBALSIAI_NOTICE_MAINLAND_ICP_LEAK_TO_COM_ABORT' "$c"
          grep -Fq 'GLOBALSIAI_BOTH_MARKET_DOMAINS_NOTICE_4290_LIVE_ACCEPTED' "$s"
          grep -Fq 'GLOBALSIAI_NOTICE_PROMOTION_REVERTED_TO_4289' "$s"
          grep -Fq 'globalsiai-dual-domain-public.lock' "$s"
          grep -Fq 'proxy_pass http://127.0.0.1:4289;' "$s"
          grep -Fq 'proxy_pass http://127.0.0.1:4290;' "$s"
          grep -Fq 'systemctl is-active --quiet globalsiai-market-notice-canary' "$s"
          ! grep -Eq 'systemctl (restart|stop|disable) (lingxifield-ecs|lingxifield-cn-stage|globalsiai-market-stage)' "$s"
          echo GLOBALSIAI_CANARY_AND_DUAL_HOST_ROLLBACK_SOURCE_GATE_PASS
