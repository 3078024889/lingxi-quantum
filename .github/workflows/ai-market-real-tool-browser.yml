name: LINGXIFIELD real tool browser delivery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/final-closure/ai-market-tool-journeys.spec.ts'
      - 'components/tools/ImageConvertWorkbench.tsx'
      - 'components/tools/ResultFileActions.tsx'
      - '.github/workflows/ai-market-real-tool-browser.yml'
permissions:
  contents: read
concurrency:
  group: real-tool-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-image-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chrome
      - name: Upload convert and verify JPEG output (browser runtime)
        run: pnpm exec playwright test -c playwright.final.config.ts tests/final-closure/ai-market-tool-journeys.spec.ts --project=desktop-chromium --workers=1
      - name: Retain test evidence on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: real-tool-browser-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
