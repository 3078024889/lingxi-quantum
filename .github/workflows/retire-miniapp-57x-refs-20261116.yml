name: One-time retirement of obsolete miniapp 5.7.x branches and stale CN artifact
on:
  push:
    branches:
      - fix/site-wallet-payment-readiness-20261116
    paths:
      - .github/workflows/retire-miniapp-57x-refs-20261116.yml
permissions:
  contents: write
  actions: write
jobs:
  retire:
    if: github.ref == 'refs/heads/fix/site-wallet-payment-readiness-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify retirement PRs are closed and unmerged
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for pr in 346 352 354 355; do
            state="$(gh api "repos/$GH_REPO/pulls/$pr" --jq '.state')"
            merged="$(gh api "repos/$GH_REPO/pulls/$pr" --jq '.merged')"
            [[ "$state" == "closed" && "$merged" == "false" ]] || {
              echo "RETIREMENT_GUARD_FAILED_PR_$pr state=$state merged=$merged" >&2
              exit 1
            }
          done
          echo "RETIREMENT_PR_GUARD_PASS"
      - name: Delete only the allowlisted retired miniapp branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          branches=(
            "fix/cn-miniapp-home-share-entry-20261115"
            "fix/cn-miniapp-wallet-entry-20261115"
            "fix/miniapp-5-7-6-cn-current-base-20261116"
            "fix/miniapp-5-7-wallet-share-20261115-cn"
            "fix/miniapp-cny-native-usd-website-20261116"
            "fix/miniapp-shell-share-recharge-20261115-cn"
            "fix/miniapp-shell-share-recharge-20261115-com"
            "fix/miniapp-wallet-website-only-20261115"
            "tmp/miniapp-574-cny-core-20261116"
            "fix/cn3194-mobile-account-icon-20261116"
          )
          refs="$(gh api "repos/$GH_REPO/git/matching-refs/heads")"
          open_prs="$(gh api "repos/$GH_REPO/pulls?state=open&per_page=100")"
          for branch in "${branches[@]}"; do
            if jq -e --arg ref "refs/heads/$branch" '.[] | select(.ref == $ref)' <<<"$refs" >/dev/null; then
              open_refs="$(jq --arg branch "$branch" '[.[] | select(.head.ref == $branch or .base.ref == $branch)] | length' <<<"$open_prs")"
              [[ "$open_refs" == "0" ]] || {
                echo "BRANCH_STILL_REFERENCED_BY_OPEN_PR:$branch" >&2
                exit 1
              }
              gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
              echo "RETIRED_BRANCH_DELETED:$branch"
            else
              echo "RETIRED_BRANCH_ALREADY_ABSENT:$branch"
            fi
          done
          echo "MINIAPP_57X_BRANCH_RETIREMENT_PASS"
      - name: Delete the stale 3194/3195 deployment artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_id=14208686510
          if gh api "repos/$GH_REPO/actions/artifacts/$artifact_id" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
            echo "STALE_CN3194_ARTIFACT_DELETED:$artifact_id"
          else
            echo "STALE_CN3194_ARTIFACT_ALREADY_ABSENT:$artifact_id"
          fi
