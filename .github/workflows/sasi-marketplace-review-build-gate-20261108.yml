name: SASI marketplace review and digital-delivery production gate (NO DEPLOY)
on:
  push:
    branches: [feat/sasi-market-review-auto-delivery-20261108]
    paths:
      - 'app/api/sasi/marketplace/**'
      - 'app/sasi/marketplace/admin/**'
      - 'components/SasiMarketplaceReviewConsole.tsx'
      - 'components/SasiOpenMarketplace.tsx'
      - 'components/SasiOpenMarketplace.module.css'
      - 'app/sasi/page.tsx'
      - 'lib/sasi-marketplace/**'
      - 'scripts/marketplace/**'
      - 'supabase/migrations/20261108193000_sasi_market_scanner_and_admin_review.sql'
      - 'tests/marketplace/**'
      - 'tests/sasi-marketplace-review-security-20261108.test.mjs'
      - '.github/workflows/sasi-marketplace-review-build-gate-20261108.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sasi-review-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Contract tests including auth and verified fulfillment
        run: |
          node --test tests/sasi-marketplace-review-security-20261108.test.mjs
          node tests/sasi-marketplace-security-contract.test.mjs
          node --test tests/sasi-com-closure-20261108.test.mjs
          node --test tests/cn-wallet-checkout-entry-20261108.test.mjs tests/cn-toolpass-public-ui-20261108.test.mjs
      - name: Private ZIP scanner policy and syntax
        run: |
          python3 -m py_compile scripts/marketplace/scan-private-zip.py
          python3 -m unittest discover -s tests/marketplace -p 'test_*.py' -v
      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit
      - name: Compile standalone Next.js only; never deploy
        env:
          LINGXI_SELFHOST_BUILD: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_TOOL_PASS_ENFORCED: 'true'
          NEXT_PUBLIC_SITE_URL: https://lingxifield.cn
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
        run: |
          pnpm build
          test -s .next/standalone/server.js
          echo SASI_REVIEW_BUILD_PASS_NO_DEPLOY
