  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: com-unified-sasi-canary-20261108
  cancel-in-progress: true
jobs:
  deploy-isolated:
    environment: cloudflare-production
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.com
      NEXT_PUBLIC_SUPABASE_URL: https://sxsgdpqojepgbbrxrzlq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Pin isolated candidate Worker to this exact source SHA
        run: echo "CANDIDATE_NAME=lingxifield-com-canary-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.28.0,run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc,cache: pnpm}
      - name: Check token and public authentication input without printing values
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
      - name: Re-run current exact-source safety and type gates
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile
          pnpm seo:growth:generate
          pnpm seo:growth:audit
          node scripts/seo/audit-global.cjs
          node --test tests/com-current-runtime-routing-20261108.test.mjs
          node --check scripts/cloudflare/materialize-static-html-assets-20261110.mjs
          node --check scripts/cloudflare/tool-static-route-manifest-20261110.mjs
          node --test tests/com-static-assets-first-20261110.test.mjs
          bash -n scripts/cloudflare/build-com-static-assets-20261110.sh
          node --test tests/com-celestial-release-safety-20261110.test.mjs
          node --test tests/com-public-market-edge.test.mjs
          node tests/sasi-marketplace-security-contract.test.mjs
          node --test tests/sasi-software-public-branding-20261108.test.mjs
          node --test tests/com-merchant-public-about-nine-language-20261109.test.mjs
          node --test tests/sasi-marketplace-long-description-20261109.test.mjs
          node --test tests/sasi-premium-nine-language-20261109.test.mjs
          node --test tests/toolpass-premium-nine-language-20261109.test.mjs
          node --test tests/public-announcements-deeplink-20261108.test.mjs
          node --test tests/sasi-marketplace-review-security-20261108.test.mjs
          node --test tests/sasi-software-verified-fulfillment-20261108.test.mjs
          node tests/toolpass-direct-fulfillment-20261108.test.mjs
          node tests/paypal-merchant-idempotency-20261108.test.mjs
          node --test tests/com-paypal-live-review-20261109.test.mjs
          node --test tests/com-sasi-account-anon-401-20261109.test.mjs
          node --test tests/com-account-static-client-auth-20261110.test.mjs
          node --test tests/com-anonymous-private-edge-20261110.test.mjs
          node --test tests/sasi-marketplace-draft-revision-20261110.test.mjs
          node --test tests/cn-wallet-checkout-entry-20261108.test.mjs
          node --test tests/celestial-premium-wallet-account-tools-20261109.test.mjs tests/cn-toolpass-public-ui-20261108.test.mjs
          node --test tests/sasi-com-closure-20261108.test.mjs tests/com-next-release-safety-20261108.test.mjs
          node --test tests/com-wallet-static-session-contract-20261108.test.mjs
          node --test tests/com-payment-edge-merchant-readiness-20261108.test.mjs
          pnpm exec tsc --noEmit
      - name: Diagnose anonymous database catalog from GitHub runner without payment changes
        run: |
          node scripts/ops/probe-sasi-anonymous-rest-20261109.mjs
      - name: Build static candidate assets and generate verified anonymous snapshots
        run: bash scripts/cloudflare/build-com-static-assets-20261110.sh
      - name: Build isolated candidate config with NO production DNS or Worker routes
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const j=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(j.name!=='lingxifield-main-global-testonly')throw Error('SOURCE_WORKER_CONFIG_CHANGED');
          if((j.r2_buckets||[]).length!==1||j.r2_buckets[0].bucket_name!=='lingxifield-com-large-public')throw Error('R2_BINDING_UNEXPECTED');
          j.name=process.env.CANDIDATE_NAME;
          j.workers_dev=true;
          // The previous public gateway remains an internal API service, not a DNS route.
          // Cloudflare service binding forwards original Request (auth/session/cookies intact).
          j.services=[{binding:'LINGXI_COM_LEGACY_GATEWAY',service:'lingxifield-com-static-gateway-canary-20261107'}];
          // Wrangler >=4.150 uploads maps by default; current minified map is >60MiB.
          j.upload_source_maps=false;
          delete j.route;delete j.routes;
          j.vars={
            NEXT_PUBLIC_SITE_URL:'https://lingxifield.com',
            NEXT_PUBLIC_SUPABASE_URL:process.env.NEXT_PUBLIC_SUPABASE_URL,
            NEXT_PUBLIC_SUPABASE_ANON_KEY:process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY,
            SUPABASE_URL:process.env.NEXT_PUBLIC_SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY:process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY,
            SUPABASE_ANON_KEY:process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY,
            TOOL_PASS_COMMERCE_READY:'false',
            SASI_MARKET_SALES_ENABLED:'false',
            SASI_MARKET_UPLOADS_ENABLED:'false',
            SASI_MARKET_PAYOUTS_ENABLED:'false',
            SASI_MARKET_DELIVERY_ENABLED:'false',
            SOFTWARE_COMMERCE_READY:'false',
            ALIPAY_ENABLED:'false',
            PAYPAL_ENABLED:'false',
            WECHAT_ENABLED:'false'
          };
          fs.writeFileSync('wrangler.candidate.jsonc',JSON.stringify(j,null,2));
          const again=JSON.parse(fs.readFileSync('wrangler.candidate.jsonc','utf8'));
          if(again.name!==process.env.CANDIDATE_NAME||again.workers_dev!==true||again.routes||again.route)throw Error('UNSAFE_PRODUCTION_ROUTE_CONFIG');
          if(again.services?.length!==1||again.services[0].service!=='lingxifield-com-static-gateway-canary-20261107')throw Error('COM_LEGACY_API_SERVICE_NOT_PRESERVED');
          console.log('ISOLATED_CANDIDATE_ROUTES_NONE_PAYMENT_DISABLED');
          NODE
          pnpm exec wrangler deploy --config wrangler.candidate.jsonc --minify --dry-run --outdir "$RUNNER_TEMP/cf-candidate-dry-run"
      - name: Prove canary Worker is not the live apex, www or any protected route
        run: |
          set -Eeuo pipefail
          base="https://api.cloudflare.com/client/v4"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          status="$(curl -sS --max-time 25 -o "$tmp" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/zones?name=lingxifield.com")"
          test "$status" = 200
          zone="$(jq -r '.result[]|select(.name=="lingxifield.com" and .status=="active")|.id' "$tmp")"
          test -n "$zone"
          test "$(wc -l <<< "$zone")" = 1
          status="$(curl -sS --max-time 25 -o "$tmp" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/zones/$zone/workers/routes")"
          test "$status" = 200
          jq -e --arg name "$CANDIDATE_NAME" '[.result[]|select(.script==$name)]|length==0' "$tmp"
          jq -e --arg production "lingxifield-com-celestial-20261109" '[.result[]|select(.pattern=="lingxifield.com/*" and .script==$production)]|length==1' "$tmp"
          echo "COM_CURRENT_PRODUCTION_APEX_WORKER_VERIFIED=lingxifield-com-celestial-20261109"
          jq -e '[.result[]|select(.pattern=="lingxifield.com/*")]|length==1' "$tmp"
          jq -e '[.result[]|select(.pattern=="www.lingxifield.com/*")]|length==1' "$tmp"
          echo "COM_NEXT_CANARY_UNROUTED_VERIFIED"

      - name: Deploy NO ROUTES candidate to isolated workers.dev only
        run: |
          set -Eeuo pipefail
          pnpm exec wrangler deploy --config wrangler.candidate.jsonc --minify --no-upload-source-maps --keep-vars 2>&1 | tee "$RUNNER_TEMP/candidate-deployment.log"
          echo 'COM_CANDIDATE_CLOUDFLARE_WORKER_DEPLOYED_NO_CUSTOM_DOMAIN_ROUTE'
      - name: Validate real cloudflare.com candidate HTTP routes, R2 Range and SASI anon security
        shell: bash
        run: |
          set -Eeuo pipefail
          url="https://${CANDIDATE_NAME}.3078024889.workers.dev"
          test -n "$url"
          echo "COM_CANARY_URL=$url"
          # Workers.dev deployment propagation may initially return 404.
          # Wait for a real 200 on the isolated health endpoint, never bypass other probes.
          propagated=0
          for attempt in $(seq 1 24);do
            code="$(curl -4sS --connect-timeout 7 --max-time 18 -o /dev/null -w '%{http_code}' "$url/api/health" || true)"
            echo "COM_CANARY_PROPAGATION attempt=$attempt HTTP_$code"
            if [[ "$code" = 200 ]];then propagated=1;break;fi
            sleep 5
          done
          test "$propagated" -eq 1
          for path in / /siai /tools /tools/pass /tools/png-to-jpg /tools/compress-image /tools/merge-pdf /tools/json-formatter /ai-wallet /account /sasi /about /announcements /api/health /api/pay/providers /api/sasi/marketplace/listings /en/siai /ja/siai /ko/siai /fr/siai /de/siai /es/siai /pt/siai /ar/siai /api/sasi/software/catalog /discover/sasi-software-marketplace /en/discover/mt5-ea-source-code /ja/discover/software-licensing-delivery /ko/discover/developer-software-publishing /fr/discover/sasi-software-marketplace /de/discover/mt5-ea-source-code /es/discover/software-licensing-delivery /pt/discover/developer-software-publishing /ar/discover/sasi-software-marketplace /llms.txt /sitemap.xml /robots.txt;do
            count=0
            for i in 1 2 3;do
              h="$(mktemp)"
              status="$(curl -4sS --connect-timeout 9 --max-time 30 -D "$h" -o /dev/null -w '%{http_code}' "$url$path" || true)"
              echo "COM_CANARY_PAGE path=$path repetition=$i HTTP_$status"
              if [[ "$path" = "/api/sasi/marketplace/listings" ]];then
                diagnostic="$(grep -i '^x-lingxi-catalog-diagnostic:' "$h" | tr -d '\r' | head -n 1 || true)"
                echo "COM_CANARY_CATALOG_STATUS ${diagnostic:-no-edge-diagnostic}"
              fi
              test "$status" = 200 || exit 1
              if [[ "$path" = / || "$path" = /account || "$path" = /api/sasi/software/catalog || "$path" = /tools || "$path" = /tools/pass || "$path" = /tools/png-to-jpg || "$path" = /tools/compress-image || "$path" = /tools/merge-pdf || "$path" = /tools/json-formatter || "$path" = /ai-wallet || "$path" = /sasi || "$path" = /about || "$path" = /announcements || "$path" == */discover/* ]];then
                grep -iq '^x-lingxi-render-mode: static-edge-verified' "$h"
                if [[ "$path" != "/api/sasi/software/catalog" ]];then
                  grep -iq '^x-lingxi-static-delivery: workers-static-assets' "$h"
                fi
              fi
              rm -f "$h"
              count=$((count+1))
            done
            test "$count" = 3
          done
           node -e 'const u=process.argv[1];fetch(u,{redirect:"manual"}).then(r=>{const t=new URL(r.headers.get("location")||"",u);console.log("COM_CANARY_LEGACY_MARKET_REDIRECT HTTP_"+r.status+" location="+r.headers.get("location"));if(r.status!==308||t.pathname!=="/sasi")process.exit(1)}).catch(e=>{console.error(e);process.exit(1)})' "$url/sasi/marketplace"
           node -e 'const base=process.argv[1];const aliases=["/sasi/marketplace","/sasi/assemble","/sasi/build","/sasi/chat","/sasi/connections","/sasi/director","/sasi/drama","/sasi/image","/sasi/operator","/sasi/operator/v5","/sasi/project-dna","/sasi/series","/sasi/variants","/ai-knowledge","/ai-learning","/ai-research"];(async()=>{for(const path of aliases){const r=await fetch(base+path,{redirect:"manual"});const u=new URL(r.headers.get("location")||"",base);console.log("COM_CANARY_RETIRED_ALIAS "+path+" HTTP_"+r.status+" "+u.pathname);if(r.status!==308||u.origin!==new URL(base).origin||u.pathname!=="/sasi")throw Error("RETIRED_ALIAS_FAILED:"+path)}const p=await fetch(base+"/sasi/pricing",{redirect:"manual"});const t=new URL(p.headers.get("location")||"",base);if(p.status!==308||t.pathname!=="/ai-wallet")throw Error("RETIRED_PRICING_ALIAS_FAILED");console.log("COM_CANARY_ALL_RETIRED_ALIASES_PASS")})().catch(e=>{console.error(e);process.exit(1)})' "$url"
           node -e 'const base=process.argv[1];const topics=["sasi-software-marketplace","mt5-ea-source-code","software-licensing-delivery","developer-software-publishing"];(async()=>{const page=await fetch(base+"/discover/sasi-software-marketplace");const html=await page.text();if(page.status!==200||!html.includes("SASI 智能软件市场")||!html.includes("canonical"))throw Error("SASI_GEO_LANDING_FAILED");const sitemap=await (await fetch(base+"/sitemap.xml")).text();for(const topic of topics)if(!sitemap.includes("/discover/"+topic))throw Error("SITEMAP_TOPIC_MISSING:"+topic);for(const old of ["ai-short-drama-generator","book-to-ai-agent","document-ai-agent","learning-ai-agent","research-ai-agent","ai-website-builder"])if(sitemap.includes("/discover/"+old))throw Error("RETIRED_GEO_TOPIC_IN_SITEMAP:"+old);const llms=await (await fetch(base+"/llms.txt")).text();if(!llms.includes("SASI Software Marketplace")||llms.includes("AI Short Drama Generator"))throw Error("LLMS_GEO_TOPIC_MISMATCH");console.log("COM_CANARY_SASI_GEO_SITEMAP_LLMS_PASS")})().catch(e=>{console.error(e);process.exit(1)})' "$url"
          for path in /siai/ /tools/ /tools/pass/ /sasi/ /sasi/marketplace/ /en/siai/;do
            headers="$(mktemp)"
            status="$(curl -4sS --connect-timeout 9 --max-time 25 -D "$headers" -o /dev/null -w '%{http_code}' "$url$path" || true)"
            location="$(grep -i '^location:' "$headers" | head -n 1 | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '\r')"
            expected="$url${path%/}"
            echo "COM_CANARY_CANONICAL_SLASH path=$path HTTP_$status location=$location"
            test "$status" = 308
            [[ "$location" == "$expected" || "$location" == "${path%/}" ]]
            rm -f "$headers"
          done
          account_status="$(curl -4sS --connect-timeout 9 --max-time 25 -o /dev/null -w '%{http_code}' "$url/account" || true)"
          echo "COM_CANARY_ACCOUNT_ROUTE HTTP_$account_status"
          test "$account_status" = 200
          for path in /api/money/summary /api/sasi/marketplace/seller /api/sasi/marketplace/my-orders /api/sasi/account;do
            body="$(mktemp)"
            status="$(curl -4sS --connect-timeout 9 --max-time 25 -o "$body" -w '%{http_code}' "$url$path" || true)"
            reason="UNKNOWN"
            if grep -q "SERVICE_UNAVAILABLE" "$body";then reason="SERVICE_UNAVAILABLE";fi
            if grep -q "MONEY_SUMMARY_UNAVAILABLE" "$body";then reason="MONEY_SUMMARY_UNAVAILABLE";fi
            if grep -q "UNAUTHORIZED" "$body";then reason="UNAUTHORIZED";fi
            echo "COM_CANARY_PRIVATE_ROUTE path=$path HTTP_$status reason=$reason"
            if [[ "$path" == "/api/money/summary" && "$status" == "503" ]];then
              bytes="$(wc -c < "$body")"
              if [[ "$bytes" -gt 2048 ]] || grep -Eiq 'availableMinor|refundableMinor|refundHoldMinor|balances|withdrawals' "$body";then
                echo "COM_CANARY_BALANCE_503_PRIVATE_PAYLOAD_REJECTED"
                rm -f "$body";exit 1
              fi
              echo "COM_CANARY_BALANCE_DYNAMIC_DEFERRED_503_NO_DATA"
            else
              [[ "$status" == "401" ]] || { rm -f "$body";exit 1; }
            fi
            rm -f "$body"
          done
          for asset in /media/ffmpeg-0.12.10/ffmpeg-core.wasm /models/Xenova/clip-vit-base-patch32/onnx/text_model_quantized.onnx;do
            headers="$(mktemp)"
            status="$(curl -4sS --connect-timeout 9 --max-time 30 -D "$headers" -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-1023' "$url$asset" || true)"
            echo "COM_CANARY_R2_RANGE path=$asset HTTP_$status"
            test "$status" = 206 || exit 1
            grep -iq '^content-range: bytes 0-1023/' "$headers"
            rm -f "$headers"
          done
          echo 'COM_NEXT_ISOLATED_CANARY_SASI_TOOLPASS_STATIC_R2_PASS_NO_PRODUCTION_ROUTE'
