permissions:
  contents: read
  actions: read
concurrency:
  group: lingxifield-com-apex-one-time-release
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.28.0,run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc,cache: pnpm}
      - name: Install exact locked source-test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm seo:growth:generate && pnpm seo:growth:audit && node scripts/seo/audit-global.cjs
      - name: Pin exact verified candidate and check safe script
        run: |
          set -Eeuo pipefail
          node --check scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          node --check scripts/cloudflare/materialize-static-html-assets-20261110.mjs
          node --check scripts/cloudflare/tool-static-route-manifest-20261110.mjs
          bash -n scripts/cloudflare/build-com-static-assets-20261110.sh
          node --test tests/com-static-assets-first-20261110.test.mjs
          node --test tests/com-account-static-client-auth-20261110.test.mjs
          node --test tests/com-celestial-release-safety-20261110.test.mjs
          node --test tests/com-preserved-binding-inventory-20261110.test.mjs
          node scripts/seo/audit-global.cjs
          node --test tests/legacy-sasi-retirement.test.mjs tests/seo-fullsite-coverage.test.mjs tests/sasi-transparent-hero-20261112.test.mjs
          grep -Fq 'const productionWorker = "lingxifield-com-celestial-20261109"' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq 'const candidateWorkerPrefix = "lingxifield-com-canary-"' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq 'COM_PRODUCTION_PAYMENT_BASELINE' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq 'json.diagnostics[name].missingCount' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq 'COM_PRODUCTION_VERSION_ROLLBACK_CONFIRMED' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq 'COM_PRODUCTION_BINDING_PREFLIGHT_PASS' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq 'COM_REFERENCE_DESIGN_CONTENT_GATE_PASS' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq 'SASI / FEATURED' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq '03 / SELLER STUDIO' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq '"--keep-vars"' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq '"/api/sasi/account"' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq '"/ai-wallet"' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          echo COM_UNIFIED_ROUTE_SCRIPT_SOURCE_GATE_PASS
  release:
    # Only an explicitly pinned later commit may trigger production cutover.
    if: github.event_name == 'push' && github.event.head_commit.message == 'COM_PINNED_SASI_RELEASE_TRIGGER'
    needs: source
    environment: cloudflare-production
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.com
      NEXT_PUBLIC_SUPABASE_URL: https://sxsgdpqojepgbbrxrzlq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.28.0,run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc,cache: pnpm}
      - name: Install exact locked build dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify anonymous public catalog preflight
        run: node scripts/ops/probe-sasi-anonymous-rest-20261109.mjs
      - name: Rebuild the exact pinned source and verified static assets
        run: bash scripts/cloudflare/build-com-static-assets-20261110.sh
      - name: Wait for the exact successful isolated canary for the previous release commit
        id: canary
        env:
          EXPECTED_SHA: ${{ github.event.before }}
          GH_REPO: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs=require("node:fs");
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          (async()=>{
            const expected=process.env.EXPECTED_SHA;
            if(!/^[a-f0-9]{40}$/.test(expected||""))throw Error("INVALID_PREVIOUS_RELEASE_SHA");
            const url="https://api.github.com/repos/"+process.env.GH_REPO+
              "/actions/workflows/com-unified-next-isolated-canary-20261108.yml/runs?branch=release/com-sasi-full-20261108&per_page=100";
            for(let attempt=1;attempt<=30;attempt++){
              const response=await fetch(url,{headers:{
                authorization:"Bearer "+process.env.GH_TOKEN,
                accept:"application/vnd.github+json",
                "user-agent":"lingxifield-exact-canary-gate"
              },signal:AbortSignal.timeout(20000)});
              if(!response.ok)throw Error("CANARY_RUN_LIST_HTTP_"+response.status);
              const body=await response.json();
              const matches=(body.workflow_runs||[]).filter(x=>
                x.head_sha===expected &&
                x.head_branch==="release/com-sasi-full-20261108" &&
                x.name==="COM unified wallet SASI ToolPass isolated canary (NO PROD ROUTES)"
              );
              const successful=matches.filter(x=>x.status==="completed"&&x.conclusion==="success")
                .sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
              if(successful.length){
                const run=successful[0];
                fs.appendFileSync(process.env.GITHUB_OUTPUT,"run_id="+run.id+"\nsha="+run.head_sha+"\n");
                console.log("EXACT_CANARY_PINNED run_id="+run.id+" sha="+run.head_sha);
                return;
              }
              const pending=matches.some(x=>x.status!=="completed");
              console.log("WAITING_FOR_EXACT_CANARY attempt="+attempt+"/30 sha="+expected+
                " matching_runs="+matches.length+" pending="+pending);
              if(!pending&&matches.length){
                throw Error("EXACT_CANARY_COMPLETED_WITHOUT_SUCCESS:"+expected);
              }
              if(attempt<30)await wait(60000);
            }
            throw Error("EXACT_CANARY_TIMEOUT:"+expected);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify identical application source and all seven public R2 objects before cutover
        env:
          VERIFIED_CANARY_SHA: ${{ steps.canary.outputs.sha }}
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only "$VERIFIED_CANARY_SHA" HEAD)"
          test "$changed" = '.github/workflows/com-unified-verified-apex-release-20261108.yml'
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const sha=process.env.VERIFIED_CANARY_SHA;
          if(!/^[a-f0-9]{40}$/.test(sha||''))throw Error('INVALID_EXACT_CANARY_SHA');
          const base='https://lingxifield-com-canary-'+sha.slice(0,12)+'.3078024889.workers.dev';
          const report=JSON.parse(await readFile('cloudflare-offload-report.json','utf8'));
          if(report.bucketName!=='lingxifield-com-large-public'||report.assets?.length!==7)throw Error('PUBLIC_R2_MANIFEST_MISMATCH');
          for(const asset of report.assets){
            if(!/^\/(models|runtime|media|_next\/static\/media)\/[a-zA-Z0-9._/-]+$/.test(asset.path)||asset.path.includes('..')||asset.r2Key!=='public'+asset.path||!/^[a-f0-9]{64}$/.test(asset.sha256))throw Error('INVALID_PUBLIC_R2_MANIFEST_ENTRY');
            const head=await fetch(base+asset.path,{method:'HEAD',headers:{'accept-encoding':'identity'},signal:AbortSignal.timeout(60000)});
            if(head.status!==200||Number(head.headers.get('content-length'))!==asset.bytes)throw Error('PUBLIC_R2_HEAD_MISMATCH:'+asset.path);
            const range=await fetch(base+asset.path,{headers:{range:'bytes=0-1023'},signal:AbortSignal.timeout(60000)});
            if(range.status!==206||range.headers.get('content-range')!==`bytes 0-1023/${asset.bytes}`||(await range.arrayBuffer()).byteLength!==1024)throw Error('PUBLIC_R2_RANGE_MISMATCH:'+asset.path);
            const response=await fetch(base+asset.path,{signal:AbortSignal.timeout(300000)});
            if(response.status!==200)throw Error('PUBLIC_R2_READ_FAILED:'+asset.path);
            let bytes=0;const hash=createHash('sha256');
            for await(const chunk of response.body){bytes+=chunk.length;hash.update(chunk);}
            if(bytes!==asset.bytes||hash.digest('hex')!==asset.sha256)throw Error('PUBLIC_R2_SHA256_MISMATCH:'+asset.path);
            console.log('COM_ALL_R2_OBJECT_VERIFIED '+JSON.stringify({path:asset.path,bytes,sha256:asset.sha256}));
          }
          console.log('COM_SEVEN_PUBLIC_R2_OBJECTS_BYTE_FOR_BYTE_VERIFIED_NO_WRITES');
          NODE

      - name: Verify exact canary and atomically switch apex with rollback
        env:
          COM_VERIFIED_CANARY_RUN: ${{ steps.canary.outputs.run_id }}
          COM_VERIFIED_CANARY_SHA: ${{ steps.canary.outputs.sha }}
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$GH_TOKEN"
          test -n "$COM_VERIFIED_CANARY_RUN" && test -n "$COM_VERIFIED_CANARY_SHA"
          node scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs

# COM_PINNED_SASI_RELEASE_TRIGGER_MARKER_20261113: exact application source 270a06ce39d2a9cd559147ab9d8a7c096a09a1ce must have a successful isolated canary.

# COM_PINNED_SASI_RELEASE_TRIGGER_20261114_REFERENCE_GATE: previous source 4db5f905680a2a8bb584da9e446b43b8701d76b9 must pass its exact isolated canary; poll until completion, then require rendered reference-content checks plus R2, provider, binding and rollback gates.
