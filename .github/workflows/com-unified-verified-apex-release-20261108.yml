name: COM verified unified SASI apex release (exact canary and rollback)
on:
  pull_request:
    branches: [release/com-sasi-full-20261108]
    paths:
      - '.github/workflows/com-unified-verified-apex-release-20261108.yml'
      - 'scripts/cloudflare/com-unified-apex-verified-cutover-20261108.mjs'
      - 'scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs'
      - 'scripts/cloudflare/materialize-static-html-assets-20261110.mjs'
      - 'app/account/page.tsx'
      - 'app/account/AccountClientShell.tsx'
      - 'components/AccountCenterV26.tsx'
      - 'scripts/cloudflare/patch-critical-static-html-20261108.mjs'
      - 'tests/com-account-static-client-auth-20261110.test.mjs'
      - 'wrangler.jsonc'
  push:
    branches: [release/com-sasi-full-20261108]
    paths:
      - '.github/workflows/com-unified-verified-apex-release-20261108.yml'
      - 'scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs'
      - 'scripts/cloudflare/materialize-static-html-assets-20261110.mjs'
      - 'app/account/page.tsx'
      - 'app/account/AccountClientShell.tsx'
      - 'components/AccountCenterV26.tsx'
      - 'scripts/cloudflare/patch-critical-static-html-20261108.mjs'
      - 'tests/com-account-static-client-auth-20261110.test.mjs'
      - 'wrangler.jsonc'
permissions:
  contents: read
  actions: read
concurrency:
  group: lingxifield-com-apex-one-time-release
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Pin exact verified candidate and check safe script
        run: |
          set -Eeuo pipefail
          node --check scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          node --check scripts/cloudflare/materialize-static-html-assets-20261110.mjs
          node --test tests/com-static-assets-first-20261110.test.mjs
          node --test tests/com-account-static-client-auth-20261110.test.mjs
          grep -Fq 'const prev="lingxifield-com-unified-20261108"' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq 'const next="lingxifield-com-celestial-20261109"' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq 'COM_POSTCUTOVER_HEALTH_FAIL_ROLLBACK_BEGIN' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq 'const maxTries=phase==="POSTCUTOVER"?12:attempts' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq '"/api/sasi/account"' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq '"/ai-wallet"' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq 'COM_BALANCE_DYNAMIC_DEFERRED_503_NO_DATA' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          if grep -Fq 'COM_LEGACY_WALLET_PREFLIGHT' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs; then exit 1; fi
          echo COM_UNIFIED_ROUTE_SCRIPT_SOURCE_GATE_PASS
  release:
    # Only an explicitly pinned later commit may trigger production cutover.
    if: github.event_name == 'push' && github.event.head_commit.message == 'COM_PINNED_SASI_RELEASE_TRIGGER'
    needs: source
    environment: cloudflare-production
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Resolve exact successful isolated canary for the previous release commit
        id: canary
        env:
          EXPECTED_SHA: ${{ github.event.before }}
          GH_REPO: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs=require("node:fs");
          (async()=>{
            const url="https://api.github.com/repos/"+process.env.GH_REPO+
              "/actions/workflows/com-unified-next-isolated-canary-20261108.yml/runs?branch=release/com-sasi-full-20261108&status=success&per_page=100";
            const response=await fetch(url,{headers:{
              authorization:"Bearer "+process.env.GH_TOKEN,
              accept:"application/vnd.github+json",
              "user-agent":"lingxifield-exact-canary-gate"
            }});
            if(!response.ok)throw Error("CANARY_RUN_LIST_HTTP_"+response.status);
            const body=await response.json();
            const matches=(body.workflow_runs||[]).filter(x=>
              x.head_sha===process.env.EXPECTED_SHA &&
              x.head_branch==="release/com-sasi-full-20261108" &&
              x.name==="COM unified wallet SASI ToolPass isolated canary (NO PROD ROUTES)" &&
              x.status==="completed" && x.conclusion==="success"
            ).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
            if(!matches.length)throw Error("NO_SUCCESSFUL_CANARY_FOR_PREVIOUS_COMMIT:"+process.env.EXPECTED_SHA);
            const run=matches[0];
            fs.appendFileSync(process.env.GITHUB_OUTPUT,"run_id="+run.id+"\nsha="+run.head_sha+"\n");
            console.log("EXACT_CANARY_PINNED run_id="+run.id+" sha="+run.head_sha);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify exact canary and atomically switch apex with rollback
        env:
          COM_VERIFIED_CANARY_RUN: ${{ steps.canary.outputs.run_id }}
          COM_VERIFIED_CANARY_SHA: ${{ steps.canary.outputs.sha }}
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$GH_TOKEN"
          test -n "$COM_VERIFIED_CANARY_RUN" && test -n "$COM_VERIFIED_CANARY_SHA"
          node scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs

# COM_PINNED_SASI_RELEASE_TRIGGER_MARKER_20261110: exact previous SHA is guarded by the isolated canary workflow.
