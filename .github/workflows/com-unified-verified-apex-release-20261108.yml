permissions:
  contents: read
  actions: read
concurrency:
  group: lingxifield-com-apex-one-time-release
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.28.0,run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc,cache: pnpm}
      - name: Install exact locked source-test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm seo:growth:generate && pnpm seo:growth:audit && node scripts/seo/audit-global.cjs
      - name: Pin exact verified candidate and check safe script
        run: |
          set -Eeuo pipefail
          node --check scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          node --check scripts/cloudflare/materialize-static-html-assets-20261110.mjs
          node --check scripts/cloudflare/tool-static-route-manifest-20261110.mjs
          bash -n scripts/cloudflare/build-com-static-assets-20261110.sh
          node --test tests/com-static-assets-first-20261110.test.mjs
          node --test tests/com-account-static-client-auth-20261110.test.mjs
          node --test tests/com-celestial-release-safety-20261110.test.mjs
          node --test tests/com-preserved-binding-inventory-20261110.test.mjs
          node scripts/seo/audit-global.cjs
          node --test tests/legacy-sasi-retirement.test.mjs tests/seo-fullsite-coverage.test.mjs tests/sasi-transparent-hero-20261112.test.mjs
          grep -Fq 'const productionWorker = "lingxifield-com-celestial-20261109"' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq 'const candidateWorkerPrefix = "lingxifield-com-canary-"' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq 'COM_PRODUCTION_PAYMENT_BASELINE' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq 'json.diagnostics[name].missingCount' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq 'COM_PRODUCTION_VERSION_ROLLBACK_CONFIRMED' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq 'COM_PRODUCTION_BINDING_PREFLIGHT_PASS' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq '"--keep-vars"' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq '"/api/sasi/account"' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          grep -Fq '"/ai-wallet"' scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs
          echo COM_UNIFIED_ROUTE_SCRIPT_SOURCE_GATE_PASS
  release:
    # Only an explicitly pinned later commit may trigger production cutover.
    if: github.event_name == 'push' && github.event.head_commit.message == 'COM_PINNED_SASI_RELEASE_TRIGGER'
    needs: source
    environment: cloudflare-production
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.com
      NEXT_PUBLIC_SUPABASE_URL: https://sxsgdpqojepgbbrxrzlq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.28.0,run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc,cache: pnpm}
      - name: Install exact locked build dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify anonymous public catalog preflight
        run: node scripts/ops/probe-sasi-anonymous-rest-20261109.mjs
      - name: Rebuild the exact pinned source and verified static assets
        run: bash scripts/cloudflare/build-com-static-assets-20261110.sh
      - name: Resolve exact successful isolated canary for the previous release commit
        id: canary
        env:
          EXPECTED_SHA: ${{ github.event.before }}
          GH_REPO: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs=require("node:fs");
          (async()=>{
            const url="https://api.github.com/repos/"+process.env.GH_REPO+
              "/actions/workflows/com-unified-next-isolated-canary-20261108.yml/runs?branch=release/com-sasi-full-20261108&status=success&per_page=100";
            const response=await fetch(url,{headers:{
              authorization:"Bearer "+process.env.GH_TOKEN,
              accept:"application/vnd.github+json",
              "user-agent":"lingxifield-exact-canary-gate"
            }});
            if(!response.ok)throw Error("CANARY_RUN_LIST_HTTP_"+response.status);
            const body=await response.json();
            const matches=(body.workflow_runs||[]).filter(x=>
              x.head_sha===process.env.EXPECTED_SHA &&
              x.head_branch==="release/com-sasi-full-20261108" &&
              x.name==="COM unified wallet SASI ToolPass isolated canary (NO PROD ROUTES)" &&
              x.status==="completed" && x.conclusion==="success"
            ).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
            if(!matches.length)throw Error("NO_SUCCESSFUL_CANARY_FOR_PREVIOUS_COMMIT:"+process.env.EXPECTED_SHA);
            const run=matches[0];
            fs.appendFileSync(process.env.GITHUB_OUTPUT,"run_id="+run.id+"\nsha="+run.head_sha+"\n");
            console.log("EXACT_CANARY_PINNED run_id="+run.id+" sha="+run.head_sha);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify exact canary and atomically switch apex with rollback
        env:
          COM_VERIFIED_CANARY_RUN: ${{ steps.canary.outputs.run_id }}
          COM_VERIFIED_CANARY_SHA: ${{ steps.canary.outputs.sha }}
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$GH_TOKEN"
          test -n "$COM_VERIFIED_CANARY_RUN" && test -n "$COM_VERIFIED_CANARY_SHA"
          node scripts/cloudflare/com-celestial-apex-verified-cutover-20261109.mjs

# COM_PINNED_SASI_RELEASE_TRIGGER_MARKER_20261112: exact previous SHA f21a1b48eda20bf5610f69d1684e63bbfbbe0d87 has a successful isolated canary.
