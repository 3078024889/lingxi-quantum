name: Cloudflare COM full Worker workerd local runtime smoke (NO DEPLOY)
on:
  push:
    branches: [cloudflare/com-workerd-local-smoke-20261107]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cf-workerd-local-smoke
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.com
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: {version: 11.28.0, run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version-file: .nvmrc, cache: pnpm}
      - name: Validate public auth config from GitHub repository variables
        run: |
          set -Eeuo pipefail
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://sxsgdpqojepgbbrxrzlq.supabase.co"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || {
            echo "::error::GitHub repo variable NEXT_PUBLIC_SUPABASE_ANON_KEY missing"
            exit 1
          }
      - run: pnpm install --frozen-lockfile
      - name: Install tested OpenNext adapter into disposable runner only
        run: pnpm add -D @opennextjs/cloudflare@1.20.16 wrangler@4.158.0 --save-exact
      - name: Compile full main site into Cloudflare workerd
        run: |
          set -Eeuo pipefail
          node --test tests/cloudflare-large-public-assets.test.mjs
          pnpm exec opennextjs-cloudflare build
          node scripts/cloudflare/stage-large-public-assets.mjs
          pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/cf-dry-run"
      - name: Launch LOCAL workerd and probe actual SSR and anonymous protected APIs
        shell: bash
        run: |
          set -Eeuo pipefail
          # The .dev.vars contains only PUBLIC Supabase client values and is never uploaded.
          {
            printf 'SUPABASE_URL="%s"\n' "$NEXT_PUBLIC_SUPABASE_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY="%s"\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            printf 'SUPABASE_ANON_KEY="%s"\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            printf 'NEXT_PUBLIC_SUPABASE_URL="%s"\n' "$NEXT_PUBLIC_SUPABASE_URL"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY="%s"\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          } > .dev.vars
          chmod 600 .dev.vars
          pnpm exec wrangler dev --local --ip 127.0.0.1 --port 8787 --log-level error > "$RUNNER_TEMP/workerd-smoke.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; rm -f .dev.vars' EXIT
          ready=0
          for i in $(seq 1 75); do
            if curl --noproxy '*' -sS -o /dev/null --max-time 3 'http://127.0.0.1:8787/api/health'; then
              ready=1
              break
            fi
            kill -0 "$PID" || { echo "::error::workerd process exited"; break; }
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "::error::WORKERD_CANNOT_START"
            tail -n 35 "$RUNNER_TEMP/workerd-smoke.log" | sed -E 's/(sb_publishable_|eyJ)[A-Za-z0-9_.-]{20,}/[REDACTED]/g'
            exit 1
          fi
          for pair in '/ 200' '/siai 200' '/api/health 200' '/api/sasi/account 401' '/api/tools/jobs 401'; do
            path="${pair% *}"; want="${pair##* }"
            got=$(curl --noproxy '*' --silent --show-error --max-time 25 --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8787$path")
            echo "CLOUDFLARE_WORKERD_LOCAL_CHECK:$path:$got"
            if [ "$got" != "$want" ]; then
              echo "::error::CLOUDFLARE_WORKERD_ENDPOINT_MISMATCH:$path:expected$want:got$got"
              tail -n 35 "$RUNNER_TEMP/workerd-smoke.log" | sed -E 's/(sb_publishable_|eyJ)[A-Za-z0-9_.-]{20,}/[REDACTED]/g'
              exit 1
            fi
          done
          model=$(curl --noproxy '*' --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:8787/runtime/food-onnx/ort-wasm-simd-threaded.asyncify.wasm')
          echo "CLOUDFLARE_WORKERD_LOCAL_R2_UNPOPULATED:$model"
          test "$model" = 503
          echo "CLOUDFLARE_WORKERD_LOCAL_RUNTIME_PASS_R2_REMOTE_NOT_YET_VERIFIED"
