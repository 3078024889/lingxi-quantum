name: Dual-site payment public readiness audit (READ ONLY)
on:
  push:
    branches: [fix/site-wallet-payment-readiness-20261116]
    paths:
      - '.github/workflows/site-payment-public-readiness-20261116.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe both production sites without creating orders or exposing secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          for host in lingxifield.cn lingxifield.com; do
            echo "===== PAYMENT READINESS: $host ====="
            for path in /api/health /api/pay/providers /api/pay/alipay/status /api/tools/pass /api/admin/pay/readiness /api/wechat/mini/cny-topup/availability; do
              tmp="$(mktemp)"
              code="$(curl -4 -sS --connect-timeout 8 --max-time 25 -o "$tmp" -w '%{http_code}' "https://$host$path" || true)"
              echo "PUBLIC_PROBE host=$host route=$path HTTP=${code:-000}"
              if [[ "$path" == "/api/pay/providers" && "$code" == "200" ]]; then
                node - "$tmp" "$host" <<'NODE'
          const fs=require('node:fs');
          const [file,host]=process.argv.slice(2);
          try{
            const x=JSON.parse(fs.readFileSync(file,'utf8'));
            const yes=v=>v===true?'YES':v===false?'NO':'NOT_EXPOSED';
            for(const k of ['wechat','alipay','paypal'])
              console.log('PROVIDER',host,k,'configured='+yes(x.diagnostics?.[k]?.configured),'enabled='+yes(x[k]));
            for(const k of ['cnyBalanceTopupReady','usdBalanceTopupReady'])
              console.log('WALLET_GATE',host,k+'='+yes(x[k]));
          }catch{console.log('PROVIDER_JSON_INVALID',host)}
          NODE
              fi
              if [[ "$path" == "/api/tools/pass" && "$code" == "200" ]]; then
                node - "$tmp" "$host" <<'NODE'
          const fs=require('node:fs');
          const [file,host]=process.argv.slice(2);
          try{
            const x=JSON.parse(fs.readFileSync(file,'utf8'));
            console.log('TOOLPASS',host,'available='+(x.available===true),'offers='+Number(x.offers?.length||0));
          }catch{console.log('TOOLPASS_JSON_INVALID',host)}
          NODE
              fi
              if [[ "$path" == "/api/admin/pay/readiness" ]]; then
                [[ "$code" == "401" || "$code" == "403" ]] && echo "ADMIN_READINESS_AUTH_BOUNDARY_PASS host=$host" || echo "ADMIN_READINESS_AUTH_BOUNDARY_REVIEW host=$host"
              fi
              rm -f "$tmp"
            done
          done
          echo "READ_ONLY_AUDIT_COMPLETE_NO_LOGIN_NO_ORDER_NO_CHARGE_NO_REFUND"
