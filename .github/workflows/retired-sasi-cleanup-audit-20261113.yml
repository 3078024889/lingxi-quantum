name: Retired SASI cleanup + homepage reference audit (NO DEPLOY)
on:
  push:
    branches:
      - cleanup/cn-retired-sasi-full-20261113
      - cleanup/com-retired-sasi-full-20261113
      - feat/homepage-reference-rebuild-cn-20261113
      - feat/homepage-reference-rebuild-com-20261114
  pull_request:
    branches:
      - cleanup/cn-retired-sasi-full-20261113
      - cleanup/com-retired-sasi-full-20261113
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retired-sasi-homepage-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Retired source, redirects, 410 and SEO/GEO regression
        run: |
          node --check scripts/audit/retired-code-cleanup.mjs
          node --test tests/legacy-sasi-retirement.test.mjs tests/shared-site-origin-ownership-20261113.test.mjs tests/retired-sasi-public-copy-20261113.test.mjs
          node scripts/audit/retired-code-cleanup.mjs
      - name: Marketplace seller, private storage and fulfillment security
        run: |
          node --test \
            tests/sasi-marketplace-security-contract.test.mjs \
            tests/sasi-marketplace-review-security-20261108.test.mjs \
            tests/sasi-software-verified-fulfillment-20261108.test.mjs \
            tests/sasi-marketplace-draft-revision-20261110.test.mjs \
            tests/sasi-first-party-package-upload-20261111.test.mjs \
            tests/sasi-transparent-hero-20261112.test.mjs \
            tests/home-sasi-visual-closure-20261113.test.mjs \
            tests/home-reference-layout-20261114.test.mjs
      - name: External growth, QR, RSS, WordPress and attribution regression
        run: |
          node --test tests/growth-attribution.test.mjs tests/growth-distribution.test.mjs
          node scripts/test-tool-usage.cjs
          node --test tests/unified-share-image.test.mjs tests/password-generator.test.mjs
      - name: TypeScript integrity
        run: pnpm exec tsc --noEmit

  build-and-browser:
    needs: source-and-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        site: [cn, com]
    env:
      LINGXI_SELFHOST_BUILD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_TOOL_PASS_ENFORCED: 'true'
      NEXT_PUBLIC_SITE_URL: ${{ matrix.site == 'cn' && 'https://lingxifield.cn' || 'https://lingxifield.com' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
      SASI_MARKET_SALES_ENABLED: 'false'
      SASI_MARKET_UPLOADS_ENABLED: 'false'
      SASI_MARKET_DELIVERY_ENABLED: 'false'
      SASI_MARKET_PAYOUTS_ENABLED: 'false'
      SOFTWARE_COMMERCE_READY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build for exact site domain (no deploy)
        run: |
          pnpm build
          test -s .next/standalone/server.js
          test -s public/downloads/lingxifield-siai-wordpress.zip
          unzip -t public/downloads/lingxifield-siai-wordpress.zip
          cmp public/widgets/lingxifield-v1.js integrations/wordpress/lingxifield-widgets/assets/lingxifield-v1.js
          echo "HOMEPAGE_REFERENCE_${{ matrix.site }}_BUILD_PASS_NO_DEPLOY"
      - name: Install browser for screenshot acceptance
        run: pnpm exec playwright install --with-deps chrome
      - name: Browser acceptance for homepage, SASI, seller and partner portal
        run: |
          pnpm exec playwright test -c playwright.final.config.ts \
            tests/final-closure/dual-home-market-release-20261113.spec.ts \
            tests/final-closure/partner-growth.spec.ts \
            --workers=1 --reporter=line
      - name: Upload visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-reference-${{ matrix.site }}-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
      - name: Confirm this workflow cannot deploy
        run: |
          ! grep -Eq 'wrangler deploy|vercel deploy|ssh .*lingxifield|systemctl restart' .github/workflows/retired-sasi-cleanup-audit-20261113.yml
          echo HOMEPAGE_AND_MARKETPLACE_AUDIT_COMPLETE_NO_DEPLOY
