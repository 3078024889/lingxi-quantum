name: LINGXIFIELD PDF to Image Genuine Download and Quota E2E
on:
  push:
    branches: [feature/pdf-to-image-delivery-ux-20261104]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingxi-pdf-to-image-delivery-20261104
  cancel-in-progress: true
jobs:
  pdf-to-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pin pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Pin Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Local production build
        run: pnpm build
      - name: Install Chrome
        run: pnpm exec playwright install --with-deps chrome
      - name: Verify ZIP outputs, nine languages, no surprise download and exhausted quota
        run: pnpm exec playwright test -c playwright.final.config.ts --workers=2 tests/final-closure/pdf-to-image-output-v90.spec.ts tests/final-closure/pdf-to-image-delivery-ux.spec.ts tests/final-closure/pdf-to-image-quota-gate.spec.ts
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pdf-to-image-genuine-e2e
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
