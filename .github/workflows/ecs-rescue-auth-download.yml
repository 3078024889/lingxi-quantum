name: ECS restore auth-enabled bundle (manual import only)
on:
  push:
    branches: [feature/ecs-cn-standalone-rescue-20261106]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Verify exact CI-tested source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: 3078024889/lingxi-quantum
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/42158862961" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/42158862961" --jq .head_sha)" = ec4edd7477615523e74db627778bf336dfe0d06e
          echo "AUTH_BUILD_SOURCE_VERIFIED"
      - name: Download exact tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: 3078024889/lingxi-quantum
        run: |
          set -euo pipefail
          mkdir -p /tmp/lingxi-auth
          gh run download 42158862961 --repo "$GH_REPO" \
            --name lingxifield-ecs-standalone-ec4edd7477615523e74db627778bf336dfe0d06e \
            --dir /tmp/lingxi-auth
          cd /tmp/lingxi-auth
          test -s lingxifield-ecs-standalone.tar.gz
          sha256sum -c lingxifield-ecs-standalone.sha256
      - name: Prevent confidential files in public release
        run: |
          set -euo pipefail
          cd /tmp/lingxi-auth
          tar -tzf lingxifield-ecs-standalone.tar.gz > /tmp/lingxi-auth-list.txt
          if grep -Ei '(^|/)(\.env($|\.)|id_rsa$|id_ed25519$|.*\.pem$|.*\.p12$|.*\.key$)' /tmp/lingxi-auth-list.txt; then
            echo "::error::Sensitive file name present; release refused"
            exit 1
          fi
          grep -q '^./server.js$' /tmp/lingxi-auth-list.txt
          grep -q '^./.next/static/' /tmp/lingxi-auth-list.txt
          echo "AUTH_BUILD_ARCHIVE_INSPECTED"
      - name: Publish SHA-verified artifact; do not deploy or edit DNS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: 3078024889/lingxi-quantum
        run: |
          set -euo pipefail
          cd /tmp/lingxi-auth
          tag="ecs-rescue-auth-20261106-ec4edd"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Existing verified tag: $tag"
            exit 0
          fi
          gh release create "$tag" lingxifield-ecs-standalone.tar.gz lingxifield-ecs-standalone.sha256 \
            --repo "$GH_REPO" --target main \
            --prerelease --title 'LINGXIFIELD ECS browser auth repair — staging only' \
            --notes 'Supabase public browser client configured at build time; CI started standalone and checked health/tools. This does not confirm real login, paid operations, R2, model jobs or production availability. No backend secrets in archive.'
          echo "AUTH_RESUME_RELEASE_CREATED"
