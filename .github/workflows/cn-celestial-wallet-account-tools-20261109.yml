name: CN celestial wallet account tools build and old-module exclusion (NO DEPLOY)
on:
  push:
    branches: [feat/cn-celestial-wallet-account-tools-20261109]
  pull_request:
    branches: [release/cn3193-verified-stage-20261109]
    paths:
      - 'app/account/page.tsx'
      - 'app/ai-wallet/page.tsx'
      - 'app/layout.tsx'
      - 'app/celestial-ui-20261109.css'
      - 'components/WalletLivePanel.tsx'
      - 'components/tools/ToolsHubV11.tsx'
      - 'tests/celestial-premium-wallet-account-tools-20261109.test.mjs'
permissions: {contents: read}
concurrency:
  group: cn-celestial-wallet-account-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      LINGXI_SELFHOST_BUILD: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.cn
      NEXT_PUBLIC_SUPABASE_URL: https://sxsgdpqojepgbbrxrzlq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.28.0,run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc,cache: pnpm}
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: New visual and old module safety contracts
        run: |
          node --test tests/celestial-premium-wallet-account-tools-20261109.test.mjs
          node --test tests/cn-payment-activation-20261109.test.mjs
          node --test tests/cn-wallet-checkout-entry-20261108.test.mjs
          node --test tests/sasi-software-public-branding-20261108.test.mjs
      - name: Type-check, lint and produce isolated CN standalone artifact
        run: |
          pnpm exec tsc --noEmit
          pnpm exec eslint components/WalletLivePanel.tsx components/tools/ToolsHubV11.tsx app/ai-wallet/page.tsx app/account/page.tsx
          pnpm build
          test -s .next/standalone/server.js
          echo CN_CELESTIAL_UI_VERIFIED_WITHOUT_OVERWRITING_PRODUCTION
