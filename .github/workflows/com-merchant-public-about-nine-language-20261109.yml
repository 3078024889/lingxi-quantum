name: COM merchant nine-language product and policy pages (NO DEPLOY)
on:
  push:
    branches: [feat/com-merchant-public-about-nine-language-20261109]
  pull_request:
    branches: [release/com-sasi-full-20261108]
    paths:
      - 'components/AboutBusinessClient.tsx'
      - 'app/about/page.tsx'
      - 'tests/com-merchant-public-about-nine-language-20261109.test.mjs'
      - '.github/workflows/com-merchant-public-about-nine-language-20261109.yml'
permissions: {contents: read}
concurrency:
  group: com-merchant-about-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LINGXI_SELFHOST_BUILD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.com
      NEXT_PUBLIC_SUPABASE_URL: https://sxsgdpqojepgbbrxrzlq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.28.0,run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc,cache: pnpm}
      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify authentic software and legal content in nine languages
        run: node --test tests/com-merchant-public-about-nine-language-20261109.test.mjs
      - name: TypeScript and standalone production build
        run: |
          pnpm exec tsc --noEmit
          pnpm build
          test -s .next/standalone/server.js
          echo COM_MERCHANT_ABOUT_NINE_LANGUAGES_PASS_NO_DEPLOY
