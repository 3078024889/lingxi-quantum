# Unified toolpass purchase CTA contract audited at exact source SHA.
name: CN SASI marketplace 20261114 standalone candidate (NO ECS DEPLOY)
# A 450 MB candidate should only be built after the independent source/build
# and browser gates succeed on the exact SHA. Avoid per-commit quota burn.
# The operator must explicitly dispatch this workflow for the reviewed branch.
on:
  push:
    branches: [release/sasi-marketplace-20261114-cn]
    paths:
      - '.github/workflows/cn-sasi-marketplace-standalone-20261114.yml'
      - 'scripts/audit/dual-site-admin-toolpass-hardening-20261108.cjs'
      - 'scripts/ops/cn-payment-signed-live-probe-20261109.mjs'
      - 'scripts/ops/cn-payment-activate-20261109.sh'
      - 'components/SasiOpenMarketplace.tsx'
      - 'components/SasiOpenMarketplace.module.css'
      - 'components/SasiSoftwareMarket.tsx'
      - 'lib/sasi-software/catalog.ts'
      - 'app/api/pay/create/route.ts'
      - 'tests/sasi-marketplace-reference-20261114.test.mjs'
      - 'scripts/ops/ecs-cn3193-unified-standalone-stage-20261108.sh'
      - 'tests/cn-payment-activation-20261109.test.mjs'
      - 'app/account/page.tsx'
      - 'app/ai-wallet/page.tsx'
      - 'components/WalletLivePanel.tsx'
      - 'components/tools/ToolsHubV11.tsx'
      - 'app/layout.tsx'
      - 'app/celestial-ui-20261109.css'
      - 'tests/celestial-premium-wallet-account-tools-20261109.test.mjs'
      - 'tests/cn-wallet-checkout-entry-20261108.test.mjs'
      - 'app/lingxifield-premium-20261109.css'
      - 'components/AccountCenterV26.tsx'
      - 'tests/dual-premium-visual-no-legacy-20261109.test.mjs'
      - 'tests/final-closure/dual-premium-new-visual.spec.ts'
      - 'tests/legacy-sasi-retirement.test.mjs'
      - 'docs/operations/legacy-sasi-retirement-20261108.json'
      - 'app/api/sasi/generation/submit/route.ts'
      - 'app/api/cron/sasi-v5-radar/route.ts'
      - 'vercel.json'
      - 'app/sasi/VideoAssembler.tsx'
      - 'components/SasiAutonomyEntrances.tsx'
      - 'components/SasiByokImageStudio.tsx'
      - 'components/SasiMultiEpisodeWorkspace.tsx'
      - 'components/SasiNativeCreatePanel.tsx'
      - 'components/SasiOneSurface.tsx'
      - 'components/SasiProjectDNAEditor.tsx'
      - 'components/SasiSeriesStudio.tsx'
      - 'components/SasiVariantWorkbench.tsx'
      - '.github/workflows/cn3194-upgrade-20261109.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: lingxifield-cn-sasi-marketplace-20261114
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen dependencies and offline source contracts
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile
          node scripts/audit/dual-site-admin-toolpass-hardening-20261108.cjs
          node --test tests/cn-payment-activation-20261109.test.mjs
          node --test tests/celestial-premium-wallet-account-tools-20261109.test.mjs
          node --test tests/dual-premium-visual-no-legacy-20261109.test.mjs
          node --test tests/legacy-sasi-retirement.test.mjs
          node scripts/audit/unified-tool-pass-coverage.mjs
          node scripts/audit/unified-tool-pass-server-coverage.mjs
          node tests/sasi-marketplace-fee.test.mjs
          node tests/sasi-marketplace-security-contract.test.mjs
          node tests/sasi-marketplace-reference-20261114.test.mjs
          node --test tests/sasi-software-public-branding-20261108.test.mjs
          node --test tests/sasi-marketplace-long-description-20261109.test.mjs
          node --test tests/sasi-premium-nine-language-20261109.test.mjs
          node --test tests/toolpass-premium-nine-language-20261109.test.mjs
          node --test tests/com-merchant-public-about-nine-language-20261109.test.mjs
          node --test tests/com-public-market-edge.test.mjs
          node --test tests/public-announcements-deeplink-20261108.test.mjs
          node --test tests/sasi-marketplace-review-security-20261108.test.mjs
          node --test tests/sasi-software-verified-fulfillment-20261108.test.mjs
          node tests/toolpass-direct-fulfillment-20261108.test.mjs
          node --test tests/cn-wallet-checkout-entry-20261108.test.mjs tests/cn-toolpass-public-ui-20261108.test.mjs
          node tests/sasi-com-closure-20261108.test.mjs
          pnpm exec tsc --noEmit
      - name: Build an isolated exact-SHA Linux standalone artifact
        env:
          LINGXI_SELFHOST_BUILD: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: https://lingxifield.cn
          NEXT_PUBLIC_TOOL_PASS_ENFORCED: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
        run: |
          set -Eeuo pipefail
          pnpm build
          test -s .next/standalone/server.js
          test -s .next/BUILD_ID
          install -d .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          cp -a public .next/standalone/public
          cp .next/BUILD_ID .next/standalone/.next/BUILD_ID
          cp scripts/ops/cn-payment-signed-live-probe-20261109.mjs .next/standalone/cn-payment-signed-live-probe.mjs
          cp scripts/ops/cn-payment-activate-20261109.sh .next/standalone/cn-payment-activate.sh
          test -s .next/standalone/cn-payment-activate.sh
          test -s .next/standalone/cn-payment-signed-live-probe.mjs
          echo 'CN_SELFHOST_EXACT_SHA_STANDALONE_BUILD_PASS'
      - name: Real loopback standalone smoke with ZERO finance mutations
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
          SUPABASE_URL: https://sxsgdpqojepgbbrxrzlq.supabase.co
          NEXT_PUBLIC_TOOL_PASS_ENFORCED: "true"
        run: |
          set -Eeuo pipefail
          cd .next/standalone
          HOSTNAME=127.0.0.1 PORT=3319 NODE_ENV=production node server.js > "$RUNNER_TEMP/cn3319.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 55); do
            if curl --noproxy '*' --silent --max-time 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:3319/api/health | grep -qx 200; then ready=1;break; fi
            sleep 1
          done
          [ "$ready" = 1 ] || { echo "::error::STANDALONE_HEALTH_NOT_READY"; exit 1; }
          for path in / /tools /siai /sasi /sasi/seller /sasi/marketplace /about /account/software /announcements /tools/pass /ai-wallet; do
            code="$(curl --noproxy '*' --silent --max-time 20 -o /dev/null -w '%{http_code}' "http://127.0.0.1:3319$path" || true)"
            echo "PUBLIC_LOCAL_ROUTE:$path:$code"
            [ "$code" = 200 ] || exit 1
          done
          for path in /api/sasi/account /api/tools/jobs /api/sasi/marketplace/seller /api/sasi/marketplace/my-orders; do
            code="$(curl --noproxy '*' --silent --max-time 20 -o /dev/null -w '%{http_code}' "http://127.0.0.1:3319$path" || true)"
            echo "ANON_AUTH_BOUNDARY:$path:$code"
            [ "$code" = 401 ] || exit 1
          done
          code="$(curl --noproxy '*' --silent --max-time 20 -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3319/api/tools/pass' || true)"
          [ "$code" = 200 ] || exit 1
          echo 'CN_STANDALONE_STATIC_AND_ANON_ACCESS_ACCEPTED_NO_PAYMENT'
      - name: Real desktop and mobile Chrome visual gate for new account wallet and tools
        run: |
          set -Eeuo pipefail
          pnpm exec playwright install --with-deps chrome
          pnpm exec playwright test -c playwright.final.config.ts --project=desktop-chromium --project=mobile-chromium --workers=2 tests/final-closure/dual-premium-new-visual.spec.ts
          echo 'CN3194_NEW_VISUAL_DESKTOP_MOBILE_CHROME_PASS'
      - name: Package immutable SHA-256-checked artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' "${GITHUB_SHA}" > .next/standalone/RELEASE_SOURCE_SHA
          tar -C .next/standalone -czf cn-sasi-marketplace-20261114-standalone.tar.gz .
          sha256sum cn-sasi-marketplace-20261114-standalone.tar.gz > cn-sasi-marketplace-20261114-standalone.sha256
          tar -tzf cn-sasi-marketplace-20261114-standalone.tar.gz > cn-sasi-marketplace-20261114-archive-manifest.txt
          grep -Fxq './server.js' cn-sasi-marketplace-20261114-archive-manifest.txt
          grep -Fxq './cn-payment-signed-live-probe.mjs' cn-sasi-marketplace-20261114-archive-manifest.txt
          grep -Fxq './cn-payment-activate.sh' cn-sasi-marketplace-20261114-archive-manifest.txt
          test "$(stat -c '%s' cn-sasi-marketplace-20261114-standalone.tar.gz)" -lt 1300000000
          echo "CN_RELEASE_ARCHIVE_BYTES=$(stat -c '%s' cn-sasi-marketplace-20261114-standalone.tar.gz)"
          echo "CN_RELEASE_SOURCE_SHA=${GITHUB_SHA}"
      - name: Upload package for immutable prerelease promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cn-sasi-marketplace-${{ github.sha }}
          path: |
            cn-sasi-marketplace-20261114-standalone.tar.gz
            cn-sasi-marketplace-20261114-standalone.sha256
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and verify exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/lingxifield-verified"
          gh run download "$GITHUB_RUN_ID" --repo "$GH_REPO" --name "cn-sasi-marketplace-${GITHUB_SHA}" --dir "$RUNNER_TEMP/lingxifield-verified"
          cd "$RUNNER_TEMP/lingxifield-verified"
          sha256sum -c cn-sasi-marketplace-20261114-standalone.sha256
          tar -tzf cn-sasi-marketplace-20261114-standalone.tar.gz > manifest.txt
          grep -Fxq './server.js' manifest.txt
          grep -Fxq './RELEASE_SOURCE_SHA' manifest.txt
          test "$(stat -c '%s' cn-sasi-marketplace-20261114-standalone.tar.gz)" -lt 1300000000
          echo CN_PUBLISH_IMMUTABLE_VERIFIED
      - name: Publish GitHub prerelease (does not touch ECS, DNS or Nginx)
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="ecs-cn-sasi-marketplace-20261114-${GITHUB_SHA:0:12}"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1;then
            echo "::error::EXACT_RELEASE_TAG_ALREADY_EXISTS"; exit 1
          fi
          cd "$RUNNER_TEMP/lingxifield-verified"
          gh release create "$tag" cn-sasi-marketplace-20261114-standalone.tar.gz cn-sasi-marketplace-20261114-standalone.sha256 \
            --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease \
            --title "LINGXIFIELD CN SASI marketplace 20261114 exact source ${GITHUB_SHA:0:12} - STAGING ONLY" \
            --notes "Build and read-only tests passed. NOT deployed. Stage this exact artifact on isolated port 3195 only. Keep the current production Nginx upstream on port 3194 unchanged; retain 3193 as rollback baseline. Verify /sasi, /sasi/seller, marketplace private 401 boundaries, payment-provider flags, wallet, historical entitlements, ToolPass, user tools and Nginx rollback before a separate explicit promotion. No real payment, order, login or payout mutations are performed by this build."
          echo "CN_ARTIFACT_PUBLISHED_NOT_DEPLOYED:${tag}"
