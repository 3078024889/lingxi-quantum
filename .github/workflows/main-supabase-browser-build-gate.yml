name: CN and COM Supabase browser build key readiness (NO DEPLOY)
on:
  push:
    branches: [fix/cn-main-runtime-supabase-public-env-20261107]
    paths:
      - scripts/ci/require-supabase-browser-build.mjs
      - tests/ops/require-supabase-browser-build.test.mjs
      - .github/workflows/main-supabase-browser-build-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24.19.0'}
      - run: |
          node --check scripts/ci/require-supabase-browser-build.mjs
          node --test tests/ops/require-supabase-browser-build.test.mjs
          echo "BROWSER_AUTH_CONFIG_CONTRACT_PASS_NO_PUBLIC_KEY_LOGGED"
