name: SIAI ranking-first UX real browser gate
on:
  pull_request:
    paths:
      - 'components/SiaiRankingHome.tsx'
      - 'components/SiaiSearchDiscovery.tsx'
      - 'lingxifield-ai-market/app/market-cost-estimator.tsx'
      - 'components/Nav.tsx'
      - 'components/HomeProblemHub.tsx'
      - 'components/HomeGlobalGrowth.tsx'
      - 'components/HomeSeoAnswers.tsx'
      - 'app/layout.tsx'
      - 'app/home-afternoon-20261114.css'
      - 'tests/home-reference-layout-20261114.test.mjs'
      - 'tests/final-closure/dual-home-market-release-20261113.spec.ts'
      - 'components/Footer.tsx'
      - 'lib/footer-unified-copy.ts'
      - 'tests/footer-unified.test.mjs'
      - 'tests/final-closure/siai-footer-unified-real.spec.ts'
      - 'app/siai-home.css'
      - 'app/unified-shell.css'
      - 'tests/final-closure/siai-ranking-first-layout.spec.ts'
      - 'tests/final-closure/siai-design-visual-proof.spec.ts'
      - 'public/widgets/lingxifield-v1.js'
      - 'integrations/wordpress/lingxifield-widgets/**'
      - 'components/partners/PartnerGrowthPortal.tsx'
      - 'app/api/public/free-tools-widget/route.ts'
      - 'tests/final-closure/partner-widget-embed.spec.ts'
      - 'lib/siai-brand-icon-ids.ts'
      - 'public/siai-brand-icons/**'
      - 'tests/siai-brand-icons.test.mjs'
      - '.github/workflows/siai-ranking-layout-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-ranking:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/footer-unified.test.mjs tests/siai-brand-icons.test.mjs tests/home-reference-layout-20261114.test.mjs
      - run: pnpm build
      - run: bash scripts/ci/ensure-chrome.sh
      - run: pnpm exec playwright test -c playwright.final.config.ts --project=${{ matrix.project }} --workers=1 tests/final-closure/siai-ranking-first-layout.spec.ts tests/final-closure/siai-footer-unified-real.spec.ts tests/final-closure/siai-design-visual-proof.spec.ts tests/final-closure/partner-widget-embed.spec.ts tests/final-closure/dual-home-market-release-20261113.spec.ts
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ranking-ux-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
