name: 20261114 Seller Workspace Reference Gate (NO DEPLOY)
on:
  push:
    branches:
      - feat/20261114-afternoon-seller-workspace-cn
      - feat/20261114-afternoon-seller-workspace-com
    paths:
      - 'components/Nav.tsx'
      - 'app/home-effect4-20261114.css'
      - 'app/layout.tsx'
      - 'app/page.tsx'
      - 'app/[locale]/page.tsx'
      - 'tests/home-sasi-effect4-closure-20261114.test.mjs'
      - 'components/SasiOpenMarketplace.tsx'
      - 'components/SasiOpenMarketplace.module.css'
      - 'app/sasi/seller/page.tsx'
      - 'app/api/sasi/marketplace/listings/route.ts'
      - 'tests/sasi-seller-reference-20261114.test.mjs'
      - 'tests/final-closure/sasi-seller-workspace-reference.spec.ts'
      - 'tests/sasi-marketplace-security-contract.test.mjs'
      - '.github/workflows/seller-workspace-reference-20261114.yml'
  pull_request:
    paths:
      - 'components/Nav.tsx'
      - 'components/SasiOpenMarketplace.tsx'
      - 'components/SasiOpenMarketplace.module.css'
      - 'app/sasi/seller/page.tsx'
      - 'app/api/sasi/marketplace/listings/route.ts'
      - 'tests/sasi-seller-reference-20261114.test.mjs'
      - 'tests/final-closure/sasi-seller-workspace-reference.spec.ts'
      - 'tests/sasi-marketplace-security-contract.test.mjs'
      - '.github/workflows/seller-workspace-reference-20261114.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seller-workspace-reference-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  seller-workspace-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.com
      NEXT_PUBLIC_SUPABASE_URL: https://sxsgdpqojepgbbrxrzlq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
      SASI_MARKET_SALES_ENABLED: 'false'
      SASI_MARKET_UPLOADS_ENABLED: 'false'
      SASI_MARKET_PAYOUTS_ENABLED: 'false'
      SASI_MARKET_DELIVERY_ENABLED: 'false'
      SOFTWARE_COMMERCE_READY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Seller UI and marketplace contract tests
        run: |
          node --test tests/sasi-seller-reference-20261114.test.mjs
          node --test tests/home-sasi-effect4-closure-20261114.test.mjs
          node --test tests/sasi-marketplace-one-cover-four-details-20261109.test.mjs
          node --test tests/sasi-marketplace-review-security-20261108.test.mjs
          node tests/sasi-marketplace-security-contract.test.mjs
      - name: TypeScript validation
        run: pnpm exec tsc --noEmit
      - name: Next.js production build (NO DEPLOY)
        run: pnpm build
      - name: Install CJK fonts for accurate visual proof
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Install Chrome for real-browser verification
        run: bash scripts/ci/ensure-chrome.sh
      - name: Seller workspace desktop and mobile browser verification
        run: pnpm exec playwright test -c playwright.final.config.ts --project=desktop-chromium --project=mobile-chromium --workers=1 tests/final-closure/sasi-seller-workspace-reference.spec.ts
      - name: Upload seller workspace visual proof
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: seller-workspace-visual-proof
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Confirm build artifact only
        run: |
          test -s .next/BUILD_ID
          echo SELLER_WORKSPACE_REFERENCE_BUILD_PASS_NO_DEPLOY
