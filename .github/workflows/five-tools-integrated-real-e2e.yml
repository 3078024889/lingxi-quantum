name: LINGXIFIELD Five Tools Integrated Real File Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/five-tools-integrated-real-e2e.yml'
      - 'components/tools/ResizeImageWorkbench.tsx'
      - 'components/tools/ScreenshotRedactWorkbench.tsx'
      - 'components/tools/PdfToImageWorkbench.tsx'
      - 'components/tools/PdfBasicWorkbench.tsx'
      - 'components/tools/PdfPageManagerWorkbench.tsx'
      - 'components/tools/ImageToPdfWorkbench.tsx'
      - 'tests/final-closure/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: five-tools-integrated-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Pin Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Real production build
        run: pnpm build
      - name: Install Chrome desktop and mobile
        run: bash scripts/ci/ensure-chrome.sh
      - name: Real upload and decoded output tests across five tools, Chrome and Pixel7
        run: |
          pnpm exec playwright test -c playwright.final.config.ts --workers=2 \
            tests/final-closure/resize-preview-v79.spec.ts \
            tests/final-closure/resize-quality-v79.spec.ts \
            tests/final-closure/resize-drag-real-output.spec.ts \
            tests/final-closure/screenshot-redaction-real-export.spec.ts \
            tests/final-closure/pdf-to-image-delivery-ux.spec.ts \
            tests/final-closure/pdf-to-image-output-v90.spec.ts \
            tests/final-closure/pdf-to-image-quota-gate.spec.ts \
            tests/final-closure/pdf-merge-split-real-export.spec.ts \
            tests/final-closure/pdf-page-manager-real-export.spec.ts \
            tests/final-closure/image-to-pdf-margin-output.spec.ts \
            tests/final-closure/tool-real-output.spec.ts
      - name: Upload evidence even if tests fail
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: five-tools-e2e-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
