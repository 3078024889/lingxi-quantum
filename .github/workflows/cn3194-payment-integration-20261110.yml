name: CN3194 payment integration gate (NO DEPLOY)
on:
  push:
    branches: [integration/cn3194-payment-hardening-20261110]
  workflow_dispatch:
  pull_request:
    branches: [release/cn3193-verified-stage-20261109]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: cn-wallet-checkout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Wallet and payment regression contracts
        run: |
          node --test tests/cn-wallet-checkout-entry-20261108.test.mjs tests/cn-toolpass-public-ui-20261108.test.mjs tests/sasi-software-paypal-fulfillment-contract.test.mjs tests/paypal-merchant-idempotency-20261108.test.mjs tests/sasi-marketplace-security-contract.test.mjs
          python3 -m py_compile scripts/marketplace/scan-private-zip.py
          python3 -m unittest discover -s tests/marketplace -p 'test_*.py' -v
          node --test tests/com-admin-facade.test.mjs tests/tool-pass-server-http-contract.test.mjs
          node --test tests/unified-tools-pass-static-contract.test.mjs
          node scripts/test-money-reconcile-results.cjs
          node scripts/test-money-progress-api.cjs
          node --test tests/release/site-announcements-contract.test.mjs
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Compile Next.js standalone candidate (no publish)
        env:
          LINGXI_SELFHOST_BUILD: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: https://lingxifield.cn
          NEXT_PUBLIC_TOOL_PASS_ENFORCED: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
        run: |
          pnpm build
          test -s .next/standalone/server.js
          echo CN_WALLET_CHECKOUT_BUILD_GATE_PASS_NO_DEPLOY
