name: COM workerd critical HTML static smoke (NO DEPLOY)
on:
  push:
    branches: [ops/dual-site-readonly-20261108]
    paths: ['.github/workflows/com-edge-prerender-critical-20261108.yml','scripts/cloudflare/patch-critical-static-html-20261108.mjs']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  critical-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.com
      NEXT_PUBLIC_SUPABASE_URL: https://sxsgdpqojepgbbrxrzlq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.28.0,run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc,cache: pnpm}
      - name: Build verified official OpenNext app, keeping original large R2 assets unchanged
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile
          pnpm add -D @opennextjs/cloudflare@1.20.16 wrangler@4.158.0 --save-exact
          pnpm exec opennextjs-cloudflare build
          node scripts/cloudflare/stage-large-public-assets.mjs
          node scripts/cloudflare/stage-r2-public-assets.mjs --audit
      - name: Render anonymous landing and SIAI to real local workerd snapshots
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            printf 'SUPABASE_URL="%s"\n' "$NEXT_PUBLIC_SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY="%s"\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            printf 'SUPABASE_PUBLISHABLE_KEY="%s"\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            printf 'NEXT_PUBLIC_SUPABASE_URL="%s"\n' "$NEXT_PUBLIC_SUPABASE_URL"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY="%s"\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          } > .dev.vars
          chmod 600 .dev.vars
          pnpm exec wrangler dev --local --ip 127.0.0.1 --port 8787 --log-level error > /tmp/lingxi-render-worker.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -f .dev.vars' EXIT
          ok=0
          for i in $(seq 1 70);do
            status="$(curl -sS --noproxy '*' --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/health || true)"
            if [[ "$status" == 200 ]];then ok=1;break;fi
            sleep 2
          done
          test "$ok" = 1
          mkdir -p .open-next/assets/__lingxi_edge_static__
          curl --noproxy '*' -fSs --retry 2 --max-time 45 -H 'Host: lingxifield.com' -H 'X-Forwarded-Proto: https' http://127.0.0.1:8787/ -o .open-next/assets/__lingxi_edge_static__/landing.html
          curl --noproxy '*' -fSs --retry 2 --max-time 45 -H 'Host: lingxifield.com' -H 'X-Forwarded-Proto: https' http://127.0.0.1:8787/siai -o .open-next/assets/__lingxi_edge_static__/siai.html
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          trap 'rm -f .dev.vars' EXIT
          node scripts/cloudflare/patch-critical-static-html-20261108.mjs
          pnpm exec wrangler deploy --minify --no-upload-source-maps --dry-run --outdir "$RUNNER_TEMP/critical-static-test"
      - name: Assert both hot routes are static 200 on real local workerd 3 times
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec wrangler dev --local --ip 127.0.0.1 --port 8788 --log-level error > /tmp/lingxi-static-worker.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -f .dev.vars' EXIT
          ok=0
          for i in $(seq 1 70);do
            status="$(curl --noproxy '*' -sS --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:8788/api/health || true)"
            if [[ "$status" == 200 ]];then ok=1;break;fi
            sleep 2
          done
          test "$ok" = 1
          for path in / /siai;do
            for i in 1 2 3;do
              h="$(mktemp)"
              code="$(curl -sS --noproxy '*' --max-time 25 -D "$h" -o /dev/null -w '%{http_code}' -H 'Host: lingxifield.com' "http://127.0.0.1:8788$path" || true)"
              echo "STATIC_EDGE_SMOKE path=$path attempt=$i code=$code"
              test "$code" = 200
              grep -iq '^x-lingxi-render-mode: static-edge-verified' "$h"
              rm -f "$h"
            done
          done
          echo 'COM_PUBLIC_HOT_ROUTES_6_OF_6_STATIC_EDGE_PASS_NO_DEPLOY'
