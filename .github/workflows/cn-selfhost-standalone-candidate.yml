name: Lingxifield exact-source CN standalone release candidate (NO DEPLOY)
on:
  push:
    branches: [build/lingxi-selfhost-cn-20261107]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cn-standalone-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact fully CI-verified release SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 999a7429152e7745114003de52ffe52c5f63e734
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source SHA is the fully passed dual-site release
        run: |
          test "$(git rev-parse HEAD)" = "999a7429152e7745114003de52ffe52c5f63e734"
          echo "CN_STANDALONE_RELEASE_SOURCE_EXACT"
      - name: Set standalone packaging in ephemeral CI workspace only
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("node:fs"),p="next.config.js";
          const original=fs.readFileSync(p,"utf8");
          const needle="const nextConfig = {";
          if(!original.includes(needle)||original.includes("output: 'standalone'")||original.includes('output: "standalone"'))
            throw Error("STANDALONE_BUILD_CONFIG_UNEXPECTED");
          fs.writeFileSync(p,original.replace(needle,needle+"\n  output: 'standalone',"));
          const patched=fs.readFileSync(p,"utf8");
          if(!patched.includes("output: 'standalone'"))throw Error("STANDALONE_BUILD_CONFIG_FAILED");
          console.log("STANDALONE_OUTPUT_ENABLED_ONLY_IN_DISPOSABLE_GITHUB_WORKSPACE");
          NODE
      - name: Install pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile
      - name: Fail closed when client auth config is missing
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "::error::Missing GitHub repository variable NEXT_PUBLIC_SUPABASE_URL; a successful Next.js page build is not a working login."
            exit 1
          fi
          if [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing GitHub repository variable NEXT_PUBLIC_SUPABASE_ANON_KEY; client auth would be broken."
            exit 1
          fi
          if [[ ! "$NEXT_PUBLIC_SUPABASE_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL must be an HTTPS origin."
            exit 1
          fi
          echo 'PUBLIC_CLIENT_AUTH_CONFIG_PRESENT_NOT_VERIFIED'
      - name: Verify configured Supabase browser key is correct and enabled
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
        run: node scripts/ci/require-supabase-browser-build.mjs --release
      - name: Build standalone Linux runtime WITHOUT touching production
        env:
          LINGXI_SELFHOST_BUILD: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
          NEXT_PUBLIC_SITE_URL: https://lingxifield.cn
        run: pnpm build
      - name: Smoke-test standalone runtime
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
          NEXT_PUBLIC_SITE_URL: https://lingxifield.cn
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
        run: |
          set -euo pipefail
          test -s .next/standalone/server.js || { echo "::error::STANDALONE_ENTRY_MISSING"; exit 1; }
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          cp -a public .next/standalone/public
          (cd .next/standalone && HOSTNAME=127.0.0.1 PORT=3187 NODE_ENV=production node server.js) > /tmp/lingxi-standalone.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3187/api/health | grep -q '"ok":true'; then
              ok=1; break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            tail -100 /tmp/lingxi-standalone.log
            echo "::error::Standalone health endpoint failed"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 15 -o /tmp/lingxi-tools.html http://127.0.0.1:3187/tools
          grep -q '<html' /tmp/lingxi-tools.html
          curl --fail --silent --show-error --max-time 15 -o /dev/null http://127.0.0.1:3187/siai
          anon_http=$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3187/api/tools/jobs)
          if [ "$anon_http" != "401" ]; then
            echo "::error::Expected unauthenticated jobs API 401, got $anon_http"
            if grep -Fq "SUPABASE_PUBLIC_CONFIG_MISSING" /tmp/lingxi-standalone.log; then echo "::error::SERVER_RUNTIME_PUBLIC_SUPABASE_CONFIG_MISSING"; fi
            if grep -Fq "AuthSessionMissingError" /tmp/lingxi-standalone.log; then echo "NO_SESSION_EXPECTED_ANONYMOUS"; fi
            if grep -Fq "Failed to find Server Action" /tmp/lingxi-standalone.log; then echo "::error::STANDALONE_SERVER_ACTION_VERSION_MISMATCH"; fi
            exit 1
          fi
          echo 'CN_STANDALONE_AUTH_BOUNDARY_PASS'
          echo 'STANDALONE_HEALTH_AND_TOOLS_PASS'
          npx_ver="$(node -p 'require("./package.json").dependencies.next')"
          printf 'LINGXI_NEXT_VERSION=%s\n' "$npx_ver"
      - name: Ensure compiled browser chunks contain expected public Supabase project
        run: |
          set -Eeuo pipefail
          grep -RFlq "sxsgdpqojepgbbrxrzlq.supabase.co" .next/static || {
            echo "::error::NEXT_CLIENT_SUPABASE_PROJECT_MISSING_IN_RELEASE_ASSETS"
            exit 1
          }
          echo 'NEXT_CLIENT_PUBLIC_PROJECT_BAKED_AND_VERIFIED'

      - name: Package self-hostable artifact (not published to a server)
        shell: bash
        run: |
          set -euo pipefail
          tar -C .next/standalone -czf lingxifield-ecs-standalone.tar.gz .
          bytes="$(stat -c%s lingxifield-ecs-standalone.tar.gz)"
          test "$bytes" -lt 1258291200 || { echo "::error::STANDALONE_ARCHIVE_EXCEEDS_1_2GB"; exit 1; }
          printf '%s\n' "$(git rev-parse HEAD)" > SHA.txt
          printf '%s\n' 'Preview package only: no real login, payment, R2 or file roundtrip acceptance.' > NOT_PRODUCTION_APPROVED.txt
          ls -lh lingxifield-ecs-standalone.tar.gz
          sha256sum lingxifield-ecs-standalone.tar.gz > lingxifield-ecs-standalone.sha256
      - name: Upload artifact to GitHub Actions only
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: lingxifield-cn-standalone-exact-999a7429152e7745114003de52ffe52c5f63e734
          path: |
            lingxifield-ecs-standalone.tar.gz
            lingxifield-ecs-standalone.sha256
            SHA.txt
            NOT_PRODUCTION_APPROVED.txt
          retention-days: 1
          if-no-files-found: error
