name: Media saved-file acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: media-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Existing retired-code audit before further cleanup
        run: node scripts/audit/retired-code-cleanup.mjs
      - name: Source delivery contracts
        run: |
          node scripts/test-media-export-duration-contract.mjs
          node scripts/test-media-export-delivery-contract.mjs
          node scripts/test-prepared-share-gesture.mjs
      - name: Existing native regressions
        run: npm run test:media:native
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Video task ownership regression with installed TypeScript
        run: node scripts/test-video-task-ownership.cjs
      - run: node scripts/test-media-metadata.cjs
      - run: node scripts/test-box-inpaint-boundaries.cjs && node scripts/test-watermark-resource-v79.cjs
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chrome
      - name: Actual browser processing, preview, download, reopen and full decoding
        run: pnpm exec playwright test -c playwright.final.config.ts media-duration-acceptance-v99 file-delivery-v91 subtitle-translation-v95 image-watermark-gesture-v100 --workers=2 --max-failures=6 --reporter=list,json
        env:
          MEDIA_ACCEPTANCE: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/media-results.json
      - name: Preserve inputs, saved files, first/last frames and failures
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: media-saved-file-evidence
          path: test-results/
          retention-days: 7
