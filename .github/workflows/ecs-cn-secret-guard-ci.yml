name: CN masked configuration safety test
on:
  push:
    branches: [feature/ecs-cn-main199-delivery-20261106]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - run: |
          set -euo pipefail
          bash -n scripts/ops/ecs-cn-stage.sh
          bash -n scripts/ops/ecs-cn-pull-env.sh
          node --check scripts/ops/ecs-cn-env-audit.cjs
          printf 'SUPABASE_SERVICE_ROLE_KEY="[SENSITIVE]"\n' > /tmp/redacted-test.env
          set +e
          node scripts/ops/ecs-cn-env-audit.cjs --strict /tmp/redacted-test.env > /tmp/audit-result.txt
          got=$?
          set -e
          test "$got" -eq 9
          grep -q STRICT_RUNTIME_CONFIG_BLOCKED /tmp/audit-result.txt
          grep -q REDACTED_VALUE_COUNT=1 /tmp/audit-result.txt
          echo SECRET_PLACEHOLDER_GUARD_OK
