name: Local document translation verified package
on:
  push:
    branches: [fix/translation-local-live-20261128]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: local-document-translation-package
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Dependencies and regression checks
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile
          node --test tests/checksum-result.test.mjs tests/admin-tool-quota.test.mjs tests/tool-workspaces.test.mjs tests/local-document-translation.test.mjs tests/subtitle-device-translation.test.mjs tests/video-translation-subtitle-export.test.mjs tests/video-cancel-restart.test.mjs tests/retired-media-api.test.mjs tests/document-translation-free-acceptance.test.mjs tests/cn-payment-activation-20261109.test.mjs
          pnpm exec tsc --noEmit --incremental false
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          fc-cache -f >/dev/null
      - name: Build exact source with unlimited local acceptance
        env:
          LINGXI_SELFHOST_BUILD: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: https://lingxifield.cn
          NEXT_PUBLIC_TOOL_PASS_ENFORCED: 'true'
          NEXT_PUBLIC_TOOL_FREE_ACCEPTANCE: 'true'
          NEXT_PUBLIC_SUPABASE_URL: https://sxsgdpqojepgbbrxrzlq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
        run: |
          set -Eeuo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          pnpm build
          test -s .next/standalone/server.js
          cp -a .next/static .next/standalone/.next/static
          cp -a public .next/standalone/public
          cp .next/BUILD_ID .next/standalone/.next/BUILD_ID
          printf '%s\n' "$GITHUB_SHA" > .next/standalone/RELEASE_SOURCE_SHA
      - name: Loopback smoke without payments or paid model calls
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .next/standalone
          HOSTNAME=127.0.0.1 PORT=3328 NODE_ENV=production node server.js > "$RUNNER_TEMP/translation.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3328/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3328/tools/document-translate > "$RUNNER_TEMP/translation.html"
          grep -q 'document-translate' "$RUNNER_TEMP/translation.html"
          code=$(curl -sS -X POST -o "$RUNNER_TEMP/retired.json" -w '%{http_code}' http://127.0.0.1:3328/api/tools/document-translate)
          test "$code" = 410
          grep -q LOCAL_PROCESSING_REQUIRED "$RUNNER_TEMP/retired.json"
          for route in translate transcribe tts free-dubbing-preview; do
            code=$(curl -sS -X POST -o /dev/null -w '%{http_code}' "http://127.0.0.1:3328/api/tools/media/$route")
            test "$code" = 410
          done
          for path in / /tools /ai-wallet /tools/pass; do
            curl -fsS "http://127.0.0.1:3328$path" >/dev/null
          done
      - name: Package and publish immutable staging artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          tar -C .next/standalone -czf local-translation-standalone.tar.gz .
          sha256sum local-translation-standalone.tar.gz > local-translation-standalone.sha256
          sha256sum -c local-translation-standalone.sha256
          curl -fsSL --retry 2 --max-time 300 \
            https://github.com/3078024889/lingxi-quantum/releases/download/translation-local-8113409d961c/local-translation-standalone.tar.gz -o "$RUNNER_TEMP/baseline.tar.gz"
          echo "5a23a65bb904c7f7793627dd9ea05ed8acaede004e190602e4a458317898a625  $RUNNER_TEMP/baseline.tar.gz" | sha256sum -c -
          python3 scripts/ops/build-release-delta.py "$RUNNER_TEMP/baseline.tar.gz" .next/standalone local-tools-delta.tar.gz \
            8113409d961c247e1c1d7d506043545db2d0eef6 "$GITHUB_SHA"
          sha256sum local-tools-delta.tar.gz > local-tools-delta.sha256
          tag="translation-local-${GITHUB_SHA:0:12}"
          gh release create "$tag" local-translation-standalone.tar.gz local-translation-standalone.sha256 local-tools-delta.tar.gz local-tools-delta.sha256 scripts/ops/restore-release-delta.py \
            --target "$GITHUB_SHA" --prerelease \
            --title "Local document translation ${GITHUB_SHA:0:12}" \
            --notes 'Exact-source standalone package. Local translation regression checks and loopback smoke passed. Unlimited local acceptance enabled. This package does not deploy ECS or publish a mini program.'
