name: com vinext compatibility (no deploy)

on:
  push:
    branches:
      - infra/com-cloudflare-readiness-20261106
    paths:
      - '.github/workflows/com-vinext-compat-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Inspect runtime environment
        run: |
          node --version
          npm --version
          git status --porcelain
      - name: Official Cloudflare vinext source compatibility scan
        run: |
          set -o pipefail
          npx --yes vinext@1.3.1 check 2>&1 | tee "$RUNNER_TEMP/vinext-check.txt"
          git diff --exit-code
      - name: Explicit no-deployment evidence
        if: always()
        run: |
          echo 'vinext check only. No init, build, deploy, credentials, DNS, Cloudflare or Vercel API changes.' >> "$GITHUB_STEP_SUMMARY"
