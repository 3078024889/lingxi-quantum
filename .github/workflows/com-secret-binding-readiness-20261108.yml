name: COM secret binding readiness — safe presence only
on:
  push:
    branches: [release/com-sasi-full-20261108]
    paths: ['.github/workflows/com-secret-binding-readiness-20261108.yml']
permissions: {contents: read}
jobs:
  audit:
    environment: cloudflare-production
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_SASI_ARTIFACTS: ${{ secrets.R2_BUCKET_SASI_ARTIFACTS }}
      ALIPAY_APP_ID: ${{ secrets.ALIPAY_APP_ID }}
      WECHAT_PAY_MCH_ID: ${{ secrets.WECHAT_PAY_MCH_ID }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
    steps:
      - name: Print only present/absent credential class, not secret values or lengths
        run: |
          node - <<'NODE'
          for(const group of [
            ["supabase-admin",["SUPABASE_SECRET_KEY","SUPABASE_SERVICE_ROLE_KEY"]],
            ["private-r2",["R2_ENDPOINT","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY","R2_BUCKET_SASI_ARTIFACTS"]],
            ["payment-gateway",["ALIPAY_APP_ID","WECHAT_PAY_MCH_ID","PAYPAL_CLIENT_ID"]]
          ]){
            const ready=group[0]==="supabase-admin"?group[1].some(k=>Boolean(process.env[k])):
              group[1].every(k=>Boolean(process.env[k]));
            console.log("COM_ENV_CLASS_"+group[0]+"_READY_"+ready);
          }
          NODE
