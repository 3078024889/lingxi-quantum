name: COM merchant payment and software delivery binding audit (NO DEPLOY)
on:
  push:
    branches:
      - fix/com-payment-runtime-readiness-20261108
      - release/com-sasi-full-20261108
    paths:
      - '.github/workflows/com-secret-binding-readiness-20261108.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    environment: cloudflare-production
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_SASI_ARTIFACTS: ${{ secrets.R2_BUCKET_SASI_ARTIFACTS }}
      ALIPAY_APP_ID: ${{ secrets.ALIPAY_APP_ID }}
      ALIPAY_PRIVATE_KEY: ${{ secrets.ALIPAY_PRIVATE_KEY }}
      ALIPAY_PUBLIC_KEY: ${{ secrets.ALIPAY_PUBLIC_KEY }}
      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_MCH_ID: ${{ secrets.WECHAT_MCH_ID }}
      WECHAT_API_V3_KEY: ${{ secrets.WECHAT_API_V3_KEY }}
      WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
      WECHAT_CERT_SERIAL_NO: ${{ secrets.WECHAT_CERT_SERIAL_NO }}
      WECHAT_PLATFORM_PUBLIC_KEY: ${{ secrets.WECHAT_PLATFORM_PUBLIC_KEY }}
      WECHAT_PLATFORM_PUBLIC_KEY_ID: ${{ secrets.WECHAT_PLATFORM_PUBLIC_KEY_ID }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
    steps:
      - name: Presence-only GitHub and deployed Cloudflare merchant binding audit
        run: |
          node --input-type=module <<'NODE'
          const groups={
            paypal:["PAYPAL_CLIENT_ID","PAYPAL_CLIENT_SECRET","PAYPAL_WEBHOOK_ID"],
            alipay:["ALIPAY_APP_ID","ALIPAY_PRIVATE_KEY","ALIPAY_PUBLIC_KEY"],
            wechat:["WECHAT_APP_ID","WECHAT_MCH_ID","WECHAT_API_V3_KEY","WECHAT_PRIVATE_KEY","WECHAT_CERT_SERIAL_NO","WECHAT_PLATFORM_PUBLIC_KEY","WECHAT_PLATFORM_PUBLIC_KEY_ID"],
            private_r2:["R2_ENDPOINT","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY","R2_BUCKET_SASI_ARTIFACTS"]
          };
          const present=v=>typeof v==="string"&&v.trim().length>0;
          for(const [group,required] of Object.entries(groups)){
            const missing=required.filter(k=>!present(process.env[k]));
            console.log("COM_GITHUB_"+group.toUpperCase()+"_READY="+(missing.length===0));
            console.log("COM_GITHUB_"+group.toUpperCase()+"_MISSING_NAMES="+missing.join(","));
          }
          console.log("COM_GITHUB_SUPABASE_ADMIN_READY="+(present(process.env.SUPABASE_SECRET_KEY)||present(process.env.SUPABASE_SERVICE_ROLE_KEY)));
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          if(!present(account)||!present(token))throw Error("CLOUDFLARE_READ_ONLY_AUDIT_CREDENTIALS_MISSING");
          const name="lingxifield-com-unified-20261108";
          const res=await fetch("https://api.cloudflare.com/client/v4/accounts/"+encodeURIComponent(account)+"/workers/scripts/"+name+"/settings",{
            headers:{authorization:"Bearer "+token},signal:AbortSignal.timeout(25000)
          });
          const j=await res.json();
          if(!res.ok||!j?.success)throw Error("CLOUDFLARE_READ_ONLY_BINDING_REQUEST_FAILED_"+res.status);
          const bindings=j.result?.bindings??[];
          const names=new Set(bindings.map(b=>b.name));
          for(const [group,required] of Object.entries(groups)){
            const missing=required.filter(k=>!names.has(k));
            console.log("COM_WORKER_"+group.toUpperCase()+"_READY="+(missing.length===0));
            console.log("COM_WORKER_"+group.toUpperCase()+"_MISSING_NAMES="+missing.join(","));
          }
          console.log("COM_WORKER_SUPABASE_ADMIN_READY="+(names.has("SUPABASE_SECRET_KEY")||names.has("SUPABASE_SERVICE_ROLE_KEY")));
          for(const flag of ["PAYPAL_ENABLED","ALIPAY_ENABLED","WECHAT_ENABLED","TOOL_PASS_COMMERCE_READY","TOOL_PASS_BACKEND_READY","NEXT_PUBLIC_TOOL_PASS_ENFORCED","SASI_MARKET_UPLOADS_ENABLED","SASI_MARKET_SALES_ENABLED","SASI_MARKET_DELIVERY_ENABLED","SASI_MARKET_PAYOUTS_ENABLED","SASI_MARKETPLACE_COMMERCE_READY","SOFTWARE_COMMERCE_READY"]){
            const b=bindings.find(x=>x.name===flag);
            console.log("COM_WORKER_FLAG_"+flag+"="+(b?.type==="plain_text"&&b.text==="true"));
          }
          console.log("COM_MERCHANT_AUDIT_COMPLETE_NO_KEYS_OR_USER_DATA_EXPOSED");
          NODE
