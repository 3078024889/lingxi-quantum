name: Celestial Wallet Account Tools premium redesign (NO DEPLOY)
on:
  push:
    branches: [feat/dual-celestial-wallet-account-tools-20261109]
  pull_request:
    branches: [release/com-sasi-full-20261108]
    paths:
      - 'app/account/page.tsx'
      - 'app/ai-wallet/page.tsx'
      - 'app/layout.tsx'
      - 'app/celestial-ui-20261109.css'
      - 'components/AccountCenterV26.tsx'
      - 'app/lingxifield-premium-20261109.css'
      - 'tests/dual-premium-visual-no-legacy-20261109.test.mjs'
      - 'tests/final-closure/dual-premium-new-visual.spec.ts'
      - 'components/WalletLivePanel.tsx'
      - 'components/tools/ToolsHubV11.tsx'
      - 'tests/celestial-premium-wallet-account-tools-20261109.test.mjs'
      - '.github/workflows/celestial-wallet-account-tools-20261109.yml'
permissions: {contents: read}
concurrency:
  group: celestial-wallet-account-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safety-ui-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      LINGXI_SELFHOST_BUILD: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.com
      NEXT_PUBLIC_SUPABASE_URL: https://sxsgdpqojepgbbrxrzlq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.28.0,run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc,cache: pnpm}
      - name: Install immutable packages
        run: pnpm install --frozen-lockfile
      - name: Exact user-approved visual + security behavior contracts
        run: |
          node --test tests/celestial-premium-wallet-account-tools-20261109.test.mjs
          node --test tests/cn-wallet-checkout-entry-20261108.test.mjs
          node --test tests/sasi-software-public-branding-20261108.test.mjs
      - name: TypeScript, eslint and production Next.js build
        run: |
          pnpm exec tsc --noEmit
          pnpm exec eslint components/AccountCenterV26.tsx components/WalletLivePanel.tsx components/tools/ToolsHubV11.tsx app/ai-wallet/page.tsx app/account/page.tsx
          pnpm build
          test -s .next/standalone/server.js
      - name: Preserve dual-site release gates
        run: |
          git diff --exit-code -- app/api lib/money lib/paypal.ts
          echo CELESTIAL_WALLET_ACCOUNT_TOOLS_BUILD_PASS_NO_DEPLOY
