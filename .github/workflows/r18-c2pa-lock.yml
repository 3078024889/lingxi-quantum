name: R18 C2PA pinned dependency lock
on:
  push:
    branches:
      - feat/r18-official-c2pa-verification-20261009
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Resolve pinned C2PA dependency
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit changed lockfile only
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name "lingxifield-lock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build(c2pa): lock official browser SDK and transitive dependencies"
          git push origin HEAD:feat/r18-official-c2pa-verification-20261009
