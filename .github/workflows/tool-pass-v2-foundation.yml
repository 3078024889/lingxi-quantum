name: Tool Pass V2 Foundation (no billing / no deployment)
on:
  pull_request:
    paths:
      - "config/tool-pass-offers.v2.json"
      - "lib/tools/commerce/tool-pass-v2.mjs"
      - "app/api/tools/pass/**"
      - "docs/commerce/tool-pass-v2-unapplied-database-draft.sql"
      - "tests/tool-pass-v2-contract.test.mjs"
      - ".github/workflows/tool-pass-v2-foundation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --version && node --test tests/tool-pass-v2-contract.test.mjs
