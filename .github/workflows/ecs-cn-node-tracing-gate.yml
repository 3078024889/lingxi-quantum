name: CN standalone dynamic Node dependency trace gate (no deploy)
on:
  push:
    branches: [feature/cn-runtime-node-tracing-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen application dependencies
        run: pnpm install --frozen-lockfile
      - name: Build actual Linux standalone (does not deploy)
        env:
          LINGXI_SELFHOST_BUILD: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
          NEXT_PUBLIC_SITE_URL: https://lingxifield.cn
        run: pnpm build
      - name: Verify dynamic imports exactly as on .cn 3189
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from "node:child_process";
          import {resolve} from "node:path";
          const root=resolve(".next/standalone");
          const modules=["mammoth","exceljs","@mozilla/readability","dompurify","turndown"];
          let failures=0;
          for(const mod of modules){
            const proc=spawnSync(process.execPath,[
              "--input-type=module","-e",
              "import("+JSON.stringify(mod)+").then(()=>process.exit(0)).catch(()=>process.exit(2))"
            ],{cwd:root,encoding:"utf8",timeout:15000});
            console.log("CN_STANDALONE_"+mod+"="+(proc.status===0?"PASS":"FAIL"));
            if(proc.status!==0)failures++;
          }
          if(failures)process.exit(1);
          console.log("CN_STANDALONE_DYNAMIC_NODE_IMPORTS_5_OF_5_PASS");
          NODE
