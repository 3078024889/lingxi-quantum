name: Import exact uploaded LINGXIFIELD sharing visual

on:
  push:
    branches:
      - 'release/unified-share-visual-20261105'
    paths:
      - '.github/workflows/lingxifield-import-share-image.yml'

permissions:
  contents: write

concurrency:
  group: lingxifield-one-time-share-asset-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-approved-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release branch for new OG and WeChat image
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch and verify exact attached image (not AI redrawn)
        env:
          SOURCE_IMAGE: 'https://d2ol7oe51mr4n9.cloudfront.net/user_38NxBpHJm2Hc77e0h58G97LXEgO/5cb42c3e-51b0-486f-ba7a-69f358bef85f.png'
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 --connect-timeout 15 --max-time 90 "$SOURCE_IMAGE" -o /tmp/lingxifield-user-share.png
          echo 'ca4c9d1671e403faecb865959a81231e1763528151448eb89e629bc4b8e9dea3  /tmp/lingxifield-user-share.png' | sha256sum --check -
      - name: Create whole-content padded social images without cropping text
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import {mkdir} from 'node:fs/promises';
          const input='/tmp/lingxifield-user-share.png';
          const m=await sharp(input).metadata();
          if(m.width!==1659||m.height!==948) throw Error('Source dimensions unexpectedly changed');
          await mkdir('miniapp/assets',{recursive:true});
          await sharp(input).resize(1200,630,{fit:'contain',position:'centre',background:'#f3f4ff'})
            .jpeg({quality:88,mozjpeg:true}).toFile('public/og-lingxifield-20261105.jpg');
          await sharp(input).resize(600,480,{fit:'contain',position:'centre',background:'#f3f4ff'})
            .jpeg({quality:84,mozjpeg:true}).toFile('miniapp/assets/share-lingxifield-20261105.jpg');
          NODE
      - name: Delete two superseded social assets only
        run: |
          set -euo pipefail
          git rm -- public/og-lingxifield-20260928.png miniapp/assets/share-lingxifield-20260928.png
          node --test tests/unified-share-image.test.mjs
          node --check miniapp/utils/share.js
          node --check miniapp/pages/share/index.js
      - name: Commit verified bytes to isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/og-lingxifield-20261105.jpg miniapp/assets/share-lingxifield-20261105.jpg
          git diff --cached --check
          git commit -m 'asset(share): use uploaded image for OG, X, WeChat and miniapp; remove old share assets'
          git push origin HEAD:refs/heads/release/unified-share-visual-20261105
