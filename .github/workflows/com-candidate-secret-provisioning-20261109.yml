name: COM candidate encrypted merchant, Supabase and private R2 provisioning
on:
  push:
    branches: [ops/com-candidate-secret-provisioning-20261109]
    paths:
      - '.github/workflows/com-candidate-secret-provisioning-20261109.yml'
      - 'scripts/cloudflare/com-provision-celestial-secrets-20261109.mjs'
      - 'tests/com-candidate-secret-provision-contract-20261109.test.mjs'
  workflow_dispatch:
    inputs:
      group:
        type: choice
        description: "Install only this secret group on the isolated candidate"
        options: [all, paypal, alipay, wechat, r2, supabase]
        default: all
        required: true
      mode:
        type: choice
        description: "Audit is read-only; provision installs encrypted secrets only and keeps every payment flag off"
        options: [audit, provision]
        default: audit
        required: true
permissions: {contents: read}
concurrency:
  group: com-candidate-secret-provisioning
  cancel-in-progress: false
jobs:
  candidate-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      COM_PROVISION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (startsWith(github.event.head_commit.message, 'COM_PROVISION_CANDIDATE_') && 'provision' || 'audit') }}
      COM_PROVISION_GROUP: ${{ github.event_name == 'workflow_dispatch' && inputs.group || (contains(github.event.head_commit.message, '_PAYPAL') && 'paypal' || contains(github.event.head_commit.message, '_ALIPAY') && 'alipay' || contains(github.event.head_commit.message, '_WECHAT') && 'wechat' || contains(github.event.head_commit.message, '_R2') && 'r2' || contains(github.event.head_commit.message, '_SUPABASE') && 'supabase' || 'all') }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_SASI_ARTIFACTS: ${{ secrets.R2_BUCKET_SASI_ARTIFACTS }}
      ALIPAY_APP_ID: ${{ secrets.ALIPAY_APP_ID }}
      ALIPAY_PRIVATE_KEY: ${{ secrets.ALIPAY_PRIVATE_KEY }}
      ALIPAY_PUBLIC_KEY: ${{ secrets.ALIPAY_PUBLIC_KEY }}
      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_MCH_ID: ${{ secrets.WECHAT_MCH_ID }}
      WECHAT_API_V3_KEY: ${{ secrets.WECHAT_API_V3_KEY }}
      WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
      WECHAT_CERT_SERIAL_NO: ${{ secrets.WECHAT_CERT_SERIAL_NO }}
      WECHAT_PLATFORM_PUBLIC_KEY: ${{ secrets.WECHAT_PLATFORM_PUBLIC_KEY }}
      WECHAT_PLATFORM_PUBLIC_KEY_ID: ${{ secrets.WECHAT_PLATFORM_PUBLIC_KEY_ID }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Validate syntax and candidate-only provisioning contract
        run: |
          set -Eeuo pipefail
          node --check scripts/cloudflare/com-provision-celestial-secrets-20261109.mjs
          node --test tests/com-candidate-secret-provision-contract-20261109.test.mjs
      - name: Audit or provision encrypted secrets on the isolated candidate only
        run: node scripts/cloudflare/com-provision-celestial-secrets-20261109.mjs

# READ_ONLY_AUDIT_REFRESH_20261110
