name: COM CN all sitemap public tool pages real status census (READ ONLY)
on:
  push:
    branches: [infra/com-cloudflare-readiness-20261106]
    paths: ['.github/workflows/com-live-public-tool-sitemap-crawl-readonly-20261107.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check all published public tool detail URLs, not just three smoke paths
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,xml.etree.ElementTree as ET,concurrent.futures,json,re,collections
          from urllib.parse import urlsplit
          useragent="LINGXIFIELD-authorized-public-readonly-tool-audit/1.0"
          def fetch(url):
              req=urllib.request.Request(url,headers={"User-Agent":useragent,"Accept":"text/html,application/xml;q=0.9,*/*;q=0.8","Cache-Control":"no-cache"})
              try:
                  with urllib.request.urlopen(req,timeout=18) as f: return f.status,f.read(1000000) if "/sitemap" in url else b""
              except urllib.error.HTTPError as e:
                  b=e.read(2048)
                  return e.code,b
              except Exception as e:return 0,type(e).__name__.encode()
          paths=set()
          # Native published sitemap is evidence of actually discoverable routes.
          code,body=fetch("https://lingxifield.cn/sitemap.xml")
          print("CN_SITEMAP",code,len(body))
          if code==200:
              try:
                  root=ET.fromstring(body)
                  for e in root.iter():
                      if e.tag.rsplit("}",1)[-1]=="loc" and e.text:
                          p=urlsplit(e.text).path
                          if re.fullmatch(r"/tools/[a-z0-9-]+/?",p):paths.add(p.rstrip("/"))
              except Exception as exc: print("SITEMAP_PARSE_FAILED",type(exc).__name__)
          # Supplement published sitemap with known critical routes without inventing functionality.
          paths.update(("/tools/pdf-editor","/tools/e-sign-pdf","/tools/pdf-merge-split","/tools/pdf-to-jpg","/tools/food-calorie","/tools/video-transcription","/tools/image-translator","/tools/handwriting-ocr"))
          print("PUBLIC_PUBLISHED_TOOL_COUNT",len(paths))
          if len(paths)<40:raise SystemExit("SITEMAP_DISCOVERY_TOO_SMALL_DO_NOT_CALL_COMPLETE")
          jobs=[(host,path) for host in ("lingxifield.cn","lingxifield.com") for path in sorted(paths)]
          def check(v):
              host,path=v
              status,body=fetch("https://"+host+path)
              marker="1102" if b"1102" in body else "1101" if b"1101" in body else ""
              return (host,path,status,marker)
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as pool:
              results=list(pool.map(check,jobs))
          summary={}
          for host in ("lingxifield.cn","lingxifield.com"):
              subset=[x for x in results if x[0]==host]
              statuses=dict(collections.Counter(x[2] for x in subset))
              errors=[{"path":x[1],"code":x[2],"cloudflare":x[3]} for x in subset if x[2]!=200]
              summary[host]={"total":len(subset),"statusCounts":statuses,"errors":errors[:150]}
              print("TOOL_SITE_STATUS",host,json.dumps(summary[host],ensure_ascii=False))
          with open("tool-census-readonly.json","w") as f:json.dump(summary,f,ensure_ascii=False,indent=2)
          print("REAL_HTTP_CENSUS_NO_POST_NO_PAYMENT_NO_AUTH_DONE")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dual-site-tool-census-readonly
          path: tool-census-readonly.json
          retention-days: 3
