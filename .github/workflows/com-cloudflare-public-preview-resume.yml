name: com Cloudflare public preview resume after R2 verified (no reupload)

on:
  push:
    branches:
      - infra/com-cloudflare-readiness-20261106
    paths:
      - '.github/workflows/com-cloudflare-public-preview-resume.yml'

permissions:
  contents: read

concurrency:
  group: com-cf-single-public-preview-resume
  cancel-in-progress: false

jobs:
  public-only-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: cloudflare-com-preview
    steps:
      - name: Validate exact SHA, branch and public-preview-only acknowledgement
        env:
          APPROVAL: PUBLIC_PREVIEW_ONLY_NO_BACKEND
          SOURCE_SHA: ${{ github.sha }}
          R2_BUCKET: lingxifield-com-public-assets
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/infra/com-cloudflare-readiness-20261106"
          test "$APPROVAL" = "PUBLIC_PREVIEW_ONLY_NO_BACKEND"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R2_BUCKET" =~ ^[a-z0-9][a-z0-9-]{2,62}$ ]]
      - name: Checkout exact reviewed commit without saving token
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Setup project Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Original dependency integrity
        run: pnpm install --frozen-lockfile
      - name: Audit public-only and delivery guards
        run: |
          node --test tests/cloudflare/*.test.mjs
          node scripts/cloudflare/audit-large-assets.mjs --fail-unaccounted
      - name: Generate assets and isolate live backend from preview
        env:
          CI: "true"
        run: |
          set -euo pipefail
          node scripts/prepare-media-runtime.cjs
          node scripts/cloudflare/stage-large-assets.mjs --ci-stage --public public --stage "$RUNNER_TEMP/com-r2-seven" --cdn https://assets.lingxifield.com --json "$RUNNER_TEMP/com-source-assets.json"
          node scripts/cloudflare/stage-emergency-public.mjs --ci-stage --root . --stage "$RUNNER_TEMP/com-legacy-api" --json "$RUNNER_TEMP/com-disabled-api.json"
      - name: Create temporary Cloudflare build without modifying main/Vercel
        run: |
          npx --yes vinext@1.3.1 init \
            --platform=cloudflare \
            --name lingxifield-public-preview-only \
            --cdn-cache=none \
            --data-cache=none \
            --image-optimization=none \
            --skip-check
      - name: Build and stage post-bundle oversized WASM
        env:
          CI: "true"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          set -euo pipefail
          # Preview Build Output must be explicitly produced for a real Worker Preview.
          CLOUDFLARE_PREVIEW_BUILD=true pnpm run build:vinext
          ASSETS=.cloudflare/output/v0/workers/default/assets
          if test ! -f "$ASSETS/_redirects"; then cp public/_redirects "$ASSETS/_redirects"; fi
          node scripts/cloudflare/stage-built-assets.mjs --ci-stage --assets "$ASSETS" --redirects "$ASSETS/_redirects" --source-manifest "$RUNNER_TEMP/com-source-assets.json" --stage "$RUNNER_TEMP/com-postbuild-assets" --cdn https://assets.lingxifield.com --json "$RUNNER_TEMP/com-postbuild-assets.json"
      - name: Cloudflare API token and account required
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Verify all seven public R2 files with Range+CORS+full SHA
        run: |
          node scripts/cloudflare/convert-r2-proof-manifest.mjs --input "$RUNNER_TEMP/com-source-assets.json" --output "$RUNNER_TEMP/com-r2-proof.json"
          node scripts/cloudflare/prove-r2-assets.mjs --cdn https://assets.lingxifield.com --manifest "$RUNNER_TEMP/com-r2-proof.json" --full
          node --input-type=module - <<'NODE'
          import {readFileSync} from "node:fs";
          import {join} from "node:path";
          import {proveAsset} from "./scripts/cloudflare/prove-r2-assets.mjs";
          const m=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,"com-postbuild-assets.json"),"utf8"));
          for(const item of m.artifacts.filter(x=>!x.matchesTrackedSource)){
            const result=await proveAsset("https://assets.lingxifield.com",{
              path:item.destination,bytes:item.bytes,sha256:item.sha256},{full:true});
            if(!result.ok)throw Error("GENERATED_R2_ASSET_UNVERIFIED");
          }
          NODE
      - name: Publish preview Worker only (never production custom domains)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          # `deploy --preview` only selects Vite preview mode; it does NOT create a Worker Preview.
          # --skip-build preserves the already-audited 25 MiB asset filtering and redirects.
          npx --yes @vinext/cloudflare@1.4.3 previews deploy com-public-recovery --skip-build | tee "$RUNNER_TEMP/com-cloudflare-preview-deploy.log"
          if ! grep -Eq 'https://[^ ]+\.workers\.dev' "$RUNNER_TEMP/com-cloudflare-preview-deploy.log"; then
            echo "::error::Cloudflare preview did not return a public workers.dev URL."
            exit 1
          fi
      - name: Verify online preview pages and fail-closed paid APIs
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          import {join} from "node:path";
          import {smokePreview,previewOrigin} from "./scripts/cloudflare/smoke-emergency-preview.mjs";
          const raw=readFileSync(join(process.env.RUNNER_TEMP,"com-cloudflare-preview-deploy.log"),"utf8")
             .replace(/\x1b\[[0-9;]*m/g,"");
          const found=[...raw.matchAll(/https:\/\/[-.a-z0-9]+\.workers\.dev\/?/g)].map(x=>x[0]);
          const origins=[...new Set(found.map(x=>{try{return previewOrigin(x)}catch{return null}}).filter(Boolean))];
          if(!origins.length)throw Error("PUBLIC_PREVIEW_URL_NOT_FOUND");
          let validated=null;
          for(const url of origins){
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const result=await smokePreview(url);
                if(result.status==="passed"){validated=result;break}
              }catch(e){console.error("PREVIEW_SMOKE_RETRY",attempt,e.message)}
              await new Promise(resolve=>setTimeout(resolve,2500));
            }
            if(validated)break;
          }
          if(!validated)throw Error("PREVIEW_HTTP_EIGHT_CHECKS_FAILED");
          console.log("VERIFIED_PUBLIC_PREVIEW_URL",validated.origin);
          console.log("PREVIEW_HTTP_CHECKS_PASSED",validated.checks.length);
          console.log("PUBLIC_ONLY_NOT_FULL_PRODUCTION");
          NODE
      - name: Record preview-only guarantees
        if: always()
        run: |
          echo "## .com emergency Cloudflare preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public-only preview: billing/login/SASI API deliberately 503" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker preview URL is supplied by Cloudflare CLI, not .com DNS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vercel project, production DNS and all .cn configurations remain unchanged" >> "$GITHUB_STEP_SUMMARY"
