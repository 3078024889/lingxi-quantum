name: CN3194 exact release transfer helper lint (NO DEPLOY)
on:
  push:
    branches: [fix/cn3194-marketplace-503-transfer-20261113, feat/homepage-reference-rebuild-cn-20261113, cleanup/cn-retired-sasi-full-20261113, ci/cn3194-payment-base-20261110]
    paths:
      - 'scripts/ops/R2-CN3195-Transfer-20261113.ps1'
      - 'scripts/ops/R2-CN3195-Transfer-20261114-f3d4.ps1'
      - 'scripts/ops/R2-CN3195-Transfer-20261114.ps1'
      - '.github/workflows/cn3194-transfer-helper-check-20261113.yml'
permissions:
  contents: read
concurrency:
  group: cn3194-transfer-helper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Parse PowerShell and verify immutable release pin
        shell: pwsh
        run: |
          $path = 'scripts/ops/R2-CN3195-Transfer-20261114-f3d4.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            throw 'POWERSHELL_PARSE_FAILED'
          }
          $source = Get-Content -LiteralPath $path -Raw
          $required = @(
            "ecs-cn-unified-20261110-f3d4d5200861",
            "f3d4d52008617c5094ea64ac3835bf5a08fb6410",
            "827ff4489f2bf9a076ff40a2d4fd8e2ef99154c541015e5f814ab1c7d6e84fd5",
            "338041752",
            "R2_REMOTE_SIZE_VERIFY_FAILED",
            "R2_SIGNED_LINK_INVALID",
            "CN3195_ACTIVE_NGINX_UPSTREAM_UNCHANGED",
            "CN3194_PRODUCTION_PROMOTION_NOT_EXECUTED",
            "CN3193_ROLLBACK_BASELINE_RETAINED",
            "SIGNED_URLS_EXPIRE_IN_6_HOURS_AND_ARE_NOT_PRINTED"
          )
          foreach ($needle in $required) {
            if (-not $source.Contains($needle)) { throw "PIN_OR_SAFETY_CHECK_MISSING:$needle" }
          }
          if ($source.Contains('199ff1c73d43ffc13abc887c51ebcc091f5e305e') -or $source.Contains('fe253a6be0eae2360245e0a183820a7e2c3be1ed') -or $source.Contains('e6c2a4612b9b72091497420477945753ebae8986')) {
            throw 'STALE_3194_RELEASE_PIN_REJECTED'
          }
          Write-Host 'CN3194_TRANSFER_HELPER_PARSE_AND_EXACT_RELEASE_PIN_PASS_NO_DEPLOY'
      - name: Parse current 071e release transfer helper (NO DEPLOY)
        shell: pwsh
        run: |
          $path = 'scripts/ops/R2-CN3195-Transfer-20261114.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            throw 'POWERSHELL_PARSE_FAILED'
          }
          $source = Get-Content -LiteralPath $path -Raw
          $required = @(
            "ecs-cn-unified-20261110-071e193ab3bb",
            "071e193ab3bb68422c8bf33470a8aee94fd48524",
            "338043934",
            "deb802c158869c49465651c16342f103f8bdb1662126c90c8e9ce57756ae96ae",
            "d9e5382c2a741262b0efbd09a9d214fc7e8f9da9d86e3a69124d2802958e4ca4",
            "903d487d75bc45d0a63d1e1376fcc9dfd4c84f170306806550b2969071b82a54",
            "455d6b64a2b47421ea98a2adb96e838c29868eb776f91c3216b3aa2a7cc82352",
            "64762dd7378083f55926a912502d99a8c28da71d3494c2e7ea327c9e8fd29172",
            "R2_REMOTE_SIZE_VERIFY_FAILED",
            "R2_SIGNED_LINK_INVALID",
            "CN3195_ACTIVE_NGINX_UPSTREAM_UNCHANGED",
            "CN3194_PRODUCTION_PROMOTION_NOT_EXECUTED",
            "CN3193_ROLLBACK_BASELINE_RETAINED",
            "SIGNED_URLS_EXPIRE_IN_6_HOURS_AND_ARE_NOT_PRINTED"
          )
          foreach ($needle in $required) {
            if (-not $source.Contains($needle)) { throw "PIN_OR_SAFETY_CHECK_MISSING:$needle" }
          }
          if ($source.Contains('199ff1c73d43ffc13abc887c51ebcc091f5e305e') -or $source.Contains('fe253a6be0eae2360245e0a183820a7e2c3be1ed')) {
            throw 'STALE_3194_RELEASE_PIN_REJECTED'
          }
          Write-Host 'CN3194_071E_TRANSFER_HELPER_PARSE_AND_EXACT_RELEASE_PIN_PASS_NO_DEPLOY'
