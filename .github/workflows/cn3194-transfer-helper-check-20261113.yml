name: CN3194 exact release transfer helper lint (NO DEPLOY)
on:
  push:
    branches: [fix/cn3194-marketplace-503-transfer-20261113]
    paths:
      - 'scripts/ops/R2-CN3195-Transfer-20261113.ps1'
      - '.github/workflows/cn3194-transfer-helper-check-20261113.yml'
permissions:
  contents: read
concurrency:
  group: cn3194-transfer-helper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Parse PowerShell and verify immutable release pin
        shell: pwsh
        run: |
          $path = 'scripts/ops/R2-CN3195-Transfer-20261113.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            throw 'POWERSHELL_PARSE_FAILED'
          }
          $source = Get-Content -LiteralPath $path -Raw
          $required = @(
            "ecs-cn-unified-20261110-fe253a6be0ea",
            "fe253a6be0eae2360245e0a183820a7e2c3be1ed",
            "5197da76e2c4298268a7c87011d875052bffc052a0e890836b7c8468e3f8093a",
            "R2_REMOTE_SIZE_VERIFY_FAILED",
            "R2_SIGNED_LINK_INVALID",
            "SIGNED_URLS_EXPIRE_IN_6_HOURS_AND_ARE_NOT_PRINTED"
          )
          foreach ($needle in $required) {
            if (-not $source.Contains($needle)) { throw "PIN_OR_SAFETY_CHECK_MISSING:$needle" }
          }
          if ($source.Contains('ef30fe26a136c9879ef480767a7abf66c3e3509c')) {
            throw 'STALE_3194_RELEASE_PIN_REJECTED'
          }
          Write-Host 'CN3194_TRANSFER_HELPER_PARSE_AND_EXACT_RELEASE_PIN_PASS_NO_DEPLOY'
