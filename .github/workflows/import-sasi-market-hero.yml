name: Import exact user-supplied SASI marketplace hero

on:
  push:
    branches:
      - fix/sasi-fullwidth-transparent-hero-20261112
      - fix/cn-sasi-fullwidth-transparent-hero-20261112
    paths:
      - .github/workflows/import-sasi-market-hero.yml

permissions:
  contents: write

concurrency:
  group: sasi-market-hero-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-exact-artwork:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download and verify the exact supplied PNG
        shell: bash
        run: |
          set -euo pipefail
          target='public/images/sasi/sasi-market-hero-lingxifield.png'
          mkdir -p "$(dirname "$target")"
          curl --fail --location --silent --show-error \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_38NxBpHJm2Hc77e0h58G97LXEgO/77ca6b9c-63ca-454a-9b08-836d9fef900e.png' \
            --output "$target"
          echo 'd718ed0c5a4115b7eb4e47ba3a940ceeee2623fade73fe4beccefce1cc73d9cc  '"$target" | sha256sum --check -
          python3 - "$target" <<'PY'
          import struct, sys
          data = open(sys.argv[1], 'rb').read()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'not a PNG'
          width, height = struct.unpack('>II', data[16:24])
          bit_depth, color_type = data[24], data[25]
          assert (width, height) == (1024, 341), (width, height)
          assert color_type == 6, f'expected RGBA PNG, got color type {color_type}'
          print(f'EXACT_ASSET_OK width={width} height={height} bit_depth={bit_depth} color_type={color_type}')
          PY

      - name: Commit exact original asset to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/sasi/sasi-market-hero-lingxifield.png
          if git diff --cached --quiet; then
            echo 'Exact asset already present; no commit required.'
            exit 0
          fi
          git commit -m 'SASI: add exact user-supplied transparent marketplace hero'
          git push origin "HEAD:${GITHUB_REF_NAME}"
