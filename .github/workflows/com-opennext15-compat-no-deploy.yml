name: Cloudflare OpenNext 1.20.16 Next15 main-site compatibility (NO DEPLOY)
on:
  push:
    branches: [cloudflare/opennext15-compat-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
      NEXT_PUBLIC_SITE_URL: https://lingxifield.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: {version: 11.28.0,run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version-file: .nvmrc,cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Cloudflare compatibility and size inventory
        run: |
          node -e 'if(require("./package.json").dependencies.next!=="15.5.29")process.exit(1)'
          node scripts/cloudflare/audit-com-readiness.mjs --json cloudflare-report.json
          node scripts/cloudflare/audit-large-assets.mjs --json cloudflare-assets.json
      - name: Install pinned official adapter in throwaway CI only
        run: |
          pnpm add -D @opennextjs/cloudflare@1.20.16 wrangler@4.158.0 --save-exact
          node -p 'require("./node_modules/@opennextjs/cloudflare/package.json").version' | grep -qx '1.20.16'
          node -p 'require("./node_modules/wrangler/package.json").version' | grep -qx '4.158.0'
      - name: Build REAL app using Cloudflare workerd adapter
        run: |
          pnpm exec opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
      - name: Detect capacity and bindings via no-network/no-deploy dry run
        run: |
          pnpm exec wrangler deploy --dry-run --outdir "${RUNNER_TEMP}/cloudflare-dry-run"
          echo "CLOUDFLARE_COMPATIBILITY_DRY_RUN_SUCCESS_NOT_AN_ACTUAL_RUNTIME_TEST"
      - name: Keep only redacted text readiness reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: lingxifield-com-opennext-compat-${{ github.sha }}
          path: |
            cloudflare-report.json
            cloudflare-assets.json
          retention-days: 1
          if-no-files-found: ignore
