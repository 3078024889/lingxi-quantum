name: COM verified next SASI apex cutover with rollback (pinned 47291c88edef)
on:
  push:
    branches: [release/com-sasi-full-20261108]
    paths: ['.github/workflows/com-next-verified-apex-release-20261108.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: lingxifield-com-apex-one-time-release
  cancel-in-progress: false
jobs:
  safe-apex-cutover:
    runs-on: ubuntu-24.04
    environment: cloudflare-production
    timeout-minutes: 38
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      COM_VERIFIED_CANARY_RUN: '42466934312'
      COM_VERIFIED_CANARY_SHA: '47291c88edef993fedbdfe5763df73ccff77c20b'
      # Live route read-only audit 42468436728: announcements use a dedicated public Worker.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Validate pinned canary and current routes before any mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$GH_TOKEN"
          curl -fLsS --retry 2 --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/3078024889/lingxi-quantum/actions/runs/$COM_VERIFIED_CANARY_RUN" \
            | jq -e --arg sha "$COM_VERIFIED_CANARY_SHA" \
              '.status=="completed" and .conclusion=="success" and .head_sha==$sha and .run_attempt>=2'
          node --check scripts/cloudflare/com-next-apex-verified-cutover-20261108.mjs
          echo COM_PRECHECK_PINNED_CANARY_SUCCESS
      - name: Promote verified isolated Worker to apex with automatic rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/cloudflare/com-next-apex-verified-cutover-20261108.mjs
      - name: Record verified deployment provenance
        run: |
          echo "COM_RELEASE_CANARY_RUN=$COM_VERIFIED_CANARY_RUN"
          echo "COM_RELEASE_SOURCE_SHA=$COM_VERIFIED_CANARY_SHA"
          echo 'COM_APEX_PROMOTION_GATED_SUCCESS'
