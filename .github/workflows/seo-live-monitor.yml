name: LINGXIFIELD Daily Live Search Visibility
on:
  schedule:
    # Daily 09:15 Singapore / Beijing (01:15 UTC); active after merged to default branch.
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingxifield-live-seo-readonly
  cancel-in-progress: false
jobs:
  monitor:
    name: read-only-Google-Bing-Baidu-discoverability
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout deployed SEO probe source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Audit both public domains without deployment or API submission
        run: node scripts/seo/live-postdeploy-check.mjs
