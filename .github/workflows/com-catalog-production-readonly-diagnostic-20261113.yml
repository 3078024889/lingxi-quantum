name: COM marketplace runtime binding diagnosis (READ ONLY)
on:
  push:
    branches: [diag/com-catalog-production-20261113]
    paths:
      - '.github/workflows/com-catalog-production-readonly-diagnostic-20261113.yml'
permissions:
  contents: read
concurrency:
  group: com-catalog-runtime-diagnostic
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: cloudflare-production
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_SUPABASE_URL: https://sxsgdpqojepgbbrxrzlq.supabase.co
      EXPECTED_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Compare production Worker public Supabase bindings without revealing values
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'JS'
          const account=process.env.CF_ACCOUNT,token=process.env.CF_TOKEN;
          if(!account||!token)throw Error("CLOUDFLARE_READONLY_DIAGNOSTIC_CONFIG_MISSING");
          const url="https://api.cloudflare.com/client/v4/accounts/"+account+
            "/workers/scripts/lingxifield-com-celestial-20261109/settings";
          const response=await fetch(url,{headers:{Authorization:"Bearer "+token},signal:AbortSignal.timeout(20000)});
          const payload=await response.json();
          if(!response.ok||payload.success!==true)throw Error("WORKER_SETTINGS_READ_FAILED_HTTP_"+response.status);
          const bindings=payload.result?.bindings||[];
          const get=name=>bindings.find(x=>x.name===name);
          const actualUrl=String(get("NEXT_PUBLIC_SUPABASE_URL")?.text||"");
          const actualKey=String(get("NEXT_PUBLIC_SUPABASE_ANON_KEY")?.text||"");
          const expectedUrl=process.env.EXPECTED_SUPABASE_URL||"";
          const expectedKey=process.env.EXPECTED_SUPABASE_ANON_KEY||"";
          console.log("COM_PROD_SUPABASE_URL_MATCH="+(actualUrl===expectedUrl));
          console.log("COM_PROD_SUPABASE_URL_PRESENT="+Boolean(actualUrl));
          console.log("COM_PROD_SUPABASE_ANON_KEY_MATCH="+(actualKey===expectedKey));
          console.log("COM_PROD_SUPABASE_ANON_KEY_PRESENT="+Boolean(actualKey));
          console.log("COM_PROD_SUPABASE_ANON_KEY_LENGTH="+actualKey.length);
          console.log("COM_PROD_SUPABASE_ANON_KEY_FORMAT="+(/^eyJ/.test(actualKey)?"JWT":/^sb_publishable_/.test(actualKey)?"PUBLISHABLE":"OTHER"));
          for(const name of ["SUPABASE_SECRET_KEY","SUPABASE_SERVICE_ROLE_KEY"]){
            const binding=get(name);
            console.log("COM_PROD_"+name+"_BINDING_TYPE="+(binding?.type||"MISSING"));
          }
          JS
      - name: Read public catalog status and coarse diagnostic headers only
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'JS'
          for(const host of ["https://lingxifield.com","https://lingxifield.cn"]){
            const url=host+"/api/sasi/marketplace/listings";
            try{
              const r=await fetch(url,{headers:{accept:"application/json"},redirect:"manual",signal:AbortSignal.timeout(20000)});
              const body=await r.json().catch(()=>null);
              console.log("PUBLIC_CATALOG",new URL(host).hostname,
                "HTTP="+r.status,
                "DIAGNOSTIC="+(r.headers.get("x-lingxi-catalog-diagnostic")||"none"),
                "ITEMS_ARRAY="+Array.isArray(body?.items),
                "ITEM_COUNT="+(Array.isArray(body?.items)?body.items.length:"none"),
                "ERROR="+(typeof body?.error==="string"?body.error:"none"));
            }catch(e){
              console.log("PUBLIC_CATALOG",new URL(host).hostname,"REQUEST_ERROR="+(e?.name||"unknown"));
            }
          }
          for(const host of ["https://lingxifield.com","https://lingxifield.cn"]){
            for(const path of ["/api/sasi/marketplace/listings?mode=mine","/api/sasi/marketplace/seller","/api/sasi/marketplace/my-orders"]){
              const r=await fetch(host+path,{headers:{accept:"application/json"},redirect:"manual",signal:AbortSignal.timeout(15000)});
              console.log("PRIVATE_ANON_BOUNDARY",new URL(host).hostname,path,"HTTP="+r.status);
            }
          }
          JS
