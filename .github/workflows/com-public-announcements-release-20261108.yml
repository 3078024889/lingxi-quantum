name: COM release public announcement Worker (no CN proxy, guarded route rollback)
on:
  push:
    branches: [release/com-sasi-full-20261108]
    paths: ['.github/workflows/com-public-announcements-release-20261108.yml']
permissions: {contents: read}
concurrency:
  group: com-public-announcement-route-production-20261108
  cancel-in-progress: false
jobs:
  deploy-and-switch:
    runs-on: ubuntu-24.04
    environment: cloudflare-production
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
      NEXT_PUBLIC_SUPABASE_URL: https://sxsgdpqojepgbbrxrzlq.supabase.co
      PUBLIC_ANNOUNCE_WORKER: lingxifield-com-public-announcements-20261108
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.28.0,run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc,cache: pnpm}
      - name: Build tiny public-only Worker (no extra servers, privileged keys or payments)
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          pnpm install --frozen-lockfile
          pnpm add -D wrangler@4.158.0 --save-exact
          node --check workers/com-public-announcements-20261108/src/index.mjs
          node <<'NODE'
          const fs=require('fs');
          const j={name:process.env.PUBLIC_ANNOUNCE_WORKER,main:'workers/com-public-announcements-20261108/src/index.mjs',
           compatibility_date:'2026-11-08',workers_dev:true,upload_source_maps:false,
           vars:{SUPABASE_URL:process.env.NEXT_PUBLIC_SUPABASE_URL,SUPABASE_PUBLIC_KEY:process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY}};
          fs.writeFileSync('.wrangler-com-announcements.jsonc',JSON.stringify(j,null,2));
          if(j.name!=='lingxifield-com-public-announcements-20261108'||j.routes||j.route)throw Error('ROUTE_SAFETY_GUARD');
          console.log('PUBLIC_ANNOUNCE_WORKER_MINIMAL_NO_PROD_ROUTES');
          NODE
          pnpm exec wrangler deploy --config .wrangler-com-announcements.jsonc --minify --no-upload-source-maps
      - name: Strict remote signed-free public database feed and RLS acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://$PUBLIC_ANNOUNCE_WORKER.3078024889.workers.dev/api/site-announcements"
          for i in 1 2 3;do
            json="$(mktemp)"
            status="$(curl -4sS --connect-timeout 10 --max-time 25 -o "$json" -w '%{http_code}' "$base" || true)"
            echo "COM_ANNOUNCE_WORKERS_DEV_HTTP_$status trial=$i"
            test "$status" = 200
            jq -e '(.items|type)=="array" and (.items|length>=1) and (.items|length<=8) and (.items|all(.titleZh!=null and .href=="/announcements"))' "$json" >/dev/null
            echo "COM_ANNOUNCE_VERIFIED_PUBLIC_ITEMS_$(jq -r '.items|length' "$json")"
            rm -f "$json"
          done
          echo 'COM_PUBLIC_ANNOUNCEMENT_WORKER_REMOTE_VERIFIED'
      - name: Change only .com public announcement exact route, preserve admin/toolpass/WWW, rollback if failed
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const tok=process.env.CLOUDFLARE_API_TOKEN,acc=process.env.CLOUDFLARE_ACCOUNT_ID;
          const prefix='https://api.cloudflare.com/client/v4';
          async function cf(path,init={}){const res=await fetch(prefix+path,{...init,headers:{authorization:'Bearer '+tok,'content-type':'application/json'},signal:AbortSignal.timeout(25000)});
           const v=await res.json();if(!res.ok||!v.success)throw Error('CF_API_HTTP_'+res.status+':'+JSON.stringify(v.errors?.map(e=>e.code)));return v.result;}
          const zone=(await cf('/zones?name=lingxifield.com')).filter(z=>z.name==='lingxifield.com'&&z.status==='active');
          if(zone.length!==1)throw Error('EXACT_ZONE_NOT_FOUND');
          const zoneId=zone[0].id,routes=await cf('/zones/'+zoneId+'/workers/routes');
          const intended=routes.filter(x=>x.pattern==='lingxifield.com/api/site-announcements*');
          if(intended.length!==1||intended[0].script!=='lingxifield-com-admin-facade')throw Error('ANNOUNCEMENT_ROUTE_NOT_EXPECTED');
          for(const pattern of ['lingxifield.com/api/account/money-admin*','lingxifield.com/api/tools/pass*'])
           if(routes.filter(x=>x.pattern===pattern&&x.script==='lingxifield-com-admin-facade').length!==1)throw Error('ADMIN_ROUTE_MISMATCH');
          for(const p of ['lingxifield.com/*','www.lingxifield.com/*'])
           if(routes.filter(x=>x.pattern===p).length!==1)throw Error('SITE_MAIN_ROUTE_MISSING');
          const uri='/zones/'+zoneId+'/workers/routes/'+intended[0].id;
          async function put(script){const value=await cf(uri,{method:'PUT',body:JSON.stringify({pattern:'lingxifield.com/api/site-announcements*',script})});
           if(value.script!==script)throw Error('ROUTE_WRITE_MISMATCH');}
          let modified=false,ok=false;
          try{
           await put(process.env.PUBLIC_ANNOUNCE_WORKER);modified=true;console.log('COM_ANNOUNCEMENT_ROUTE_PROMOTED_ONLY');
           let consecutive=0;
           for(let i=0;i<14;i++){
            let status=0,count=0;
            try{const rr=await fetch('https://lingxifield.com/api/site-announcements?release_probe='+i,{signal:AbortSignal.timeout(24000),cache:'no-store'});status=rr.status;
             const v=await rr.json();count=Array.isArray(v.items)?v.items.length:0;}catch{}
            console.log('COM_ANNOUNCEMENT_APEX_PROBE_'+i+'_HTTP_'+status+'_ITEMS_'+count);
            if(status===200&&count>=1)consecutive++;else consecutive=0;
            if(consecutive>=3){ok=true;break}
            await new Promise(done=>setTimeout(done,3500));
           }
           if(!ok)throw Error('PUBLIC_ANNOUNCEMENT_APEX_NOT_READY');
           const after=await cf('/zones/'+zoneId+'/workers/routes');
           if(after.filter(x=>x.pattern==='lingxifield.com/api/site-announcements*'&&x.script===process.env.PUBLIC_ANNOUNCE_WORKER).length!==1)throw Error('PUBLIC_ANNOUNCEMENT_ROUTE_NOT_PERSISTED');
           console.log('COM_PUBLIC_ANNOUNCEMENTS_PRODUCTION_PASS_5_ACTIVE_FROM_SUPABASE');
          }finally{if(modified&&!ok){console.log('COM_ANNOUNCEMENT_ROLLBACK_STARTED');await put('lingxifield-com-admin-facade');console.log('COM_ANNOUNCEMENT_ROLLBACK_CONFIRMED')}}
          NODE
