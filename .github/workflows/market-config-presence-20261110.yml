name: Marketplace scanner configuration presence only
on:
  push:
    branches: [ops/cn-celestial-static-assets-20261109]
    paths: ['.github/workflows/market-config-presence-20261110.yml']
permissions: {contents: read}
jobs:
  scanner:
    runs-on: ubuntu-24.04
    environment: sasi-market-scanner
    timeout-minutes: 3
    env:
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_SASI_ARTIFACTS: ${{ secrets.R2_BUCKET_SASI_ARTIFACTS }}
    steps:
      - name: Print booleans only
        run: |
          python3 - <<'PY'
          import os,json
          names=['SUPABASE_URL','SUPABASE_SECRET_KEY','R2_ENDPOINT','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','R2_BUCKET_SASI_ARTIFACTS']
          print(json.dumps({name:bool(os.environ.get(name,'').strip()) for name in names}))
          PY
