name: LINGXIFIELD DOCX Real Output Browser Tests
on:
  push:
    branches: [test/docx-file-real-output-20261103]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingxifield-docx-files-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docx-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pin pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Pin Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen
        run: pnpm install --frozen-lockfile
      - name: Build production output
        run: pnpm build
      - name: Install Chrome
        run: pnpm exec playwright install --with-deps chrome
      - name: Real DOCX input to saved TXT and negative tests
        run: pnpm exec playwright test -c playwright.final.config.ts --workers=2 tests/final-closure/docx-file-real-output.spec.ts
