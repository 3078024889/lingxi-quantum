name: AI Market PostgreSQL 17 isolated migration validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lingxifield-ai-market/sql/**'
      - 'supabase/migrations/20261102120000_ai_market_vendor_account_claims.sql'
      - 'supabase/migrations/20261102123000_ai_market_vendor_promotion_requests.sql'
      - '.github/workflows/ai-market-postgres-isolated.yml'

permissions:
  contents: read

jobs:
  schema-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-secret
          POSTGRES_DB: ai_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_market_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test-only-secret
      PGDATABASE: ai_market_test
    steps:
      - name: Checkout exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Bootstrap disposable Supabase-compatible roles and auth schema
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $roles$
          BEGIN
            IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF;
          END
          $roles$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;
          GRANT USAGE ON SCHEMA extensions TO anon;
          GRANT EXECUTE ON FUNCTION extensions.hmac(bytea,bytea,text) TO anon;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            email text UNIQUE,
            email_confirmed_at timestamptz
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $auth_uid$ SELECT nullif(current_setting('request.jwt.claim.sub',true),'')::uuid $auth_uid$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          INSERT INTO auth.users(id,email,email_confirmed_at)
          VALUES('11111111-1111-4111-8111-111111111111','business@lingxifield.com',clock_timestamp());
          SQL

      - name: Apply shared-account vendor claim migration to disposable Postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261102120000_ai_market_vendor_account_claims.sql

      - name: Bootstrap main-site order ledger shape for isolated promotion linkage test
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.orders(
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id uuid NOT NULL REFERENCES auth.users(id),
            product_id text NOT NULL,
            amount_rmb numeric(12,2),
            amount_usd numeric(12,2),
            currency text NOT NULL,
            provider text NOT NULL,
            status text NOT NULL
          );
          REVOKE ALL ON public.orders FROM PUBLIC,anon,authenticated;
          GRANT SELECT ON public.orders TO service_role;
          SQL

      - name: Apply vendor promotion application and order-link migration in disposable Postgres
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261102123000_ai_market_vendor_promotion_requests.sql

      - name: Verify RLS claim ownership, limit and no client-side approval
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users(id,email,email_confirmed_at)
          VALUES ('22222222-2222-4222-8222-222222222222','vendor2@lingxifield.com',clock_timestamp());
          DO $verify$
          BEGIN
            IF has_table_privilege('anon','public.ai_market_vendor_claims','SELECT') OR
               has_table_privilege('anon','public.ai_market_vendor_claims','INSERT') OR
               has_table_privilege('authenticated','public.ai_market_vendor_claims','UPDATE') OR
               has_table_privilege('authenticated','public.ai_market_vendor_claims','DELETE')
            THEN RAISE EXCEPTION 'MARKET_CLAIMS_GRANTS_TOO_BROAD'; END IF;
          END
          $verify$;
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','11111111-1111-4111-8111-111111111111',true);
          INSERT INTO public.ai_market_vendor_claims(user_id,product_id,company_name,official_site,evidence_url,work_email)
          VALUES
          ('11111111-1111-4111-8111-111111111111','chatgpt','Test vendor A','https://openai.com','https://openai.com/about','vendor@openai.com'),
          ('11111111-1111-4111-8111-111111111111','claude','Test vendor B','https://claude.ai','https://www.anthropic.com','vendor@anthropic.com'),
          ('11111111-1111-4111-8111-111111111111','runway','Test vendor C','https://runway.com','https://runway.com','vendor@runway.com');
          DO $ceiling$
          BEGIN
            IF (SELECT count(*) FROM public.ai_market_vendor_claims)<>3 THEN
              RAISE EXCEPTION 'OWNER_CANNOT_VIEW_OWN_THREE_CLAIMS';
            END IF;
            BEGIN
              INSERT INTO public.ai_market_vendor_claims(user_id,product_id,company_name,official_site,evidence_url,work_email)
              VALUES ('11111111-1111-4111-8111-111111111111','suno','Test vendor D','https://suno.com','https://suno.com','vendor@suno.com');
              RAISE EXCEPTION 'FOURTH_FREE_CLAIM_ACCEPTED';
            EXCEPTION WHEN SQLSTATE '23514' THEN NULL;
            END;
            BEGIN
              INSERT INTO public.ai_market_vendor_claims(user_id,product_id,company_name,official_site,evidence_url,work_email)
              VALUES ('22222222-2222-4222-8222-222222222222','suno','Spoofed owner','https://suno.com','https://suno.com','vendor@suno.com');
              RAISE EXCEPTION 'CROSS_ACCOUNT_CLAIM_ACCEPTED';
            EXCEPTION WHEN SQLSTATE '42501' THEN NULL;
            END;
          END
          $ceiling$;
          COMMIT;

          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','22222222-2222-4222-8222-222222222222',true);
          DO $isolation$
          BEGIN
            IF EXISTS(SELECT 1 FROM public.ai_market_vendor_claims) THEN
              RAISE EXCEPTION 'VENDOR_CAN_READ_OTHER_ACCOUNT_CLAIMS';
            END IF;
          END
          $isolation$;
          INSERT INTO public.ai_market_vendor_claims(user_id,product_id,company_name,official_site,evidence_url,work_email)
          VALUES ('22222222-2222-4222-8222-222222222222','suno','Separate owner','https://suno.com','https://suno.com','owner@suno.com');
          COMMIT;
          SQL

      - name: Verify reviewer-only audit, conflict and revocation on disposable DB
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL ROLE service_role;
          UPDATE public.ai_market_vendor_claims SET status='approved',
            reviewer_id='11111111-1111-4111-8111-111111111111',
            reviewed_at=clock_timestamp(),review_note='Reviewed enterprise domain and public legal registration.'
            WHERE user_id='11111111-1111-4111-8111-111111111111' AND product_id='chatgpt';
          DO $review$
          DECLARE v_id uuid;
          BEGIN
           SELECT id INTO v_id FROM public.ai_market_vendor_claims
             WHERE product_id='chatgpt' AND status='approved';
           IF v_id IS NULL THEN RAISE EXCEPTION 'APPROVAL_NOT_RECORDED'; END IF;
           IF NOT EXISTS(SELECT 1 FROM public.ai_market_vendor_review_events
             WHERE claim_id=v_id AND from_status='pending_review' AND to_status='approved')
           THEN RAISE EXCEPTION 'ATOMIC_REVIEW_AUDIT_MISSING'; END IF;
           BEGIN
            UPDATE public.ai_market_vendor_claims SET status='revoked',review_note=NULL
              WHERE id=v_id;
            RAISE EXCEPTION 'REVOCATION_WITHOUT_REASON_ALLOWED';
           EXCEPTION WHEN SQLSTATE '23514' THEN NULL; END;
          END
          $review$;
          COMMIT;

          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','22222222-2222-4222-8222-222222222222',true);
          INSERT INTO public.ai_market_vendor_claims(user_id,product_id,company_name,official_site,evidence_url,work_email)
           VALUES('22222222-2222-4222-8222-222222222222','chatgpt','Competing applicant',
             'https://openai.com','https://openai.com/about','company@openai.com');
          COMMIT;
          BEGIN;
          SET LOCAL ROLE service_role;
          DO $exclusive$
          BEGIN
            BEGIN
             UPDATE public.ai_market_vendor_claims SET status='approved',
              reviewer_id='11111111-1111-4111-8111-111111111111',
              reviewed_at=clock_timestamp(),review_note='Verified second applicant company authority manually.'
             WHERE user_id='22222222-2222-4222-8222-222222222222' AND product_id='chatgpt';
             RAISE EXCEPTION 'TWO_APPROVED_OWNERS';
            EXCEPTION WHEN unique_violation THEN NULL; END;
          END
          $exclusive$;
          COMMIT;

          DO $acl$
          BEGIN
           IF has_table_privilege('anon','public.ai_market_vendor_review_events','SELECT')
            OR has_table_privilege('authenticated','public.ai_market_vendor_review_events','SELECT')
            OR has_table_privilege('authenticated','public.ai_market_vendor_claims','UPDATE')
           THEN RAISE EXCEPTION 'REVIEW_AUDIT_LEAKED'; END IF;
          END
          $acl$;
          SQL

      - name: Test vendor promotion amount, ownership, idempotency, and main-site order bridge
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','11111111-1111-4111-8111-111111111111',true);
          INSERT INTO public.ai_market_vendor_promotion_requests
           (user_id,claim_id,product_id,plan_id,currency,provider,idempotency_key)
          SELECT user_id,id,product_id,'sponsored','CNY','alipay','33333333-3333-4333-8333-333333333333'
           FROM public.ai_market_vendor_claims WHERE product_id='chatgpt' AND status='approved';
          DO $verify$
          BEGIN
           IF NOT EXISTS(SELECT 1 FROM public.ai_market_vendor_promotion_requests
             WHERE amount_minor=4900 AND status='requested' AND merchant_order_id IS NULL)
           THEN RAISE EXCEPTION 'IMMUTABLE_SERVER_PRICE_INCORRECT'; END IF;
           IF has_column_privilege('authenticated','public.ai_market_vendor_promotion_requests','amount_minor','INSERT')
            OR has_table_privilege('authenticated','public.ai_market_vendor_promotion_requests','UPDATE')
           THEN RAISE EXCEPTION 'CLIENT_CAN_CHANGE_PRICE_OR_PAYMENT'; END IF;
           BEGIN
            INSERT INTO public.ai_market_vendor_promotion_requests
             (user_id,claim_id,product_id,plan_id,currency,provider,idempotency_key)
             SELECT user_id,id,product_id,'category','CNY','paypal','44444444-4444-4444-8444-444444444444'
              FROM public.ai_market_vendor_claims WHERE product_id='chatgpt' AND status='approved';
            RAISE EXCEPTION 'MISMATCH_PROVIDER_CURRENCY_ACCEPTED';
           EXCEPTION WHEN check_violation THEN NULL; END;
           BEGIN
            INSERT INTO public.ai_market_vendor_promotion_requests
             (user_id,claim_id,product_id,plan_id,currency,provider,idempotency_key)
             SELECT user_id,id,product_id,'category','USD','paypal','55555555-5555-4555-8555-555555555555'
              FROM public.ai_market_vendor_claims WHERE product_id='claude' AND status='pending_review';
            RAISE EXCEPTION 'UNAPPROVED_VENDOR_PROMOTION_ACCEPTED';
           EXCEPTION WHEN check_violation THEN NULL; END;
           BEGIN
            INSERT INTO public.ai_market_vendor_promotion_requests
             (user_id,claim_id,product_id,plan_id,currency,provider,idempotency_key)
             SELECT user_id,id,product_id,'sponsored','CNY','alipay','33333333-3333-4333-8333-333333333333'
              FROM public.ai_market_vendor_claims WHERE product_id='chatgpt' AND status='approved';
            RAISE EXCEPTION 'DUPLICATE_PROMOTION_REQUEST_ACCEPTED';
           EXCEPTION WHEN unique_violation THEN NULL; END;
          END
          $verify$;
          COMMIT;

          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','22222222-2222-4222-8222-222222222222',true);
          DO $isolation$
          BEGIN
           IF EXISTS(SELECT 1 FROM public.ai_market_vendor_promotion_requests)
            THEN RAISE EXCEPTION 'CROSS_ACCOUNT_PROMOTION_LEAK'; END IF;
           BEGIN
            INSERT INTO public.ai_market_vendor_promotion_requests
             (user_id,claim_id,product_id,plan_id,currency,provider,idempotency_key)
             SELECT user_id,id,product_id,'category','USD','paypal','66666666-6666-4666-8666-666666666666'
               FROM public.ai_market_vendor_claims WHERE product_id='suno';
            RAISE EXCEPTION 'OTHER_VENDOR_PENDING_PROMOTION_ACCEPTED';
           EXCEPTION WHEN check_violation THEN NULL; END;
          END
          $isolation$;
          COMMIT;

          INSERT INTO public.orders(id,user_id,product_id,amount_rmb,currency,provider,status)
           VALUES('77777777-7777-4777-8777-777777777777','11111111-1111-4111-8111-111111111111',
            'sasi-balance-49',49,'CNY','alipay','pending'),
           ('88888888-8888-4888-8888-888888888888','11111111-1111-4111-8111-111111111111',
            'ai-market:sponsored',49,'CNY','alipay','pending');
          BEGIN;
          SET LOCAL ROLE service_role;
          DO $bridge$
          DECLARE r_id uuid;
          BEGIN
           SELECT id INTO r_id FROM public.ai_market_vendor_promotion_requests WHERE product_id='chatgpt';
           BEGIN
            UPDATE public.ai_market_vendor_promotion_requests SET status='merchant_linked',
              merchant_order_id='77777777-7777-4777-8777-777777777777',linked_at=clock_timestamp()
             WHERE id=r_id;
            RAISE EXCEPTION 'SASI_TOPUP_ACCEPTED_FOR_MARKET_PROMOTION';
           EXCEPTION WHEN check_violation THEN NULL; END;
           UPDATE public.ai_market_vendor_promotion_requests SET status='merchant_linked',
             merchant_order_id='88888888-8888-4888-8888-888888888888',linked_at=clock_timestamp()
            WHERE id=r_id;
           IF NOT EXISTS(SELECT 1 FROM public.ai_market_vendor_promotion_requests
             WHERE id=r_id AND status='merchant_linked' AND merchant_order_id='88888888-8888-4888-8888-888888888888')
            THEN RAISE EXCEPTION 'VALID_LINK_NOT_APPLIED'; END IF;
           BEGIN
            UPDATE public.ai_market_vendor_promotion_requests SET status='requested',merchant_order_id=NULL,linked_at=NULL WHERE id=r_id;
            RAISE EXCEPTION 'ILLEGAL_PAYMENT_STATE_ROLLBACK_ACCEPTED';
           EXCEPTION WHEN check_violation THEN NULL; END;
          END
          $bridge$;
          COMMIT;
          SQL

      - name: Apply feedback migrations in security-preserving order
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            20261030180000_ai_market_public_feedback.sql \
            20261030195000_ai_market_feedback_moderation.sql \
            20261101_ai_market_feedback_key_provisioning.sql \
            20261101_ai_market_feedback_constant_time_hmac.sql \
            20261030214500_ai_market_auto_publish.sql
          do
            echo "Applying staged migration: $name"
            psql -X -v ON_ERROR_STOP=1 -f "lingxifield-ai-market/sql/$name"
          done

      - name: Verify visitor feedback HMAC provisioning, submission and moderation in isolated PostgreSQL
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF has_function_privilege('anon','public.ai_market_configure_feedback_signing_key(text)','EXECUTE')
              OR has_function_privilege('authenticated','public.ai_market_configure_feedback_signing_key(text)','EXECUTE')
            THEN RAISE EXCEPTION 'PUBLIC_FEEDBACK_KEY_PROVISIONING'; END IF;
            IF NOT has_function_privilege('service_role','public.ai_market_configure_feedback_signing_key(text)','EXECUTE')
            THEN RAISE EXCEPTION 'SERVICE_ROLE_FEEDBACK_KEY_PROVISIONING_MISSING'; END IF;
            IF has_function_privilege('anon','public.ai_market_pending_feedback(integer)','EXECUTE')
              OR has_function_privilege('anon','public.ai_market_moderate_feedback(uuid,text,text)','EXECUTE')
            THEN RAISE EXCEPTION 'ANON_MODERATION_ACCESS'; END IF;
            IF NOT has_function_privilege('authenticated','public.ai_market_pending_feedback(integer)','EXECUTE')
              OR NOT has_function_privilege('authenticated','public.ai_market_moderate_feedback(uuid,text,text)','EXECUTE')
            THEN RAISE EXCEPTION 'AUTHENTICATED_MODERATION_RPC_MISSING'; END IF;
            IF has_table_privilege('anon','private.ai_market_feedback_signing_key','SELECT')
              OR has_table_privilege('authenticated','private.ai_market_feedback_signing_key','SELECT')
            THEN RAISE EXCEPTION 'FEEDBACK_SIGNING_KEY_EXPOSED'; END IF;
            IF has_table_privilege('anon','public.ai_market_visitor_feedback','INSERT')
              OR has_table_privilege('anon','public.ai_market_visitor_feedback','UPDATE')
              OR has_table_privilege('anon','public.ai_market_visitor_feedback','DELETE')
              OR has_table_privilege('authenticated','public.ai_market_visitor_feedback','INSERT')
              OR has_table_privilege('authenticated','public.ai_market_visitor_feedback','UPDATE')
              OR has_table_privilege('authenticated','public.ai_market_visitor_feedback','DELETE')
            THEN RAISE EXCEPTION 'RAW_FEEDBACK_TABLE_WRITE_ACCESS'; END IF;
          END
          $check$;

          BEGIN;
          SELECT set_config('request.jwt.claim.role','service_role',true);
          SET LOCAL ROLE service_role;
          SELECT public.ai_market_configure_feedback_signing_key(repeat('a',64));
          COMMIT;

          BEGIN;
          SET LOCAL ROLE anon;
          DO $submit$
          DECLARE
            v_nonce text:=repeat('c',32);
            v_hash text:=repeat('d',64);
            v_issued bigint:=extract(epoch from clock_timestamp())::bigint;
            v_doc jsonb;
            v_sig text;
            v_result jsonb;
            v_status text;
          BEGIN
            v_doc:=jsonb_build_object(
              'nonce',v_nonce,'issuedAt',v_issued,'visitorHash',v_hash,
              'category','site_experience','productId',null,'locale','en',
              'nickname','CI Star','body','This product experience is clear and useful for my everyday workflow.'
            );
            v_sig:=encode(extensions.hmac(
              convert_to(v_nonce||'.'||v_issued::text||'.'||v_hash,'UTF8'),
              convert_to(repeat('a',64),'UTF8'),'sha256'
            ),'hex');
            v_result:=public.ai_market_submit_visitor_feedback(v_doc,v_sig);
            IF (v_result->>'published')::boolean IS DISTINCT FROM true
            THEN RAISE EXCEPTION 'SAFE_FEEDBACK_NOT_AUTO_PUBLISHED'; END IF;
            SELECT status INTO v_status FROM public.ai_market_visitor_feedback WHERE id=(v_result->>'id')::uuid;
            IF v_status IS DISTINCT FROM 'approved'
            THEN RAISE EXCEPTION 'SAFE_FEEDBACK_STATUS_INVALID'; END IF;
            BEGIN
              PERFORM public.ai_market_submit_visitor_feedback(v_doc,repeat('0',64));
              RAISE EXCEPTION 'INVALID_SIGNATURE_ACCEPTED';
            EXCEPTION WHEN SQLSTATE '42501' THEN NULL;
            END;
          END
          $submit$;
          COMMIT;

          BEGIN;
          SET LOCAL ROLE anon;
          DO $pending$
          DECLARE
            v_nonce text:=repeat('e',32);
            v_hash text:=repeat('f',64);
            v_issued bigint:=extract(epoch from clock_timestamp())::bigint;
            v_doc jsonb;
            v_sig text;
            v_result jsonb;
          BEGIN
            v_doc:=jsonb_build_object(
              'nonce',v_nonce,'issuedAt',v_issued,'visitorHash',v_hash,
              'category','site_experience','productId',null,'locale','en',
              'nickname','CI Star','body','Please contact me on Telegram for further details about this product.'
            );
            v_sig:=encode(extensions.hmac(
              convert_to(v_nonce||'.'||v_issued::text||'.'||v_hash,'UTF8'),
              convert_to(repeat('a',64),'UTF8'),'sha256'
            ),'hex');
            v_result:=public.ai_market_submit_visitor_feedback(v_doc,v_sig);
            IF (v_result->>'published')::boolean IS DISTINCT FROM false
              OR (v_result->>'reviewRequired')::boolean IS DISTINCT FROM true
            THEN RAISE EXCEPTION 'UNSAFE_FEEDBACK_NOT_HELD_FOR_REVIEW'; END IF;
          END
          $pending$;
          COMMIT;

          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','11111111-1111-4111-8111-111111111111',true);
          DO $moderation$
          DECLARE v_pending jsonb; v_feedback_id uuid; v_result jsonb;
          BEGIN
            v_pending:=public.ai_market_pending_feedback(30);
            IF jsonb_array_length(v_pending->'items')<1
            THEN RAISE EXCEPTION 'VERIFIED_MODERATOR_CANNOT_READ_PENDING'; END IF;
            v_feedback_id:=(v_pending->'items'->0->>'id')::uuid;
            IF v_feedback_id IS NULL THEN RAISE EXCEPTION 'PENDING_FEEDBACK_FIXTURE_MISSING'; END IF;
            v_result:=public.ai_market_moderate_feedback(v_feedback_id,'approved','isolated CI review');
            IF v_result->>'status' IS DISTINCT FROM 'approved'
            THEN RAISE EXCEPTION 'VERIFIED_MODERATION_FAILED'; END IF;
          END
          $moderation$;
          COMMIT;
          SQL
