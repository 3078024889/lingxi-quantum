name: AI Market PostgreSQL 17 isolated migration validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/*ai_market*.sql'
      - '.github/workflows/ai-market-postgres-isolated.yml'
permissions:
  contents: read
jobs:
  schema-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-secret
          POSTGRES_DB: ai_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_market_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test-only-secret
      PGDATABASE: ai_market_test
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Bootstrap minimal Supabase roles and auth.users in isolated container only
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF;
          END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            email text UNIQUE,
            email_confirmed_at timestamptz
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $auth_uid$ SELECT nullif(current_setting('request.jwt.claim.sub',true),'')::uuid $auth_uid$;
          SQL
      - name: Apply staged migrations in dependency order
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            20261029_ai_market_candidates.sql
            20261029_ai_market_review_records.sql
            20261029_ai_market_candidate_decisions.sql
            20261029_ai_market_data_center_a.sql
            20261029_ai_market_graph.sql
            20261029_ai_market_metrics_b.sql
            20261029_ai_market_visibility_d.sql
            20261029_ai_market_profiles_e.sql
            20261029_ai_market_vendor_f.sql
            20261029_ai_market_payment_ledger_h.sql
            20261029_ai_market_h_integration_missing_tables.sql
            20261030_ai_market_incremental_sources.sql
            20261030_ai_market_vendor_submission.sql
            20261030_ai_market_vendor_public_intake.sql
            20261030_ai_market_sponsored_disclosure.sql
            20261030180000_ai_market_public_feedback.sql
            20261030195000_ai_market_feedback_moderation.sql
            20261101_ai_market_feedback_key_provisioning.sql
            20261101_ai_market_feedback_constant_time_hmac.sql
          )
          for name in "${migrations[@]}"; do
            echo "Applying $name"
            psql -X -v ON_ERROR_STOP=1 -f "supabase/migrations/$name"
          done
      - name: Verify visitor feedback HMAC provisioning, submission and moderation in isolated PostgreSQL
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF has_function_privilege('anon','public.ai_market_configure_feedback_signing_key(text)','EXECUTE')
              OR has_function_privilege('authenticated','public.ai_market_configure_feedback_signing_key(text)','EXECUTE')
            THEN RAISE EXCEPTION 'PUBLIC_FEEDBACK_KEY_PROVISIONING'; END IF;
            IF NOT has_function_privilege('service_role','public.ai_market_configure_feedback_signing_key(text)','EXECUTE')
            THEN RAISE EXCEPTION 'SERVICE_ROLE_FEEDBACK_KEY_PROVISIONING_MISSING'; END IF;
            IF NOT has_function_privilege('anon','public.ai_market_submit_visitor_feedback(jsonb,text)','EXECUTE')
            THEN RAISE EXCEPTION 'PUBLIC_SIGNED_FEEDBACK_RPC_MISSING'; END IF;
            IF has_function_privilege('anon','public.ai_market_pending_feedback(integer)','EXECUTE')
              OR has_function_privilege('anon','public.ai_market_moderate_feedback(uuid,text,text)','EXECUTE')
            THEN RAISE EXCEPTION 'ANON_MODERATION_ACCESS'; END IF;
            IF has_table_privilege('anon','private.ai_market_feedback_signing_key','SELECT')
              OR has_table_privilege('authenticated','private.ai_market_feedback_signing_key','SELECT')
            THEN RAISE EXCEPTION 'FEEDBACK_SIGNING_KEY_EXPOSED'; END IF;
            IF NOT has_table_privilege('anon','public.ai_market_visitor_feedback','SELECT')
              OR has_table_privilege('anon','public.ai_market_visitor_feedback','INSERT')
              OR has_table_privilege('anon','public.ai_market_visitor_feedback','UPDATE')
              OR has_table_privilege('authenticated','public.ai_market_visitor_feedback','INSERT')
            THEN RAISE EXCEPTION 'FEEDBACK_TABLE_GRANTS_INVALID'; END IF;
          END $check$;
          BEGIN;
          SELECT set_config('request.jwt.claim.role','service_role',true);
          SET LOCAL ROLE service_role;
          SELECT public.ai_market_configure_feedback_signing_key(repeat('a',64));
          COMMIT;
          BEGIN;
          SELECT set_config('request.jwt.claim.role','anon',true);
          SET LOCAL ROLE anon;
          DO $feedback$
          DECLARE
            v_nonce text:=repeat('c',32);
            v_hash text:=repeat('d',64);
            v_issued bigint:=extract(epoch from clock_timestamp())::bigint;
            v_doc jsonb;
            v_signature text;
          BEGIN
            v_doc:=jsonb_build_object(
              'nonce',v_nonce,'issuedAt',v_issued,'visitorHash',v_hash,
              'category','site_experience','productId',null,'locale','en',
              'nickname','CI Star','body','CI test feedback verifies the signed public submission path.'
            );
            v_signature:=encode(extensions.hmac(
              convert_to(v_nonce||'.'||v_issued::text||'.'||v_hash,'UTF8'),
              convert_to(repeat('a',64),'UTF8'),'sha256'
            ),'hex');
            PERFORM public.ai_market_submit_visitor_feedback(v_doc,v_signature);
            BEGIN
              PERFORM public.ai_market_submit_visitor_feedback(v_doc,repeat('0',64));
              RAISE EXCEPTION 'INVALID_FEEDBACK_SIGNATURE_ACCEPTED';
            EXCEPTION WHEN SQLSTATE '42501' THEN NULL;
            END;
            BEGIN
              PERFORM public.ai_market_submit_visitor_feedback(v_doc,v_signature);
              RAISE EXCEPTION 'FEEDBACK_REPLAY_ACCEPTED';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
          END
          $feedback$;
          COMMIT;
          INSERT INTO auth.users(id,email,email_confirmed_at)
          VALUES('11111111-1111-4111-8111-111111111111','business@lingxifield.com',clock_timestamp())
          ON CONFLICT(id) DO NOTHING;
          INSERT INTO private.ai_market_feedback_moderators(user_id,added_reason)
          VALUES('11111111-1111-4111-8111-111111111111','isolated CI moderator test')
          ON CONFLICT(user_id) DO NOTHING;
          BEGIN;
          SELECT set_config('request.jwt.claim.role','authenticated',true);
          SELECT set_config('request.jwt.claim.sub','11111111-1111-4111-8111-111111111111',true);
          SET LOCAL ROLE authenticated;
          DO $moderation$
          DECLARE v_id uuid;v_pending jsonb;
          BEGIN
            v_pending:=public.ai_market_pending_feedback(30);
            v_id:=(v_pending->'items'->0->>'id')::uuid;
            IF v_id IS NULL THEN RAISE EXCEPTION 'FEEDBACK_NOT_STAGED'; END IF;
            PERFORM public.ai_market_moderate_feedback(v_id,'approved','CI verified the source submission and moderation audit path.');
          END
          $moderation$;
          COMMIT;
          BEGIN;
          SELECT set_config('request.jwt.claim.role','anon',true);
          SET LOCAL ROLE anon;
          DO $public_read$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n FROM public.ai_market_visitor_feedback WHERE status='approved';
            IF n<>1 THEN RAISE EXCEPTION 'APPROVED_FEEDBACK_NOT_PUBLIC: %',n; END IF;
          END
          $public_read$;
          COMMIT;
          SQL
      - name: Validate all AI market tables restricted from public roles
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE v RECORD;
          DECLARE n integer:=0;
          BEGIN
            FOR v IN SELECT tablename FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'ai_market_%' AND tablename<>'ai_market_visitor_feedback'
            LOOP
              n:=n+1;
              IF NOT EXISTS(SELECT 1 FROM pg_class c JOIN pg_namespace ns ON ns.oid=c.relnamespace
                WHERE ns.nspname='public' AND c.relname=v.tablename AND c.relrowsecurity) THEN
                  RAISE EXCEPTION 'RLS_OFF: %',v.tablename;
              END IF;
              IF has_table_privilege('anon','public.'||quote_ident(v.tablename),'SELECT') OR
                 has_table_privilege('anon','public.'||quote_ident(v.tablename),'INSERT') OR
                 has_table_privilege('authenticated','public.'||quote_ident(v.tablename),'SELECT') OR
                 has_table_privilege('authenticated','public.'||quote_ident(v.tablename),'UPDATE') THEN
                  RAISE EXCEPTION 'PUBLIC_ACCESS: %',v.tablename;
              END IF;
            END LOOP;
            IF n<17 THEN RAISE EXCEPTION 'INCOMPLETE_AI_MARKET_SCHEMA: %',n; END IF;
            RAISE NOTICE 'AI_MARKET_TABLES=% RLS_AND_GRANTS_PASS',n;
          END $$;
          DO $$
          BEGIN
            IF NOT EXISTS(SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='ai_market_profile_claims' AND column_name='created_at') THEN
              RAISE EXCEPTION 'PROFILE_SCHEMA_DRIFT: created_at missing';
            END IF;
          END $$;
          SQL
      - name: Test private incremental sync, append-only history and anonymous access rejection
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $market$
          BEGIN
            IF has_function_privilege('anon','public.ai_market_apply_source_batch(text,jsonb)','EXECUTE')
              OR has_function_privilege('authenticated','public.ai_market_apply_source_batch(text,jsonb)','EXECUTE')
            THEN RAISE EXCEPTION 'INSECURE_SOURCE_SYNC_RPC_GRANT'; END IF;
            IF NOT has_function_privilege('service_role','public.ai_market_apply_source_batch(text,jsonb)','EXECUTE')
            THEN RAISE EXCEPTION 'SERVICE_ROLE_CANNOT_SYNC'; END IF;
          END $market$;
          BEGIN;
          SELECT set_config('request.jwt.claim.role','service_role',true);
          SET LOCAL ROLE service_role;
          SELECT public.ai_market_apply_source_batch('hf-models','[{"source":"hf-models","upstreamId":"owner/test-model","name":"Test Model","sourceUrl":"https://huggingface.co/owner/test-model","sourceClass":"official_repository_api","reviewStatus":"candidate","contentSha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","facts":{"downloads":25}}]'::jsonb);
          SELECT public.ai_market_apply_source_batch('hf-models','[{"source":"hf-models","upstreamId":"owner/test-model","name":"Test Model","sourceUrl":"https://huggingface.co/owner/test-model","sourceClass":"official_repository_api","reviewStatus":"candidate","contentSha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","facts":{"downloads":25}}]'::jsonb);
          SELECT public.ai_market_apply_source_batch('hf-models','[{"source":"hf-models","upstreamId":"owner/test-model","name":"Test Model","sourceUrl":"https://huggingface.co/owner/test-model","sourceClass":"official_repository_api","reviewStatus":"candidate","contentSha256":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","facts":{"downloads":26}}]'::jsonb);
          COMMIT;
          DO $market$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n FROM public.ai_market_source_items;
            IF n<>1 THEN RAISE EXCEPTION 'NOT_IDEMPOTENT_ITEMS'; END IF;
            SELECT count(*) INTO n FROM public.ai_market_source_history;
            IF n<>2 THEN RAISE EXCEPTION 'MISSING_APPEND_ONLY_HISTORY'; END IF;
            SELECT count(*) INTO n FROM public.ai_market_source_sync_runs;
            IF n<>3 THEN RAISE EXCEPTION 'SYNC_RUNS_NOT_RECORDED'; END IF;
            IF EXISTS(SELECT 1 FROM public.ai_market_source_sync_runs WHERE publication_approved)
            THEN RAISE EXCEPTION 'UNREVIEWED_DATA_PUBLISHED'; END IF;
          END $market$;
          SQL
      - name: Validate public free intake only creates nonpublished pending requests
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $market$
          BEGIN
            IF NOT has_function_privilege('anon','public.ai_market_submit_vendor_submission(jsonb)','EXECUTE')
            THEN RAISE EXCEPTION 'VENDOR_INTAKE_NOT_CALLABLE'; END IF;
            IF has_table_privilege('anon','public.ai_market_vendor_submissions','INSERT') OR
               has_table_privilege('anon','public.ai_market_vendor_submissions','SELECT')
            THEN RAISE EXCEPTION 'DIRECT_PUBLIC_VENDOR_TABLE_ACCESS'; END IF;
          END $market$;
          BEGIN;
          SET LOCAL ROLE anon;
          SELECT public.ai_market_submit_vendor_submission('{"project_id":"example","request_type":"claim","product_name":"Example","official_site":"https://example.com","work_email":"team@example.com","submitter_name":"Team","evidence_url":"https://example.com/about","proposed_data":{"x":"https://x.com/example"}}'::jsonb);
          COMMIT;
          DO $market$
          BEGIN
            IF (SELECT count(*) FROM public.ai_market_vendor_submissions WHERE status='pending_identity_check' AND verified_domain=false)<>1
            THEN RAISE EXCEPTION 'VENDOR_PENDING_STATE_INVALID'; END IF;
          END $market$;
          SQL
      - name: Verify organic ranks cannot read paid placements and public sees no payment receipts
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF has_column_privilege('anon','public.ai_market_sponsored_disclosure','payment_reference','SELECT')
               OR has_column_privilege('anon','public.ai_market_sponsored_disclosure','reviewer','SELECT')
            THEN RAISE EXCEPTION 'SPONSOR_PAYMENT_DATA_LEAK'; END IF;
            IF has_table_privilege('anon','public.ai_market_sponsored_disclosure','INSERT')
               OR has_table_privilege('authenticated','public.ai_market_sponsored_disclosure','UPDATE')
            THEN RAISE EXCEPTION 'PUBLIC_SPONSOR_MANIPULATION'; END IF;
          END $check$;
          BEGIN;
          SET LOCAL ROLE anon;
          SELECT project_id,label,target_url,placement,ends_at FROM public.ai_market_sponsored_disclosure LIMIT 5;
          COMMIT;
          SQL
      - name: Ensure migrations are re-runnable without destructive reset
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_ai_market_candidates.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_ai_market_data_center_a.sql
      - name: Confirm no third-party data published or payment settled
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (SELECT 1 FROM public.ai_market_identity WHERE status='verified') THEN
              RAISE EXCEPTION 'FABRICATED_VERIFICATION';
            END IF;
            IF EXISTS (SELECT 1 FROM public.ai_market_payment_events) THEN
              RAISE EXCEPTION 'UNVERIFIED_PAYMENT_EVENT';
            END IF;
          END $$;
          SQL
