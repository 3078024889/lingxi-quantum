name: LINGXIFIELD PDF Merge Split Strict Range Real E2E
on:
  push:
    branches: [feature/pdf-merge-split-range-e2e-20261104]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingxi-pdf-merge-split-20261104
  cancel-in-progress: true
jobs:
  real-pdf-page-operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pin pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Pin Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Local production build
        run: pnpm build
      - name: Install Chrome
        run: pnpm exec playwright install --with-deps chrome
      - name: Verify PDF merge extract rotate invalid range with real downloads on desktop/mobile
        run: pnpm exec playwright test -c playwright.final.config.ts --workers=2 tests/final-closure/pdf-merge-split-real-export.spec.ts tests/final-closure/pdf-page-manager-real-export.spec.ts
      - name: Browser failure evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pdf-merge-split-real-e2e
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
