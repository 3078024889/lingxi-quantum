name: SASI dual-site exact-SHA source, payments and delivery gate (NO DEPLOY)
on:
  push:
    branches: [release/sasi-dual-candidate-20261108-verified]
  pull_request:
    branches: [release/com-sasi-full-20261108]
    paths:
      - '.github/workflows/sasi-dual-final-code-gate-20261108.yml'
      - '.github/workflows/com-unified-next-isolated-canary-20261108.yml'
      - '.github/workflows/cn-unified-source-only-standalone-20261108.yml'
      - 'lib/fulfill-order.ts'
      - 'tests/sasi-software-verified-fulfillment-20261108.test.mjs'
permissions:
  contents: read
concurrency:
  group: sasi-dual-final-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Contract and finance invariants
        run: |
          node --test tests/sasi-software-verified-fulfillment-20261108.test.mjs
          node --test tests/sasi-software-public-branding-20261108.test.mjs
          node --test tests/public-announcements-deeplink-20261108.test.mjs
          node --test tests/sasi-marketplace-review-security-20261108.test.mjs
          node tests/sasi-marketplace-security-contract.test.mjs
          node tests/toolpass-direct-fulfillment-20261108.test.mjs
          node tests/paypal-merchant-idempotency-20261108.test.mjs
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Verify candidates are not production route mutations
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const com=fs.readFileSync('.github/workflows/com-unified-next-isolated-canary-20261108.yml','utf8');
          const cn=fs.readFileSync('.github/workflows/cn-unified-source-only-standalone-20261108.yml','utf8');
          if(!com.includes('NO ROUTES candidate')||!com.includes('workers_dev!==true')||!com.includes('COM_CANARY_PROPAGATION'))throw Error('COM_CANDIDATE_SAFETY_GATE');
          if(!cn.includes('NO ECS DEPLOY')||!cn.includes('Publish GitHub prerelease'))throw Error('CN_PACKAGE_SAFETY_GATE');
          console.log('SASI_DUAL_CANDIDATE_SOURCE_GATES_PASS',process.env.GITHUB_SHA);
          NODE
