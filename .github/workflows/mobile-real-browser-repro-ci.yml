name: Lingxifield exact mobile browser regressions (NO DEPLOY)
on:
  push:
    branches: [fix/release-real-mobile-browser-20261107]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingxi-mobile-repro
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: {version: 11.28.0, run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version-file: .nvmrc, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bash scripts/ci/ensure-chrome.sh
      - name: Real mobile Chromium document ticket, Cron and PDF overlay gesture
        run: pnpm exec playwright test -c playwright.final.config.ts --project=mobile-chromium --workers=1 tests/final-closure/document-gateway-v32.spec.ts tests/final-closure/qr-cron-output-v86.spec.ts tests/final-closure/pdf-overlay-resize.spec.ts
      - name: Record actual traces when browser assertions fail
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mobile-gesture-and-same-origin-regressions
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
