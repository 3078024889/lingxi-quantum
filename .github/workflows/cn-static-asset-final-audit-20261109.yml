name: CN 455MB static release 56-block edge and bootstrap acceptance (NO DEPLOY)
on:
  push:
    branches: [ops/cn-immutable-static-assets-20261109]
    paths: ['.github/workflows/cn-static-asset-final-audit-20261109.yml']
permissions: {contents: read}
jobs:
  immutable-release-edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check published 56 hashes, source-pinned scripts and all edge assets without modification
        run: |
          set -Eeuo pipefail
          base=https://lingxifield-cn-static-release-5308e015-20261109.3078024889.workers.dev
          curl -4fsS --retry 5 --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/all-micro" "$base/all-micro-parts.sha256"
          printf '%s  %s\n' 4462ae8bb979d5436aa2fd9955815e75d0880d33e37ccab17e1396788359e834 "$RUNNER_TEMP/all-micro" | sha256sum -c -
          curl -4fsS --retry 5 --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/eight" "$base/eight-parts.sha256"
          printf '%s  %s\n' aa852ca0888b5d427557306d109d9136bc9299f501da340d22211110a9177d23 "$RUNNER_TEMP/eight" | sha256sum -c -
          curl -4fsS --retry 5 --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/bootstrap" "$base/cn3193-static-deploy-20261109.sh"
          printf '%s  %s\n' 1850c1c8aadcea7eb0edacf2a0b18f2732eb306899b7e7a901f667feb44ed67d "$RUNNER_TEMP/bootstrap" | sha256sum -c -
          bash -n "$RUNNER_TEMP/bootstrap"
          curl -4fsS --retry 5 --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/deploy" "$base/ecs-cn3193-unified-standalone-stage-20261108.sh"
          printf '%s  %s\n' f19f63ca022f2644de9f74bd0f4bc287f597d8fc243d943a941d0f3e66744e13 "$RUNNER_TEMP/deploy" | sha256sum -c -
          bash -n "$RUNNER_TEMP/deploy"
          curl -4fsS --retry 5 --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/check" "$base/cn-20261108-unified-standalone.sha256"
          printf '%s  %s\n' b779e13ca3ba10eaefb71d05a9d66c6c33c7cf45eae9867ad1c5ea61bafa566f "$RUNNER_TEMP/check" | sha256sum -c -
          python3 - "$RUNNER_TEMP/all-micro" "$base" <<'PY'
          import concurrent.futures, urllib.request, sys, re
          path,base=sys.argv[1:]
          entries=[]
          for line in open(path):
              sha,name=line.rstrip("\n").split("  ")
              if not re.fullmatch(r'cn-20261108-unified-standalone\.tar\.gz\.part-0[0-7]\.block-0[0-6]',name):
                  raise SystemExit("INVALID_ARCHIVE_ASSET_NAME")
              entries.append(name)
          if len(entries)!=56 or len(set(entries))!=56:raise SystemExit("INVALID_STATIC_MANIFEST_COUNT")
          def check(name):
              request=urllib.request.Request(base+"/"+name,method="HEAD")
              with urllib.request.urlopen(request,timeout=18) as res:
                  size=int(res.headers.get("Content-Length","-1"))
                  if res.status!=200 or size<1000000 or size>8388608:
                      raise ValueError("INVALID_STATIC_ASSET_HTTP_OR_SIZE:"+name)
              return name
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as pool:
              list(pool.map(check,entries))
          print("CN_CLOUDFLARE_ALL_56_ASSETS_HTTP_200_AND_SIZE_VALIDATED")
          PY
          echo CN_STATIC_IMMUTABLE_RELEASE_FINAL_EDGE_AUDIT_PASS_NO_PAYMENTS_OR_ROUTES_CHANGED
