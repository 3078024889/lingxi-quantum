name: LINGXIFIELD Native PDF Images Validation
on:
  push:
    branches: [security/pdf-native-crop-guard-20261103]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingxifield-native-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact pinned source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: 'Native PDF image real files: move, delete, replace, shared resources, signature deny'
        run: node --test tests/tool-closure/pdf-native-image.test.mjs
      - name: Types and Next.js production build
        run: pnpm build
