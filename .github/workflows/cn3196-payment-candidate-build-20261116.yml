name: CN3196 payment candidate build and artifact (NO DEPLOY)

on:
  pull_request:
    branches:
      - ci/cn3194-payment-base-20261110
    types: [opened, synchronize, reopened]
    paths:
      - 'app/api/pay/**'
      - 'app/api/tools/pay/**'
      - 'app/api/admin/pay/**'
      - 'app/checkout/**'
      - 'app/checkout-usd/**'
      - 'app/ai-wallet/**'
      - 'components/WalletLivePanel.tsx'
      - 'lib/sasi/payment-gate.ts'
      - 'lib/paypal.ts'
      - 'lib/alipay.ts'
      - 'lib/wechatpay.ts'
      - 'tests/wallet-topup-live-contract-20261111.test.mjs'
      - 'scripts/ops/cn3196-candidate-preflight-20261116.sh'
      - '.github/workflows/cn3196-payment-candidate-build-20261116.yml'

permissions:
  contents: read

concurrency:
  group: cn3196-payment-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      LINGXI_SELFHOST_BUILD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.cn
      NEXT_PUBLIC_TOOL_PASS_ENFORCED: 'true'
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
    steps:
      - name: Checkout exact reviewed PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen dependencies and validate payment contracts
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile
          node --test tests/wallet-topup-live-contract-20261111.test.mjs
          node --test tests/cn3195-payment-readiness-audit-20261116.test.mjs
          node scripts/test-refund-provider-signatures.cjs
          node scripts/audit/v52f-refund-webhook-lifecycle.mjs
          pnpm exec tsc --noEmit
      - name: Build exact standalone CN candidate
        run: |
          set -Eeuo pipefail
          pnpm build
          test -s .next/standalone/server.js
          test -s .next/BUILD_ID
          install -d .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          cp -a public .next/standalone/public
          cp .next/BUILD_ID .next/standalone/.next/BUILD_ID
          printf '%s\\n' "${{ github.event.pull_request.head.sha }}" > .next/standalone/RELEASE_SOURCE_SHA
          echo CN3196_STANDALONE_BUILD_PASS
      - name: Loopback smoke test without payment mutations
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .next/standalone
          HOSTNAME=127.0.0.1 PORT=3319 NODE_ENV=production node server.js > "$RUNNER_TEMP/cn3319.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 60); do
            if curl --noproxy '*' --silent --max-time 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:3319/api/health | grep -qx 200; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = 1 ] || { cat "$RUNNER_TEMP/cn3319.log"; exit 1; }
          for path in / /tools /siai /sasi /ai-wallet /api/pay/providers /api/tools/pass /api/wechat/mini/balance-pay/availability; do
            code="$(curl --noproxy '*' --silent --max-time 25 -o /dev/null -w '%{http_code}' "http://127.0.0.1:3319$path" || true)"
            echo "CN3196_LOCAL_ROUTE:$path:$code"
            [ "$code" = 200 ] || exit 1
          done
          code="$(curl --noproxy '*' --silent --max-time 20 -o /dev/null -w '%{http_code}' http://127.0.0.1:3319/api/admin/pay/readiness || true)"
          [ "$code" = 401 ] || { echo "ADMIN_AUTH_BOUNDARY_FAILED:$code"; exit 1; }
          echo CN3196_LOCAL_ROUTES_AND_AUTH_BOUNDARIES_PASS_NO_PAYMENT
      - name: Package exact standalone artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT="$(printf '%s' "$SOURCE_SHA" | cut -c1-12)"
          DIST="$RUNNER_TEMP/cn3196"
          mkdir -p "$DIST/standalone"
          cp -a .next/standalone/. "$DIST/standalone/"
          ARCHIVE="cn3196-payment-candidate-$SHORT.tar.gz"
          tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner -C "$DIST/standalone" -czf "$DIST/$ARCHIVE" .
          SHA="$(sha256sum "$DIST/$ARCHIVE" | awk '{print $1}')"
          BYTES="$(stat -c '%s' "$DIST/$ARCHIVE")"
          printf '%s  %s\\n' "$SHA" "$ARCHIVE" > "$DIST/$ARCHIVE.sha256"
          cat > "$DIST/manifest.env" <<EOF
          SOURCE_SHA=$SOURCE_SHA
          ARCHIVE=$ARCHIVE
          ARCHIVE_BYTES=$BYTES
          ARCHIVE_SHA256=$SHA
          PRODUCTION_PORT=3195
          CANDIDATE_PORT=3196
          ROLLBACK_BASELINE_PORT=3193
          DEPLOYMENT=NO
          PAYMENT_FLAGS_CHANGED=NO
          ORDER_CREATED=NO
          CHARGE_CREATED=NO
          REFUND_CREATED=NO
          EOF
          tar -tzf "$DIST/$ARCHIVE" > "$DIST/archive.list"
          grep -Fxq './server.js' "$DIST/archive.list"
          grep -Fxq './RELEASE_SOURCE_SHA' "$DIST/archive.list"
          echo "CN3196_SOURCE_SHA=$SOURCE_SHA"
          echo "CN3196_ARCHIVE=$ARCHIVE"
          echo "CN3196_ARCHIVE_BYTES=$BYTES"
          echo "CN3196_ARCHIVE_SHA256=$SHA"
      - name: Upload exact candidate artifact (no release, no deployment)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cn3196-payment-candidate-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/cn3196/*.tar.gz
            ${{ runner.temp }}/cn3196/*.sha256
            ${{ runner.temp }}/cn3196/manifest.env
          retention-days: 14
          if-no-files-found: error
