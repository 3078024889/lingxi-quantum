name: COM merchant secrets and actual executor readiness (NO CHANGES)
on:
  push:
    branches: [audit/com-merchant-credential-presence-20261109]
    paths: ['.github/workflows/com-merchant-credential-presence-20261109.yml']
permissions: {contents: read}
jobs:
  credential-presence:
    environment: cloudflare-production
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
      ALIPAY_APP_ID: ${{ secrets.ALIPAY_APP_ID }}
      ALIPAY_PRIVATE_KEY: ${{ secrets.ALIPAY_PRIVATE_KEY }}
      ALIPAY_PUBLIC_KEY: ${{ secrets.ALIPAY_PUBLIC_KEY }}
      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_MCH_ID: ${{ secrets.WECHAT_MCH_ID }}
      WECHAT_API_V3_KEY: ${{ secrets.WECHAT_API_V3_KEY }}
      WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
      WECHAT_CERT_SERIAL_NO: ${{ secrets.WECHAT_CERT_SERIAL_NO }}
      WECHAT_PLATFORM_PUBLIC_KEY: ${{ secrets.WECHAT_PLATFORM_PUBLIC_KEY }}
      WECHAT_PLATFORM_PUBLIC_KEY_ID: ${{ secrets.WECHAT_PLATFORM_PUBLIC_KEY_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_SASI_ARTIFACTS: ${{ secrets.R2_BUCKET_SASI_ARTIFACTS }}
    steps:
      - name: Inventory names and validity prerequisites only
        run: |
          node --input-type=module <<'NODE'
          const groups={
           paypal:["PAYPAL_CLIENT_ID","PAYPAL_CLIENT_SECRET","PAYPAL_WEBHOOK_ID"],
           alipay:["ALIPAY_APP_ID","ALIPAY_PRIVATE_KEY","ALIPAY_PUBLIC_KEY"],
           wechat:["WECHAT_APP_ID","WECHAT_MCH_ID","WECHAT_API_V3_KEY","WECHAT_PRIVATE_KEY","WECHAT_CERT_SERIAL_NO","WECHAT_PLATFORM_PUBLIC_KEY","WECHAT_PLATFORM_PUBLIC_KEY_ID"],
           privateR2:["R2_ENDPOINT","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY","R2_BUCKET_SASI_ARTIFACTS"],
           admin:["SUPABASE_SECRET_KEY","SUPABASE_SERVICE_ROLE_KEY"]
          };
          const present=k=>typeof process.env[k]==="string"&&process.env[k].trim().length>0;
          for(const [group,keys] of Object.entries(groups)){
           const ok=group==="admin"?keys.some(present):keys.every(present);
           console.log("GH_COM_SECRET_GROUP_"+group.toUpperCase()+"="+ok);
          }
          const account=process.env.CF_ACCOUNT,token=process.env.CF_TOKEN;
          if(!account||!token)throw Error("CLOUDFLARE_AUDIT_NOT_AUTHORIZED");
          for(const name of ["lingxifield-com-unified-20261108","lingxifield-com-celestial-20261109","lingxifield-com-static-gateway-canary-20261107","lingxifield-com-next-20261108","lingxifield-com-full-canary-20261107"]){
           const url="https://api.cloudflare.com/client/v4/accounts/"+encodeURIComponent(account)+"/workers/scripts/"+name+"/settings";
           const r=await fetch(url,{headers:{authorization:"Bearer "+token},signal:AbortSignal.timeout(20000)});
           const j=await r.json().catch(()=>null);
           if(r.status!==200||j?.success!==true)throw Error("CF_READ_ONLY_HTTP_"+r.status);
           const bindings=j.result?.bindings||[],found=new Set(bindings.map(x=>x.name));
           const ready=Object.fromEntries(Object.entries(groups).map(([group,keys])=>[group,group==="admin"?keys.some(x=>found.has(x)):keys.every(x=>found.has(x))]));
           const flags=Object.fromEntries(["PAYPAL_ENABLED","ALIPAY_ENABLED","WECHAT_ENABLED","TOOL_PASS_COMMERCE_READY","SASI_MARKETPLACE_COMMERCE_READY"].map(flag=>[flag,bindings.some(x=>x.name===flag&&x.text==="true")]));
           const services=bindings.filter(x=>x.type==="service").map(x=>x.service||"none");
           const bindingValue=(...names)=>{for(const n of names){const b=bindings.find(x=>x.name===n);if(b&&typeof b.text==="string"&&b.text.trim())return b.text.trim();}return "";};
           const sbUrl=bindingValue("SUPABASE_URL","NEXT_PUBLIC_SUPABASE_URL");
           const sbKey=bindingValue("SUPABASE_ANON_KEY","SUPABASE_PUBLISHABLE_KEY","NEXT_PUBLIC_SUPABASE_ANON_KEY");
           let publicSupabaseValid=false,publicSupabaseKeyKind="missing",publicSupabaseProjectMatch=false;
           try{
             const u=new URL(sbUrl);
             if(sbKey.startsWith("sb_publishable_")){
               publicSupabaseKeyKind="publishable";
               publicSupabaseValid=u.protocol==="https:"&&/^sb_publishable_[A-Za-z0-9_-]{12,}$/.test(sbKey);
             }else{
               const p=sbKey.split(".");
               if(p.length===3){
                 const payload=JSON.parse(Buffer.from(p[1],"base64url").toString("utf8"));
                 publicSupabaseKeyKind="legacy-jwt";
                 publicSupabaseProjectMatch=payload.ref===u.hostname.split(".")[0];
                 publicSupabaseValid=u.protocol==="https:"&&payload.role==="anon"&&
                   (typeof payload.exp!=="number"||payload.exp*1000>Date.now())&&publicSupabaseProjectMatch;
               }else publicSupabaseKeyKind="invalid";
             }
           }catch{publicSupabaseKeyKind=sbKey?"invalid":"missing";}
           const compatibilityDate=j.result?.compatibility_date||null;
           const compatibilityFlags=j.result?.compatibility_flags||[];
           console.log("CF_COM_WORKER_READONLY "+JSON.stringify({name,groups:ready,flags,services,
             publicSupabase:{urlPresent:!!sbUrl,keyPresent:!!sbKey,keyKind:publicSupabaseKeyKind,valid:publicSupabaseValid,projectMatch:publicSupabaseProjectMatch},
             compatibility:{date:compatibilityDate,nodejsCompat:compatibilityFlags.includes("nodejs_compat"),
               explicitProcessEnv:compatibilityFlags.includes("nodejs_compat_populate_process_env")}}));
          }
          console.log("COM_CREDENTIAL_PRESENCE_COMPLETE_NO_KEYS_READ_OR_LOGGED");
          NODE