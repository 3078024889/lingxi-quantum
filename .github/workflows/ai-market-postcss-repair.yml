name: AI Market one-time PostCSS security repair
on:
  push:
    branches:
      - feature/ai-si-detail-decisions-20261030
    paths:
      - .github/workflows/ai-market-postcss-repair.yml
permissions:
  contents: write
jobs:
  patch-lock:
    if: github.repository == '3078024889/lingxi-quantum' && github.ref == 'refs/heads/feature/ai-si-detail-decisions-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin safe PostCSS across direct and transitive dependency tree
        working-directory: lingxifield-ai-market
        run: |
          npm pkg set devDependencies.postcss=8.5.32
          npm pkg set overrides.postcss=8.5.32
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls postcss
      - name: Reject unresolved high or critical advisories
        working-directory: lingxifield-ai-market
        run: npm audit --omit=dev --audit-level=high
      - name: Commit reviewed dependency files on the isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          git add lingxifield-ai-market/package.json lingxifield-ai-market/package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes'
            exit 0
          fi
          git diff --cached --check
          git -c user.name='lingxifield-security-bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(ai-market): pin patched PostCSS and regenerate lockfile'
          git push origin HEAD:feature/ai-si-detail-decisions-20261030
