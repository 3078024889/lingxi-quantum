name: COM static public gateway exact-route promotion with automatic rollback
on:
  push:
    branches: [infra/com-cloudflare-readiness-20261106]
    paths: ['.github/workflows/com-static-gateway-public-promote-20261108.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingxifield-com-exact-public-route-promotion-20261108
  cancel-in-progress: false
jobs:
  promote-public-static:
    if: startsWith(github.event.head_commit.message, 'release(com-public):')
    environment: cloudflare-com-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify no-network exact-route rollback unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/cloudflare/com-static-gateway-promote-20261107.py
          python3 tests/ops/com-static-gateway-promote-test.py
      - name: Switch only existing two .com routes after full 124-asset canary preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error::CLOUDFLARE_TOKEN_NOT_CONFIGURED"; exit 1; }
          [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[a-f0-9]{32}$ ]] || { echo "::error::CF_ACCOUNT_INVALID"; exit 1; }
          python3 scripts/cloudflare/com-static-gateway-promote-20261107.py --promote-public-only
      - name: Public only release label (not a payment, account or SASI acceptance)
        if: success()
        run: |
          echo 'COM_PUBLIC_124_TOOLS_STATIC_GATEWAY_PRODUCTION_RELEASE_SUCCESS'
          echo 'COM_LEGACY_DYNAMIC_BACKEND_UNCHANGED'
          echo 'COM_PAYMENTS_AND_SASI_BACKEND_REQUIRE_SEPARATE_ACCEPTANCE'
