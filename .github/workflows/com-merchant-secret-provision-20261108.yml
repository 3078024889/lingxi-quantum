name: COM encrypted merchant and private R2 secret provisioning (EXPLICIT MANUAL)
on:
  push:
    branches: [fix/com-payment-runtime-readiness-20261108]
    paths:
      - '.github/workflows/com-merchant-secret-provision-20261108.yml'
      - 'scripts/cloudflare/com-provision-merchant-secrets-20261108.mjs'
  workflow_dispatch:
    inputs:
      group:
        type: choice
        description: "Which trusted GitHub environment secrets to install"
        options: [all, paypal, alipay, wechat, r2, supabase]
        default: all
        required: true
      mode:
        type: choice
        description: "Audit is read only; provision changes encrypted Worker secret bindings ONLY"
        options: [audit, provision]
        default: audit
        required: true
permissions: {contents: read}
concurrency:
  group: com-merchant-secret-bounded-change
  cancel-in-progress: false
jobs:
  safe-secret-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      COM_PROVISION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'audit' }}
      COM_PROVISION_GROUP: ${{ github.event_name == 'workflow_dispatch' && inputs.group || 'all' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_SASI_ARTIFACTS: ${{ secrets.R2_BUCKET_SASI_ARTIFACTS }}
      ALIPAY_APP_ID: ${{ secrets.ALIPAY_APP_ID }}
      ALIPAY_PRIVATE_KEY: ${{ secrets.ALIPAY_PRIVATE_KEY }}
      ALIPAY_PUBLIC_KEY: ${{ secrets.ALIPAY_PUBLIC_KEY }}
      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_MCH_ID: ${{ secrets.WECHAT_MCH_ID }}
      WECHAT_API_V3_KEY: ${{ secrets.WECHAT_API_V3_KEY }}
      WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
      WECHAT_CERT_SERIAL_NO: ${{ secrets.WECHAT_CERT_SERIAL_NO }}
      WECHAT_PLATFORM_PUBLIC_KEY: ${{ secrets.WECHAT_PLATFORM_PUBLIC_KEY }}
      WECHAT_PLATFORM_PUBLIC_KEY_ID: ${{ secrets.WECHAT_PLATFORM_PUBLIC_KEY_ID }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Validate script syntax and verify exact worker guard
        run: |
          set -Eeuo pipefail
          node --check scripts/cloudflare/com-provision-merchant-secrets-20261108.mjs
          node --test tests/com-merchant-secret-provision-contract-20261108.test.mjs
      - name: Read or explicitly provision encrypted secrets, without any flag or route changes
        run: node scripts/cloudflare/com-provision-merchant-secrets-20261108.mjs
