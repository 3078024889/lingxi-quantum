name: LINGXIFIELD PDF Real Mobile Touch Regression
on:
  push:
    branches: [test/pdf-overlay-mobile-gesture-fix-20261103]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingxifield-pdf-touch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile-and-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Use pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Build actual Next.js output
        run: pnpm build
      - name: Install Chrome
        run: pnpm exec playwright install --with-deps chrome
      - name: Verify real mouse and touch resize and actual rotation
        run: pnpm exec playwright test -c playwright.final.config.ts --workers=1 tests/final-closure/pdf-overlay-resize.spec.ts
      - name: Browser trace on regression
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: lingxifield-pdf-touch-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
