name: Homepage vertical reference build and browser acceptance (NO DEPLOY)

on:
  pull_request:
    branches:
      - fix/approved-three-pages-com-20261114
    paths:
      - 'app/page.tsx'
      - 'app/[locale]/page.tsx'
      - 'app/home-reference-20261114.css'
      - 'app/approved-pages-20261114.css'
      - 'components/HomeProblemHub.tsx'
      - 'components/HomeGlobalGrowth.tsx'
      - 'components/HomeSeoAnswers.tsx'
      - 'components/Nav.tsx'
      - 'components/Footer.tsx'
      - 'public/images/global-scene-20261114.webp'
      - 'tests/home-reference-layout-20261114.test.mjs'
      - 'tests/final-closure/homepage-vertical-shell-20261114.spec.ts'
      - '.github/workflows/homepage-vertical-reference-20261114.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-vertical-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Homepage content, SEO and navigation contracts
        run: node --test tests/home-reference-layout-20261114.test.mjs tests/seo-fullsite-coverage.test.mjs
      - name: Production build
        run: pnpm build
      - name: Install Chrome
        run: pnpm exec playwright install --with-deps chrome
      - name: Desktop and mobile homepage reference acceptance
        run: pnpm exec playwright test -c playwright.final.config.ts tests/final-closure/homepage-vertical-shell-20261114.spec.ts --workers=1
