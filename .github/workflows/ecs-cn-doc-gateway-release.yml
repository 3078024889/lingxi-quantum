name: CN signed document gateway standalone candidate (no deployment)
on:
  push:
    branches: [feature/cn-doc-gateway-release-20261106]
permissions:
  contents: write
concurrency:
  group: cn-gateway-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Exact pinned release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verify bounded signed gateway adapter and legacy permissions
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test scripts/ops/test-cn-local-signed-gateway.mjs
          node --check scripts/ops/ecs-cn-real-document-gateway-3189.mjs
          echo CN_GATEWAY_LOOPBACK_HMAC_UNIT_PASS
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check all TypeScript
        run: pnpm exec tsc --noEmit --pretty false
      - name: Build CN self-host standalone
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          LINGXI_SELFHOST_BUILD: '1'
          NEXT_PUBLIC_SITE_URL: https://lingxifield.cn
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
        run: pnpm build
      - name: Smoke-test 3187 sandbox and auth boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s .next/standalone/server.js
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          cp -a public .next/standalone/public
          (cd .next/standalone && HOSTNAME=127.0.0.1 PORT=3187 NODE_ENV=production node server.js) >/tmp/cn-doc-gateway-candidate.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 40); do
            if curl --fail --silent --max-time 4 http://127.0.0.1:3187/api/health | grep -q '"ok":true'; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then tail -60 /tmp/cn-doc-gateway-candidate.log; exit 1; fi
          for route in / /tools /siai; do
            test "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "http://127.0.0.1:3187$route")" = 200
          done
          test "$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' http://127.0.0.1:3187/api/tools/jobs)" = 401
          echo CN_AUTH_TOOLS_RANKING_SANDBOX_PASS
      - name: Package unmodified runtime and release candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          sha="${GITHUB_SHA}"
          test "$sha" = "$(git rev-parse HEAD)"
          tar -C .next/standalone -czf cn-ecs-document-gateway.tar.gz .
          sha256sum cn-ecs-document-gateway.tar.gz > cn-ecs-document-gateway.sha256
          test -s cn-ecs-document-gateway.tar.gz
          tag="ecs-cn-doc-gateway-20261106-${sha:0:8}"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo CN_DOC_GATEWAY_RELEASE_ALREADY_EXISTS
            exit 1
          fi
          gh release create "$tag" cn-ecs-document-gateway.tar.gz cn-ecs-document-gateway.sha256 \
            --repo "$GH_REPO" --target "$sha" --prerelease \
            --title "CN independent 3189 signed document gateway candidate ${sha:0:8}" \
            --notes "Standalone Linux build from exact pinned CN branch SHA ${sha}. Loopback HMAC/403/503 cases and TypeScript/build/sandbox checks passed. Not deployed. Must revalidate 3189 real conversion and never switch public 3188 until R2, SASI, payment, mobile and rollback gates are accepted."
          echo "CN_STANDALONE_RELEASE_PUBLISHED_STAGE_ONLY_TAG=$tag"
