name: COM OpenNext asset-first feasibility audit (NO DEPLOY)
on:
  push:
    branches: [opt/com-free-static-assets-audit-20261107]
    paths:
      - '.github/workflows/com-prerender-assets-readonly-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.com
      NEXT_PUBLIC_SUPABASE_URL: https://sxsgdpqojepgbbrxrzlq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: {version: 11.28.0, run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version-file: .nvmrc, cache: pnpm}
      - name: Produce exact optimized OpenNext assets with no remote upload
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '33d3cbd1c7cdbb859f103292ee99c7f1ac47a564'
          pnpm install --frozen-lockfile
          pnpm add -D @opennextjs/cloudflare@1.20.16 wrangler@4.158.0 --save-exact
          pnpm exec opennextjs-cloudflare build
      - name: Inspect exact public route HTML and OpenNext asset mapping
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'JS'
          import {readdirSync,existsSync,statSync,readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const m=JSON.parse(readFileSync('.next/prerender-manifest.json','utf8'));
          for(const route of ['/','/siai','/tools','/api/public/siai-widget']) {
            const x=m.routes?.[route];
            console.log('PRERENDER_ROUTE',route,Boolean(x),x?JSON.stringify({srcRoute:x.srcRoute,initialRevalidateSeconds:x.initialRevalidateSeconds}):'MISSING');
          }
          function walk(dir, max=130, depth=0, out=[]) {
             if(!existsSync(dir)||out.length>=max||depth>7)return out;
             for(const ent of readdirSync(dir,{withFileTypes:true})) {
               if(out.length>=max)break;
               const p=join(dir,ent.name);
               if(ent.isDirectory())walk(p,max,depth+1,out);
               else if(/\.html$|\.rsc$|\.json$/.test(ent.name)&&(/siai|tools|index|page|route|\.next\/server\/app/.test(p))) out.push({path:p.replace(/^\.\//,''),bytes:statSync(p).size});
             }
             return out;
          }
          for(const dir of ['.next/server/app','.open-next/assets','.open-next/cache','.open-next/server-functions']){
             const a=walk(dir,120);
             console.log('ASSET_PATH_INSPECTION_DIR',dir,'TOTAL_MATCHED',a.length);
             for(const f of a.slice(0,65))console.log('ASSET_PATH',f.path,f.bytes);
          }
          console.log('COM_ASSET_FIRST_FEASIBILITY_SOURCE_AUDIT_COMPLETE_NO_DEPLOY');
          JS
