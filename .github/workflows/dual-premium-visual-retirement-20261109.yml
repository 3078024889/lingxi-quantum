name: LINGXIFIELD new wallet account tools and legacy retirement (NO PROD)
on:
  push:
    branches: [feat/dual-visual-wallet-account-tools-20261109]
  pull_request:
    branches: [release/com-sasi-full-20261108]
    paths:
      - 'components/AccountCenterV26.tsx'
      - 'components/WalletLivePanel.tsx'
      - 'components/tools/ToolsHubV11.tsx'
      - 'app/ai-wallet/page.tsx'
      - 'app/account/page.tsx'
      - 'app/lingxifield-premium-20261109.css'
      - 'app/layout.tsx'
      - 'tests/dual-premium-visual-no-legacy-20261109.test.mjs'
      - 'tests/final-closure/dual-premium-new-visual.spec.ts'
      - 'tests/final-closure/dual-home-market-release-20261113.spec.ts'
      - 'components/tools/PasswordGeneratorWorkbench.tsx'
      - 'tests/com-static-balance-deferred-contract-20261109.test.mjs'
      - 'tests/legacy-sasi-retirement.test.mjs'
      - 'docs/operations/legacy-sasi-retirement-20261108.json'
      - '.github/workflows/dual-premium-visual-retirement-20261109.yml'
permissions: {contents: read}
concurrency:
  group: dual-new-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-current-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      LINGXI_SELFHOST_BUILD: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.com
      NEXT_PUBLIC_SUPABASE_URL: https://sxsgdpqojepgbbrxrzlq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.28.0,run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc,cache: pnpm}
      - name: Inventory old creation UI imports before deleting retired source
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const list=['SasiAutonomyEntrances','SasiByokImageStudio','SasiByokTextWorkbench','SasiComposerCore','SasiModeHost','SasiMultiEpisodeWorkspace','SasiNativeCreatePanel','SasiOneSurface','SasiProjectDNAEditor','SasiScriptPreview','SasiSeriesStudio','SasiUnifiedConversationProvider','SasiVariantWorkbench'];
          const files=[];
          function walk(p){for(const dirent of fs.readdirSync(p,{withFileTypes:true})){
            const f=path.join(p,dirent.name);
            if(dirent.isDirectory())walk(f);else if(/\.(tsx?|jsx?|mjs|cjs)$/.test(f))files.push(f.replaceAll('\\','/'));
          }}
          for(const dir of ['app','components','lib'])walk(dir);
          for(const name of list){
            const owners=files.filter(f=>f!=='components/'+name+'.tsx'&&new RegExp('\\b'+name+'\\b').test(fs.readFileSync(f,'utf8')));
            console.log('LEGACY_MODULE_IMPORT_REF '+name+' count='+owners.length+' files='+owners.slice(0,14).join(','));
          }
          NODE
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: New design, legacy decommission and commercial safety contract
        run: |
          node --test tests/dual-premium-visual-no-legacy-20261109.test.mjs
          node --test tests/legacy-sasi-retirement.test.mjs
          node --test tests/com-static-balance-deferred-contract-20261109.test.mjs
          node --test tests/sasi-com-closure-20261108.test.mjs
          node --test tests/sasi-software-public-branding-20261108.test.mjs
          node --test tests/com-wallet-static-session-contract-20261108.test.mjs
          node --test tests/com-public-market-edge.test.mjs
          node tests/sasi-marketplace-security-contract.test.mjs
      - name: TypeScript before production build
        run: pnpm exec tsc --noEmit
      - name: Full standalone build without changing production routes
        run: |
          pnpm build
          test -s .next/standalone/server.js
          echo LINGXIFIELD_NEW_VISUAL_BUILD_PASS_LEGACY_NOT_PROMOTED
      - name: Install real Chrome for mobile and desktop visual smoke
        run: pnpm exec playwright install --with-deps chrome
      - name: Run current premium visual smoke in real Chrome
        run: pnpm exec playwright test -c playwright.final.config.ts --project=desktop-chromium --project=mobile-chromium --workers=2 tests/final-closure/dual-premium-new-visual.spec.ts tests/final-closure/dual-home-market-release-20261113.spec.ts
      - name: Preserve premium visual screenshots if tests fail
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: lingxi-premium-visual-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
