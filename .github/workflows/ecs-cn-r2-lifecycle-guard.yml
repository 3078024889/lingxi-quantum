name: CN R2 isolated lifecycle probe static validation (no live object)
on:
  push:
    branches: [feature/cn-r2-transactional-probe-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Prove no live call on default invocation
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check scripts/ops/ecs-cn-r2-transactional-probe.mjs
          output="$(node scripts/ops/ecs-cn-r2-transactional-probe.mjs || true)"
          test "$output" = R2_LIFECYCLE_REQUIRES_EXPLICIT_ACK
          grep -q 'family:4' scripts/ops/ecs-cn-r2-transactional-probe.mjs
          grep -q 'timingSafeEqual' scripts/ops/ecs-cn-r2-transactional-probe.mjs
          grep -q 'CN_STAGE_ONLY_PROJECT_GUARD_FAILED' scripts/ops/ecs-cn-r2-transactional-probe.mjs
          grep -q 'R2_PROBE_LIFECYCLE_PASS' scripts/ops/ecs-cn-r2-transactional-probe.mjs
          echo CN_R2_LIFECYCLE_OFFLINE_GUARD_PASS
