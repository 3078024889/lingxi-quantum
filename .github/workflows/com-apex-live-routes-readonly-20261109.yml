name: COM exact apex and www pre-cutover route inventory (READ ONLY)
on:
  push:
    branches: [ops/com-cutover-exact-routes-audit-20261109]
    paths: ['.github/workflows/com-apex-live-routes-readonly-20261109.yml']
permissions: {contents: read}
jobs:
  inventory:
    runs-on: ubuntu-24.04
    environment: cloudflare-production
    timeout-minutes: 6
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Read only Cloudflare route inventory, never mutate routes or secrets
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CF_TOKEN,account=process.env.CF_ACCOUNT;
          if(!token||!account)throw Error("CLOUDFLARE_AUDIT_CREDENTIALS_MISSING");
          const api="https://api.cloudflare.com/client/v4";
          const read=async path=>{
            const res=await fetch(api+path,{headers:{authorization:"Bearer "+token},signal:AbortSignal.timeout(20000)});
            const json=await res.json().catch(()=>null);
            if(!res.ok||!json?.success)throw Error("CLOUDFLARE_READ_ONLY_HTTP_"+res.status);
            return json.result;
          };
          const zones=await read("/zones?name=lingxifield.com");
          const z=zones.filter(x=>x.name==="lingxifield.com"&&x.status==="active");
          if(z.length!==1)throw Error("CN_COM_ZONE_NOT_UNAMBIGUOUS");
          const routes=await read("/zones/"+z[0].id+"/workers/routes");
          const expectations={
            "lingxifield.com/*":"lingxifield-com-next-20261108",
            "www.lingxifield.com/*":"lingxifield-com-static-gateway-canary-20261107",
            "lingxifield.com/api/account/money-admin*":"lingxifield-com-admin-facade",
            "lingxifield.com/api/tools/pass*":"lingxifield-com-admin-facade",
            "lingxifield.com/api/site-announcements*":"lingxifield-com-public-announcements-20261108"
          };
          let safe=true;
          for(const [pattern,expected] of Object.entries(expectations)){
            const hit=routes.filter(x=>x.pattern===pattern);
            const actual=hit.length===1?hit[0].script:"MISSING_OR_DUPLICATE";
            const match=actual===expected;
            console.log("COM_ROUTE_READONLY pattern="+pattern+" actual="+actual+" expected="+expected+" match="+match);
            if(!match)safe=false;
          }
          if(!safe)throw Error("COM_PRODUCTION_ROUTE_INVENTORY_NOT_READY_FOR_PINNED_CUTOVER");
          console.log("COM_APEX_ROUTE_READONLY_PREFLIGHT_PASS_NO_MUTATIONS");
          JS
