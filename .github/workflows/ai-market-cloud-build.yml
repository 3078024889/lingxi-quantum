name: AI Market isolated cloud build
on:
  workflow_dispatch:
  push:
    branches: ['codex/ai-market-v29-integration-20261029']
    paths: ['lingxifield-ai-market/**', '.github/workflows/ai-market-cloud-build.yml']
  pull_request:
    paths: ['lingxifield-ai-market/**', '.github/workflows/ai-market-cloud-build.yml']
permissions:
  contents: read
concurrency:
  group: ai-market-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lingxifield-ai-market
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lingxifield-ai-market/package-lock.json
      - run: npm ci
      - run: npm run gate
      - run: node scripts/benchmark-search.mjs > search-capacity.json
      - name: Enforce bounded 100k-index capacity budget (not HTTP load)
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("search-capacity.json","utf8"));
            if(r.fixture!=="synthetic-only"||r.rows!==100000)process.exit(2);
            console.log(JSON.stringify({rssMiB:r.rssMiB,p95Ms:r.p95Ms,buildMs:r.buildMs}));
            if(r.rssMiB>450||r.p95Ms>450||r.buildMs>30000)process.exit(3);
          '
      - name: Verify nine real SSR language routes and product APIs
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3302 > /tmp/ai-market-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/market-local-http-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ai-market-build-${{ github.sha }}
          path: lingxifield-ai-market/search-capacity.json
          retention-days: 7
