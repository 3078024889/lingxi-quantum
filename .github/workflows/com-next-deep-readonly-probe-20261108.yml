name: COM next Worker deep public, auth and R2 read-only independent smoke
on:
  push:
    branches: [ui/sasi-hyperdimensional-marketplace-20261108]
    paths: ['.github/workflows/com-next-deep-readonly-probe-20261108.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Cover all public, protected and range endpoints independently without write
        shell: bash
        run: |
          set -Eeuo pipefail
          base='https://lingxifield-com-next-20261108.3078024889.workers.dev'
          failures=0
          for route in / /siai /tools /tools/pass /sasi /sasi/marketplace /announcements /en/siai /ja/siai /ko/siai /fr/siai /de/siai /es/siai /pt/siai /ar/siai /api/sasi/software/catalog;do
            headers="$(mktemp)"
            code="$(curl -4sS --connect-timeout 9 --max-time 30 -D "$headers" -o /dev/null -w '%{http_code}' "$base$route" || true)"
            marker="$(grep -i '^x-lingxi-render-mode:' "$headers" || true)"
            echo "NEXT_PUBLIC route=$route http=$code static=$marker"
            if [[ "$code" != 200 || "$marker" != *static-edge-verified* ]];then failures=$((failures+1));fi
            rm -f "$headers"
          done
          for route in /api/health /api/pay/providers /api/sasi/marketplace/listings;do
            code="$(curl -4sS --connect-timeout 9 --max-time 30 -o /dev/null -w '%{http_code}' "$base$route" || true)"
            echo "NEXT_API route=$route http=$code"
            [[ "$code" == 200 ]] || failures=$((failures+1))
          done
          for route in /api/sasi/marketplace/seller /api/sasi/marketplace/my-orders /api/sasi/account;do
            code="$(curl -4sS --connect-timeout 9 --max-time 30 -o /dev/null -w '%{http_code}' "$base$route" || true)"
            echo "NEXT_PRIVATE route=$route http=$code"
            [[ "$code" == 401 ]] || failures=$((failures+1))
          done
          for route in /media/ffmpeg-0.12.10/ffmpeg-core.wasm /models/Xenova/clip-vit-base-patch32/onnx/text_model_quantized.onnx;do
            headers="$(mktemp)"
            code="$(curl -4sS --connect-timeout 9 --max-time 30 -H 'Range: bytes=0-1023' -D "$headers" -o /dev/null -w '%{http_code}' "$base$route" || true)"
            range="$(grep -i '^content-range:' "$headers" || true)"
            echo "NEXT_R2 route=$route http=$code range=$range"
            [[ "$code" == 206 && "$range" == *'bytes 0-1023/'* ]] || failures=$((failures+1))
            rm -f "$headers"
          done
          echo "COM_NEXT_READ_ONLY_TOTAL_FAILURES=$failures"
          test "$failures" -eq 0
