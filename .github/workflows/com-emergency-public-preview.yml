name: com emergency public-only Worker build (no deploy)

on:
  push:
    branches:
      - infra/com-cloudflare-readiness-20261106
    paths:
      - 'scripts/cloudflare/stage-emergency-public.mjs'
      - 'tests/cloudflare/stage-emergency-public.test.mjs'
      - 'scripts/cloudflare/smoke-emergency-local.mjs'
      - 'tests/cloudflare/smoke-emergency-local.test.mjs'
      - '.github/workflows/com-emergency-public-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: com-emergency-public-preview
  cancel-in-progress: true

jobs:
  build:
    name: public-preview-no-backend-no-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout private source, no token persisted
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen dependency verification
        run: pnpm install --frozen-lockfile
      - name: Verify staging fail-closed tests
        run: |
          node --test tests/cloudflare/stage-emergency-public.test.mjs tests/cloudflare/stage-large-assets.test.mjs tests/cloudflare/smoke-emergency-local.test.mjs
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${VERCEL_TOKEN:-}"
      - name: Prepare media and isolate oversized static assets in runner
        env:
          CI: "true"
        run: |
          node scripts/prepare-media-runtime.cjs
          node scripts/cloudflare/audit-large-assets.mjs --fail-unaccounted
          node scripts/cloudflare/stage-large-assets.mjs --ci-stage --public public --stage "$RUNNER_TEMP/com-preview-media-backup" --cdn https://assets.lingxifield.com --json "$RUNNER_TEMP/com-preview-media.json"
      - name: Isolate all expensive/personal/payment APIs in runner only
        env:
          CI: "true"
        run: |
          node scripts/cloudflare/stage-emergency-public.mjs --ci-stage --root . --stage "$RUNNER_TEMP/com-preview-api-backup" --json "$RUNNER_TEMP/com-preview-api.json"
          node --input-type=module - "$RUNNER_TEMP/com-preview-api.json" <<'NODE'
          import {readFileSync} from "node:fs";
          const x=JSON.parse(readFileSync(process.argv[2],"utf8"));
          if(x.apiRoutes<200||x.disabledRoutes!==x.apiRoutes-1||
             x.productionReady!==false||x.backendOperational!==false)
            throw Error("UNSAFE_PREVIEW_STAGE");
          NODE
      - name: Initialize Cloudflare in disposable CI worktree
        run: |
          npx --yes vinext@1.3.1 init \
            --platform=cloudflare \
            --name lingxifield-public-preview-only \
            --cdn-cache=none \
            --data-cache=none \
            --image-optimization=none \
            --skip-check
      - name: Build actual Cloudflare Worker public-only preview
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          pnpm run build:vinext
      - name: Smoke actual local Worker pages and disabled private routes
        env:
          CI: "true"
        run: |
          set -euo pipefail
          pnpm run start:vinext > "$RUNNER_TEMP/com-local-preview.log" 2>&1 &
          local_pid=$!
          trap 'kill "$local_pid" 2>/dev/null || true' EXIT
          BASE=""
          for i in $(seq 1 90); do
            if ! kill -0 "$local_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/com-local-preview.log"
              echo "::error::Preview runtime terminated before its HTTP endpoint opened."
              exit 1
            fi
            for port in 8787 3000 3001 5173; do
              if curl --max-time 2 --silent --output /dev/null "http://127.0.0.1:$port/api/health"; then
                BASE="http://127.0.0.1:$port"
                break
              fi
            done
            if test -n "$BASE"; then break; fi
            sleep 1
          done
          if test -z "$BASE"; then
            tail -n 100 "$RUNNER_TEMP/com-local-preview.log"
            echo "::error::Local Worker preview never started."
            exit 1
          fi
          node scripts/cloudflare/smoke-emergency-local.mjs "$BASE"
      - name: Report exact status without claiming deployment
        if: always()
        run: |
          echo "## Emergency public pages only (strictly not production)" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "All API routes except /api/health return 503. No paid tasks or login." >> "$GITHUB_STEP_SUMMARY"
          echo "No Cloudflare deployment, DNS cutover, Vercel edit or .cn change." >> "$GITHUB_STEP_SUMMARY"
