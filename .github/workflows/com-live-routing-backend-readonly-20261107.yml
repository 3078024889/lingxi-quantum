name: COM verify saved scoped Cloudflare token and live DNS (READ ONLY)
on:
  push:
    branches: [infra/com-cloudflare-readiness-20261106]
    paths: ['.github/workflows/com-live-routing-backend-readonly-20261107.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: cloudflare-com-preview
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read-only Cloudflare zone, DNS, route and HTTPS API state
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token=os.environ.get("CF_TOKEN","")
          headers={"Authorization":"Bearer "+token,"Accept":"application/json"} if token else {}
          base="https://api.cloudflare.com/client/v4"
          def cf(path):
              try:
                  req=urllib.request.Request(base+path,headers=headers)
                  with urllib.request.urlopen(req,timeout=15) as f:
                      return f.status,json.load(f)
              except urllib.error.HTTPError as e:
                  return e.code,{}
              except Exception:
                  return 0,{}
          print("CF_PREVIEW_TOKEN_PRESENT:",bool(token))
          # User-token verification returns an identifier/status, never a token value.
          verify_status,verified=cf("/user/tokens/verify")
          v=verified.get("result",{}) if verified.get("success") else {}
          token_id=str(v.get("id",""))
          print("CF_GITHUB_USER_TOKEN_VERIFY_HTTP:",verify_status)
          print("CF_GITHUB_USER_TOKEN_STATUS:",v.get("status","unavailable"))
          print("CF_GITHUB_USER_TOKEN_ID_SUFFIX:",token_id[-10:] if token_id else "unavailable")
          # Account-level tokens use a separate verification endpoint.
          if verify_status!=200 and os.environ.get("CF_ACCOUNT"):
              acc_status,acc=cf("/accounts/"+os.environ["CF_ACCOUNT"]+"/tokens/verify")
              a=acc.get("result",{}) if acc.get("success") else {}
              print("CF_GITHUB_ACCOUNT_TOKEN_VERIFY_HTTP:",acc_status)
              print("CF_GITHUB_ACCOUNT_TOKEN_STATUS:",a.get("status","unavailable"))
              print("CF_GITHUB_ACCOUNT_TOKEN_ID_SUFFIX:",str(a.get("id",""))[-10:] or "unavailable")
          status,zones=cf("/zones?name=lingxifield.com&per_page=5")
          print("CF_ZONE_LIST_STATUS:",status)
          ids=[z["id"] for z in zones.get("result",[]) if z.get("name")=="lingxifield.com" and z.get("status")=="active"] if zones.get("success") else []
          print("CF_ACTIVE_EXACT_ZONE_COUNT:",len(ids))
          if len(ids)==1:
              zid=ids[0]
              for name in ("lingxifield.com","www.lingxifield.com"):
                  status,payload=cf("/zones/"+zid+"/dns_records?name="+name+"&per_page=20")
                  records=payload.get("result",[]) if payload.get("success") else []
                  print("DNS_READ",name,"HTTP",status,"ENTRIES",[(r.get("type"),r.get("proxied"),str(r.get("content",""))[:90]) for r in records])
              status,routes=cf("/zones/"+zid+"/workers/routes?per_page=100")
              known=[(r.get("pattern"),r.get("script")) for r in routes.get("result",[]) if "lingxifield.com" in str(r.get("pattern",""))] if routes.get("success") else []
              print("CF_ROUTE_LIST_STATUS:",status,"EXACT_ZONE_ROUTES:",known)
          def probe(url):
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"LINGXIFIELD-production-readiness/1.0"})
                  with urllib.request.urlopen(req,timeout=20) as f:
                      content_type=f.headers.get("Content-Type","").split(";")[0]
                      body=f.read(4096) if "/api/site-release-announcement" in url else b""
                      return f.status,content_type,body
              except urllib.error.HTTPError as e:
                  return e.code,(e.headers.get("Content-Type","") if e.headers else ""),b""
              except Exception:
                  return 0,"",b""
          for host in ("https://lingxifield.com","https://www.lingxifield.com","https://lingxifield-com-full-canary-20261107.3078024889.workers.dev"):
              for p in ("/api/health","/","/tools","/siai","/api/site-release-announcement","/api/sasi/account","/api/tools/jobs"):
                  code,typ,body=probe(host+p)
                  print("HTTPS_READ_ONLY",host.replace("https://",""),p,code,typ)
                  if p=="/api/site-release-announcement" and code==200:
                      try:
                          d=json.loads(body)
                          print("NOTICE_GATE:",d.get("enabled"),d.get("phase"),d.get("site"))
                      except Exception: print("NOTICE_GATE:UNPARSEABLE")
          print("NO_DNS_WRITE_NO_WORKER_DEPLOY_NO_BACKEND_MUTATION")
          print("CF_TOKEN_SCOPE_LIVE_RECHECK_AFTER_SAVED_WORKERS_ROUTE_READ_WRITE_20261107")
          PY
