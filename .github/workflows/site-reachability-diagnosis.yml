name: Live site reachability diagnosis (read-only, no deploy)
on:
  push:
    branches: [feature/site-reachability-diagnosis-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: DNS, TLS and HTTP reachability from an independent runner
        shell: bash
        run: |
          set +e
          for host in lingxifield.com lingxifield.cn www.lingxifield.com www.lingxifield.cn; do
            echo "::group::REACHABILITY ${host}"
            echo "DNS system resolver:"
            getent ahostsv4 "${host}" | awk 'NR<=3{print $1}' || true
            echo "DNS public resolvers:"
            for ns in 1.1.1.1 8.8.8.8; do
              printf "resolver=%s " "${ns}"
              dig +time=3 +tries=1 +short @"${ns}" A "${host}" | head -n 4 | tr '\n' ' '
              echo
            done
            echo "HTTPS homepage:"
            curl -L -sS --connect-timeout 6 --max-time 17 --retry 1 \
              -o /dev/null -w "http=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} remote=%{remote_ip} redirect=%{redirect_url} final=%{url_effective} ssl=%{ssl_verify_result}\n" \
              "https://${host}/"
            echo "HTTPS robots.txt:"
            curl -L -sS --connect-timeout 6 --max-time 17 \
              -o /dev/null -w "http=%{http_code} total=%{time_total} ssl=%{ssl_verify_result}\n" \
              "https://${host}/robots.txt"
            echo "::endgroup::"
          done
