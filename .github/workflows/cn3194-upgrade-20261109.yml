name: CN3194 exact upgrade and signed-payment gate (NO PROD DEPLOY)
on:
  push:
    branches: [ops/cn3194-upgrade-5054d6-20261109]
    paths:
      - 'scripts/ops/ecs-cn3194-unified-standalone-upgrade-20261109.sh'
      - 'scripts/ops/cn-payment-activate-3194-20261109.sh'
      - 'scripts/ops/ecs-cn3194-release-runner-20261109.sh'
      - 'tests/cn3194-upgrade-20261109.test.mjs'
      - '.github/workflows/cn3194-upgrade-20261109.yml'
  pull_request:
    paths:
      - 'scripts/ops/ecs-cn3194-unified-standalone-upgrade-20261109.sh'
      - 'scripts/ops/cn-payment-activate-3194-20261109.sh'
      - 'tests/cn3194-upgrade-20261109.test.mjs'
      - '.github/workflows/cn3194-upgrade-20261109.yml'
permissions:
  contents: read
concurrency:
  group: cn3194-upgrade-5054d6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Shell syntax
        run: |
          set -Eeuo pipefail
          bash -n scripts/ops/ecs-cn3194-unified-standalone-upgrade-20261109.sh
          bash -n scripts/ops/cn-payment-activate-3194-20261109.sh
          bash -n scripts/ops/ecs-cn3194-release-runner-20261109.sh
      - name: Upgrade, rollback and payment safety contracts
        run: node --test tests/cn3194-upgrade-20261109.test.mjs
      - name: No production actions
        run: echo CN3194_UPGRADE_SCRIPT_TESTED_NO_ECS_NGINX_OR_PAYMENT_MUTATION
