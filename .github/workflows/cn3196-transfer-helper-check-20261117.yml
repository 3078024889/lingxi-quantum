name: CN3196 isolated R2 transfer helper static gate

on:
  push:
    branches:
      - fix/site-wallet-payment-readiness-20261116
    paths:
      - scripts/ops/R2-CN3196-Transfer-20261117.ps1
      - scripts/ops/cn3196-candidate-stage-20261116.sh
      - scripts/ops/cn3196-r2-ens-stage-20261117.template.sh
      - .github/workflows/cn3196-transfer-helper-check-20261117.yml
  pull_request:
    branches:
      - ci/cn3194-payment-base-20261110
    paths:
      - scripts/ops/R2-CN3196-Transfer-20261117.ps1
      - scripts/ops/cn3196-candidate-stage-20261116.sh
      - scripts/ops/cn3196-r2-ens-stage-20261117.template.sh
      - .github/workflows/cn3196-transfer-helper-check-20261117.yml

permissions:
  contents: read

concurrency:
  group: cn3196-transfer-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash-candidate-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate pinned candidate stage shell
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/ops/cn3196-candidate-stage-20261116.sh
          bash -n scripts/ops/cn3196-r2-ens-stage-20261117.template.sh
          node --check scripts/ops/cn-payment-signed-live-probe-20261109.mjs
          grep -Fq 'CN3196_READ_ONLY_LIVE_MERCHANT_PROBE_BEGIN' scripts/ops/cn3196-candidate-stage-20261116.sh
          grep -Fq 'CN_MERCHANT_PAYPAL_LIVE_OAUTH' scripts/ops/cn-payment-signed-live-probe-20261109.mjs
          grep -Fq 'name==="miniJsapi"?"MINI_JSAPI_CONFIG"' scripts/ops/cn-payment-signed-live-probe-20261109.mjs
          grep -Fq 'PROD_PORT=3195' scripts/ops/cn3196-candidate-stage-20261116.sh
          grep -Fq 'CANDIDATE_PORT=3196' scripts/ops/cn3196-candidate-stage-20261116.sh
          grep -Fq 'ROLLBACK_PORT=3193' scripts/ops/cn3196-candidate-stage-20261116.sh
          grep -Fq 'SOURCE_SHA="22c7558dcf4059b690493c150f0ff5993c71c6a8"' scripts/ops/cn3196-candidate-stage-20261116.sh
          grep -Fq 'ARCHIVE_SHA="533bf65e97c14b255b03742c6d552f3dc7b74c61c21c550c43b77839ca5e1c4b"' scripts/ops/cn3196-candidate-stage-20261116.sh
          grep -Fq 'CN3196_CANDIDATE_FAILED_PRODUCTION_3195_UNCHANGED' scripts/ops/cn3196-candidate-stage-20261116.sh
          grep -Fq 'CN3196_CANDIDATE_READY_NO_PRODUCTION_SWITCH' scripts/ops/cn3196-r2-ens-stage-20261117.template.sh
          grep -Fq 'CN3196_CANDIDATE_PAYMENT_GATES_CLOSED_PASS' scripts/ops/cn3196-candidate-stage-20261116.sh
          grep -Fq 'cn-20261117-cn3196-candidate.tar.gz' scripts/ops/cn3196-r2-ens-stage-20261117.template.sh
          grep -Fq 'bash "$AUDIT"' scripts/ops/cn3196-r2-ens-stage-20261117.template.sh
          if grep -Eq 'nginx -s reload|systemctl restart nginx|sed -i.*lingxifield\.conf' scripts/ops/cn3196-candidate-stage-20261116.sh; then
            echo 'CANDIDATE_SCRIPT_MUST_NOT_SWITCH_PRODUCTION'
            exit 1
          fi
          echo 'CN3196_STAGE_SCRIPT_STATIC_GATE_PASS'

  powershell-transfer:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Parse and verify pinned R2 transfer helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts/ops/R2-CN3196-Transfer-20261117.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'POWERSHELL_PARSE_FAILED'
          }
          $source = Get-Content -LiteralPath $path -Raw
          foreach ($pin in @(
            '22c7558dcf4059b690493c150f0ff5993c71c6a8',
            '533bf65e97c14b255b03742c6d552f3dc7b74c61c21c550c43b77839ca5e1c4b',
            '085051199845402a051dd69893fa43b59853198b',
            '02e0b843452d4a29aeb9a7b05a82bde6f9c76891',
            '0de8892fe696a35dbb1d5277214dfbf36e3b9a3b',
            'cn3192r2:lingxi-cn3192-transfer/cn3196',
            'ecs-cn-unified-20261117-22c7558dcf40',
            'cn-20261115-unified-standalone.tar.gz',
            '--s3-upload-concurrency','8',
            'cn3196-candidate-20261117-',
            'copyurl',
            'R2_REMOTE_OBJECT_SIZE_GATE_PASS'
          )) {
            if (-not $source.Contains($pin)) { throw "TRANSFER_HELPER_PIN_MISSING: $pin" }
          }
          if ($source.Contains('197e60eae80268ea8c0e18320db58f9cac7eb573') -or $source.Contains('273d4ee220faab90e98121b042cf51545666b96ff74ba5233f8c8d56c04d6c18') -or $source.Contains('--download')) {
            throw 'TRANSFER_HELPER_CONTAINS_RETIRED_OR_LOCAL_DOWNLOAD_PATH'
          }
          if ($source.Contains('WECHAT_MINI_JSAPI_TOPUPS_ENABLED=true') -or $source.Contains('USD_BALANCE_TOPUP_ENABLED=true')) {
            throw 'TRANSFER_HELPER_MUST_NOT_ENABLE_PRODUCTION_PAYMENTS'
          }
          Write-Host 'CN3196_POWERSHELL_PARSE_AND_PIN_GATE_PASS'

  production-payment-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read-only public payment readiness probe for both production sites
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          probe() {
            local name="$1" url="$2" code
            code="$(curl -sS --connect-timeout 8 --max-time 25 --retry 1 --retry-delay 1 -H 'Accept: application/json' -o "$TMP/$name.json" -w '%{http_code}' "$url" || true)"
            echo "PRODUCTION_READONLY_PROBE:$name:HTTP=$code"
            [[ "$code" == "200" ]] || { echo "PRODUCTION_READONLY_PROBE_FAILED:$name"; exit 1; }
          }
          probe cn_providers https://lingxifield.cn/api/pay/providers
          probe cn_mini_cny https://lingxifield.cn/api/wechat/mini/cny-topup/availability
          probe com_providers https://lingxifield.com/api/pay/providers
          probe cn_health https://lingxifield.cn/api/health
          node - "$TMP" <<'NODE'
          const fs=require("node:fs"),path=require("node:path"),dir=process.argv[2];
          const read=n=>JSON.parse(fs.readFileSync(path.join(dir,n+".json"),"utf8"));
          const yes=v=>v===true?"YES":v===false?"NO":"NOT_EXPOSED";
          for(const [site,file] of [["CN","cn_providers"],["COM","com_providers"]]){
            const p=read(file);
            for(const key of ["wechat","alipay","paypal","cnyBalanceTopupReady","usdBalanceTopupReady"])
              console.log(site+"_PAYMENT_"+key.toUpperCase()+"="+yes(p[key]));
            if(p.diagnostics){
              for(const key of ["wechat","alipay","paypal"]){
                const d=p.diagnostics[key];
                if(d) console.log(site+"_PAYMENT_"+key.toUpperCase()+"_CONFIGURED="+yes(d.configured));
                if(d) console.log(site+"_PAYMENT_"+key.toUpperCase()+"_MISSING_COUNT="+Number(d.missingCount||0));
              }
            }
          }
          const m=read("cn_mini_cny");
          console.log("CN_MINI_CNY_JSAPI_ENABLED="+yes(m.enabled));
          console.log("CN_MINI_CNY_JSAPI_REASON="+String(m.reason||"NOT_EXPOSED").replace(/[^A-Z0-9_:-]/gi,"").slice(0,120));
          console.log("CN_MINI_CNY_JSAPI_MISSING_COUNT="+(Array.isArray(m.missing)?m.missing.length:0));
          const h=read("cn_health");
          console.log("CN_HEALTH_STATUS="+String(h.status||h.ok||"HEALTHY"));
          console.log("NO_ORDER_CREATED_NO_CHARGE_NO_REFUND_NO_BALANCE_MUTATION");
          NODE
