name: ToolPass verified currency and payment-channel regression (NO DEPLOY)
on:
  push:
    branches: [fix/toolpass-readiness-canary-20261109]
  pull_request:
    branches: [release/com-sasi-full-20261108]
    paths:
      - 'tests/cn-toolpass-public-ui-20261108.test.mjs'
      - 'app/tools/pass/page.tsx'
      - '.github/workflows/toolpass-verified-currency-regression-20261109.yml'
permissions: {contents: read}
concurrency:
  group: toolpass-currency-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-real-provider-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Confirm wallet, provider, checkout and session gating
        run: |
          node --test tests/cn-toolpass-public-ui-20261108.test.mjs
          node --test tests/cn-wallet-checkout-entry-20261108.test.mjs
          node --test tests/toolpass-premium-nine-language-20261109.test.mjs
          node --test tests/com-payment-edge-merchant-readiness-20261108.test.mjs
          echo TOOLPASS_VERIFIED_PAYMENT_CONTRACT_PASS_NO_DEPLOY
