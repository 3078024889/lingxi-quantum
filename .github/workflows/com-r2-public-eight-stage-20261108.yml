name: COM eight verified public R2 large objects stage (NO DOMAIN DEPLOY)
on:
  push:
    branches: [ops/dual-site-readonly-20261108]
    paths:
      - '.github/workflows/com-r2-public-eight-stage-20261108.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: com-public-r2-eight-stage-20261108
  cancel-in-progress: false
jobs:
  public-eight-only:
    environment: cloudflare-production
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.com
      NEXT_PUBLIC_SUPABASE_URL: https://sxsgdpqojepgbbrxrzlq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LINGXI_R2_UPLOAD_APPROVED: YES-STAGE-ONLY
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.28.0,run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc,cache: pnpm}
      - name: Compile verified exact source
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile
          pnpm add -D @opennextjs/cloudflare@1.20.16 wrangler@4.158.0 --save-exact
          pnpm exec opennextjs-cloudflare build
      - name: Verify public resource manifest, size and eight SHA-256 digests
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/cloudflare/stage-large-public-assets.mjs
          node scripts/cloudflare/stage-r2-public-assets.mjs --audit
          echo 'COM_8_R2_SOURCE_SHA_MANIFEST_PASS'
      - name: Upload exactly eight public objects and verify remote readback bytes
        run: |
          set -Eeuo pipefail
          node scripts/cloudflare/stage-r2-public-assets.mjs --upload-verified
          echo 'COM_8_PUBLIC_R2_REMOTE_VERIFIED_FOR_WORKER_DELIVERY'
