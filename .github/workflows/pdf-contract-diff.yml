name: LINGXIFIELD PDF Contract Diff Real Browser E2E
on:
  push:
    branches: [feature/pdf-contract-compare-20261104]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingxi-pdf-compare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-contract-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pin pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Pin Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Unit test semantic text diff and scan rejection
        run: node --test tests/tool-closure/pdf-contract-diff.test.mjs
      - name: Actual production build and types
        run: pnpm build
      - name: Install Chrome
        run: pnpm exec playwright install --with-deps chrome
      - name: Actual PDF uploads, amounts/dates/clauses output, download, error gate
        run: pnpm exec playwright test -c playwright.final.config.ts --workers=2 tests/final-closure/pdf-compare-contract-output.spec.ts
      - name: Traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: lingxi-contract-diff-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
