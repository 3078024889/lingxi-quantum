name: LINGXIFIELD Production Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lingxifield-production-gate-${{ github.ref }}
  cancel-in-progress: true


jobs:
  source:
    name: source-and-production-build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false

      - name: Use pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Show toolchain
        run: |
          node --version
          pnpm --version

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Clean baseline audit
        run: pnpm ci:baseline

      - name: Source and product gates
        run: pnpm ci:source

      - name: SIAI approved catalog and research-preview provenance gate
        run: node --test tests/siai-source-preview.test.mjs tests/siai-search-discovery.test.mjs tests/siai-localized-indexing.test.mjs tests/siai-customer-language.test.mjs tests/siai-major-publishers-004.test.mjs tests/siai-company-source.test.mjs tests/footer-unified.test.mjs

      - name: Playwright import/dependency contract
        run: pnpm ci:playwright-contract

      - name: AI tools search regression
        run: |
          node scripts/ci/verify-ai-tool-search.mjs
          node scripts/ci/verify-ai-media-pricing-policy.mjs
          node scripts/ci/verify-miniapp-search-index.mjs

      - name: Production build
        run: pnpm build


  browser:
    name: browser-${{ matrix.project }}-shard-${{ matrix.shard }}-of-2
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
        shard: [1, 2]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Use pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Build this exact release candidate independently
        run: pnpm build
      - name: Verify runner Chrome or install with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          # ubuntu-24.04 GitHub runners already include Google Chrome.
          # Playwright channel "chrome" uses the installed branded browser.
          if command -v google-chrome >/dev/null 2>&1 && google-chrome --version; then
            echo "PLAYWRIGHT_USING_RUNNER_CHROME"
            exit 0
          fi
          echo "::warning::Runner has no Google Chrome; installing with retries."
          for attempt in 1 2 3; do
            if PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=120000 pnpm exec playwright install --with-deps chrome; then
              command -v google-chrome
              google-chrome --version
              exit 0
            fi
            echo "::warning::Chrome installation attempt ${attempt} failed"
            sleep $((attempt * 12))
          done
          echo "::error::Google Chrome unavailable after three installation attempts"
          exit 1
      - name: Browser closure for this project and shard
        run: pnpm exec playwright test -c playwright.final.config.ts --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2 --workers=1
      - name: Upload shard traces and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: lingxifield-e2e-${{ github.sha }}-${{ matrix.project }}-${{ matrix.shard }}-of-2
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  production-gate:
    name: production-gate
    if: ${{ always() }}
    needs: [source, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed unless source plus all four browser shards succeed
        run: |
          if [ "${{ needs.source.result }}" != "success" ] || [ "${{ needs.browser.result }}" != "success" ]; then
            echo "::error::Source/build or at least one of four browser shards did not pass."
            exit 1
          fi
          echo "ALL_REQUIRED_RELEASE_GATES_PASS"
