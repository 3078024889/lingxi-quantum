name: com Cloudflare preview auth preflight (read-only)

on:
  push:
    branches:
      - infra/com-cloudflare-readiness-20261106
    paths:
      - '.github/workflows/com-cf-auth-preflight.yml'
      - 'scripts/cloudflare/convert-r2-proof-manifest.mjs'
      - 'tests/cloudflare/convert-r2-proof-manifest.test.mjs'
      - '.github/workflows/com-cloudflare-public-preview-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: com-cf-readonly-credentials
  cancel-in-progress: true

jobs:
  verify-cloudflare-account:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: cloudflare-com-preview
    steps:
      - name: Validate environment only; no upload, no deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN??"";
          const account=process.env.CLOUDFLARE_ACCOUNT_ID??"";
          if(!token)throw Error("CLOUDFLARE_API_TOKEN_MISSING_IN_THIS_ENVIRONMENT");
          if(!/^[0-9a-f]{32}$/.test(account))throw Error("CLOUDFLARE_ACCOUNT_ID_MISSING_OR_NOT_32_HEX");
          async function verify(path){
            const response=await fetch("https://api.cloudflare.com/client/v4"+path,{
              headers:{"Authorization":"Bearer "+token,"Accept":"application/json"},
              signal:AbortSignal.timeout(20000),
            });
            const data=await response.json().catch(()=>({success:false}));
            if(!response.ok||data.success!==true)throw Error("CLOUDFLARE_AUTH_OR_SCOPE_REJECTED:"+response.status);
            return data;
          }
          const verified=await verify("/user/tokens/verify");
          if(verified.result?.status!=="active")throw Error("CLOUDFLARE_TOKEN_NOT_ACTIVE");
          console.log("CLOUDFLARE_TOKEN_ACTIVE");
          const bucket=await verify("/accounts/"+account+"/r2/buckets/lingxifield-com-public-assets");
          if(bucket.result?.name!=="lingxifield-com-public-assets")throw Error("PUBLIC_BUCKET_NOT_FOUND");
          console.log("CLOUDFLARE_PUBLIC_R2_BUCKET_ACCESSIBLE");
          const url="https://assets.lingxifield.com/_lingxi_ci_no_object_probe_9a2d8728";
          const response=await fetch(url,{method:"HEAD",redirect:"manual",signal:AbortSignal.timeout(16000)});
          if(response.status!==404)throw Error("PUBLIC_ASSET_DOMAIN_UNEXPECTED_STATUS_"+response.status);
          console.log("PUBLIC_R2_CUSTOM_DOMAIN_ACTIVE_EMPTY_KEY_404");
          console.log("NO_STORAGE_WRITE_NO_WORKER_DEPLOY_NO_DNS_CHANGE");
          NODE
      - name: Record credential gate result without secrets
        if: always()
        run: |
          echo "Read-only Cloudflare token and public bucket permission check" >> "$GITHUB_STEP_SUMMARY"
          echo "No deployment, no production DNS, no .cn or Vercel changes" >> "$GITHUB_STEP_SUMMARY"
