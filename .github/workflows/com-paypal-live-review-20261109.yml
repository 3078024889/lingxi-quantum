name: COM PayPal Live review and anonymous market preflight (NO DEPLOY)
on:
  push:
    branches: [fix/com-paypal-live-review-ready-20261109]
  pull_request:
    branches: [release/com-sasi-full-20261108]
    paths:
      - 'app/api/pay/create/route.ts'
      - 'lib/paypal.ts'
      - 'scripts/cloudflare/public-market-listings.mjs'
      - 'scripts/ops/probe-sasi-anonymous-rest-20261109.mjs'
      - 'tests/com-paypal-live-review-20261109.test.mjs'
      - '.github/workflows/com-unified-next-isolated-canary-20261108.yml'
      - '.github/workflows/com-paypal-live-review-20261109.yml'
permissions: {contents: read}
concurrency:
  group: com-paypal-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-review-source-and-rest:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      LINGXI_SELFHOST_BUILD: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.com
      NEXT_PUBLIC_SUPABASE_URL: https://sxsgdpqojepgbbrxrzlq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.28.0,run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc,cache: pnpm}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: PayPal Live return, fulfillment, nine-language storefront and safe diagnostic tests
        run: |
          node --test tests/com-paypal-live-review-20261109.test.mjs
          node tests/paypal-merchant-idempotency-20261108.test.mjs
          node --test tests/com-public-market-edge.test.mjs
          node --test tests/com-payment-edge-merchant-readiness-20261108.test.mjs
          node --test tests/sasi-marketplace-long-description-20261109.test.mjs
      - name: Test exact anonymous database REST with no secret or order mutation
        run: node scripts/ops/probe-sasi-anonymous-rest-20261109.mjs
      - name: Typecheck and standalone build without deployment
        run: |
          pnpm exec tsc --noEmit
          pnpm build
          test -s .next/standalone/server.js
          echo PAYPAL_COM_REVIEW_SOURCE_AND_MARKETPLACE_PASS_NO_PAYMENT_LIVE
