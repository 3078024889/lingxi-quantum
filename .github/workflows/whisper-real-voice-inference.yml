name: Real Whisper Voice to Subtitles Gate
on:
  push:
    branches:
      - fix/tools-v130-exif-video-result-invalidation-20261102
    paths:
      - 'lib/tools/autonomous/transcribe-local.ts'
      - 'components/tools/TranscriptionWorkbench.tsx'
      - 'tests/final-closure/whisper-real-voice-v144.spec.ts'
      - 'tests/final-closure/whisper-real-video-v150.spec.ts'
      - '.github/workflows/whisper-real-voice-inference.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/tools/autonomous/transcribe-local.ts'
      - 'components/tools/TranscriptionWorkbench.tsx'
      - 'tests/final-closure/whisper-real-voice-v144.spec.ts'
      - 'tests/final-closure/whisper-real-video-v150.spec.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-asr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  genuine-whisper:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install synthetic voice generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg
          espeak-ng --version
      - name: Build production app
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chrome
      - name: Genuine WAV and spoken MP4 to on-device Whisper and timed TXT SRT VTT
        run: pnpm exec playwright test -c playwright.final.config.ts --project=desktop-chromium --workers=1 tests/final-closure/whisper-real-voice-v144.spec.ts tests/final-closure/whisper-real-video-v150.spec.ts
      - name: Upload failed model inference trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: whisper-real-voice-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
