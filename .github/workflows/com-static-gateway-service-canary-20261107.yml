name: COM static gateway with legacy Worker service binding (NO DNS CUTOVER)
on:
  push:
    branches: [infra/com-cloudflare-readiness-20261106]
    paths: ['.github/workflows/com-static-gateway-service-canary-20261107.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingxifield-com-service-gateway-canary
  cancel-in-progress: true
jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: cloudflare-com-preview
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.com
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact SHA that passed all four real browser shards and PG17
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 916f44c6746cf8ac6df16b4f8e4b98a2952c79c1
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: {version: 11.28.0, run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version-file: .nvmrc, cache: pnpm}
      - name: Verify SHA, Cloudflare environment, and existing production isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '916f44c6746cf8ac6df16b4f8e4b98a2952c79c1'
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_PREVIEW_TOKEN_UNAVAILABLE"; exit 1; }
          [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[a-f0-9]{32}$ ]] || { echo "::error::CLOUDFLARE_ACCOUNT_NOT_SET"; exit 1; }
          test "$NEXT_PUBLIC_SUPABASE_URL" = 'https://sxsgdpqojepgbbrxrzlq.supabase.co'
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          echo 'EXACT_SHA_CLOUD_CREDENTIALS_PRESERVED_PROD_DNS_UNTOUCHED'
      - run: pnpm install --frozen-lockfile
      - name: Build official Cloudflare Next 15 OpenNext canary with no domain routes
        run: |
          set -Eeuo pipefail
          pnpm add -D @opennextjs/cloudflare@1.20.16 wrangler@4.158.0 --save-exact
          node --test tests/cloudflare-large-public-assets.test.mjs
          pnpm exec opennextjs-cloudflare build
          node scripts/cloudflare/stage-large-public-assets.mjs
          node scripts/cloudflare/stage-r2-public-assets.mjs --audit
          # Next has already prerendered these three public HTML documents, but
          # OpenNext currently does not place them into .open-next/assets.
          # Copy exactly the build outputs so Cloudflare serves HTML asset-first.
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,existsSync,mkdirSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const files=[['index','/'],['tools','/tools'],['siai','/siai'],['sasi','/sasi'],['sasi/pricing','/sasi/pricing']];
          mkdirSync('.open-next/assets/sasi',{recursive:true});
          for(const [slug,route] of files){
            const source='.next/server/app/'+slug+'.html';
            const dest='.open-next/assets/'+slug+'.html';
            if(!existsSync(source))throw Error('PUBLIC_HTML_BUILD_SOURCE_MISSING:'+route);
            const data=readFileSync(source);
            const html=data.toString('utf8');
            if(data.length<1000||!html.includes('<html')||!html.includes('</html>'))throw Error('PUBLIC_HTML_INVALID:'+route);
            for(const name of ['SUPABASE_SERVICE_ROLE_KEY','CLOUDFLARE_API_TOKEN','DATABASE_URL='])
              if(html.includes(name))throw Error('PRIVATE_IDENTIFIER_IN_PUBLIC_HTML:'+route);
            mkdirSync('.open-next/assets',{recursive:true});
            if(existsSync(dest)){
              if(!readFileSync(dest).equals(data))throw Error('EXISTING_PUBLIC_HTML_DIFFERS:'+route);
            }else{
              writeFileSync(dest,data,{mode:0o644});
            }
            if(!readFileSync(dest).equals(data))throw Error('HTML_ASSET_COPY_MISMATCH:'+route);
            console.log('COM_PUBLIC_HTML_ASSET_STAGED',route,data.length,createHash('sha256').update(data).digest('hex').slice(0,16));
          }
          console.log('COM_THREE_PUBLIC_STATIC_HTML_ASSETS_READY');
          // Next 15 has already generated the public tool pages as HTML.
          // Preserve sensitive account/payment/admin entry points on the Worker.
          const toolManifest=JSON.parse(readFileSync('.next/prerender-manifest.json','utf8'));
          const excluded=new Set(['/tools/admin','/tools/pass','/tools/pay','/tools/image-to-pdf-pro']);
          const routes=Object.keys(toolManifest.routes||{}).filter(p=>
            /^\/tools\/[a-z0-9-]+$/.test(p)&&!excluded.has(p)
          ).sort();
          if(routes.length<120||routes.length>130)
            throw Error('PUBLIC_TOOL_PRERENDER_ROUTE_COUNT_OUT_OF_RANGE:'+routes.length);
          mkdirSync('.open-next/assets/tools',{recursive:true});
          let copied=0,bytes=0;
          for(const path of routes){
            const from='.next/server/app'+path+'.html';
            const to='.open-next/assets'+path+'.html';
            if(!existsSync(from))throw Error('PUBLIC_TOOL_HTML_BUILD_MISSING:'+path);
            const body=readFileSync(from);
            const html=body.toString('utf8');
            if(body.length<1000||!html.includes('<html')||!html.includes('</html>'))
              throw Error('INVALID_PUBLIC_TOOL_HTML:'+path);
            for(const marker of ['SUPABASE_SERVICE_ROLE_KEY','sb_secret_','CLOUDFLARE_API_TOKEN','DATABASE_URL=']){
              if(html.includes(marker))throw Error('PRIVATE_IDENTIFIER_IN_PUBLIC_TOOL_HTML:'+path);
            }
            if(existsSync(to)){
              if(!readFileSync(to).equals(body))throw Error('EXISTING_TOOL_ASSET_DIFFERS:'+path);
            }else{
              writeFileSync(to,body,{mode:0o644});
              copied++;
            }
            bytes+=body.length;
          }
          for(const must of ['/tools/pdf-editor','/tools/e-sign-pdf','/tools/pdf-merge-split','/tools/pdf-to-jpg']){
            if(!routes.includes(must))throw Error('CRITICAL_PUBLIC_TOOL_NOT_PRERENDERED:'+must);
          }
          console.log('COM_PUBLIC_TOOL_PAGES_STAGED',routes.length,'new',copied,'total_bytes',bytes);
          // The verified directory widget is prerendered by Next; OpenNext's
          // /api/* Worker-first default otherwise risks Cloudflare CPU 1102.
          const manifest=JSON.parse(readFileSync('.next/prerender-manifest.json','utf8'));
          if(!manifest.routes?.['/api/public/siai-widget'])throw Error('SIAI_WIDGET_NOT_PRERENDERED');
          const candidates=[
            '.next/server/app/api/public/siai-widget/route.body',
            '.next/server/app/api/public/siai-widget.body',
            '.next/server/app/api/public/siai-widget/route.json'
          ];
          const source=candidates.find(existsSync);
          if(!source)throw Error('SIAI_WIDGET_STATIC_BODY_NOT_FOUND');
          const body=readFileSync(source);
          const info=JSON.parse(body.toString('utf8'));
          if(info.publisher!=='LINGXIFIELD'||info.schemaVersion!==1||
             !Array.isArray(info.rows)||info.rows.length<10||info.total!==info.rows.length)
            throw Error('SIAI_WIDGET_PUBLIC_FEED_INVALID');
          const target='.open-next/assets/api/public/siai-widget';
          if(existsSync(target))throw Error('SIAI_WIDGET_ASSET_ALREADY_EXISTS');
          mkdirSync('.open-next/assets/api/public',{recursive:true});
          writeFileSync(target,body,{mode:0o644});
          if(!readFileSync(target).equals(body))throw Error('SIAI_WIDGET_COPY_BYTES_MISMATCH');
          const headerFile='.open-next/assets/_headers';
          let prev=existsSync(headerFile)?readFileSync(headerFile,'utf8'):'';
          if(prev.includes('/api/public/siai-widget'))throw Error('WIDGET_HEADER_RULE_CONFLICT');
          const headers=[
            '/api/public/siai-widget',
            '  Content-Type: application/json; charset=utf-8',
            '  Access-Control-Allow-Origin: *',
            '  Cache-Control: public, max-age=300, s-maxage=900, stale-while-revalidate=3600',
            '  X-Content-Type-Options: nosniff'
          ].join('\n');
          writeFileSync(headerFile,prev+'\n'+headers+'\n',{mode:0o644});
          console.log('COM_PUBLIC_WIDGET_STATIC_JSON_ASSET_STAGED',body.length,info.total,source);
          // Public availability is a static-asset contract. It explicitly does
          // NOT claim that login, payment, SASI or the heavyweight Worker is healthy.
          const publicStatus={
            schemaVersion:1,
            service:'lingxifield',
            site:'https://lingxifield.com',
            scope:'public-maintenance-assets-only',
            publicPages:['/','/tools','/siai'],
            publicSurface:'ready',
            dynamicBackend:'not-attested',
            realLogin:'not-attested',
            payments:'not-attested',
            sasi:'not-attested',
            fullFileExport:'not-attested',
            sourceRevision:process.env.GITHUB_SHA||'unknown'
          };
          const statusPath='.open-next/assets/api/public/site-status';
          if(existsSync(statusPath))throw Error('PUBLIC_STATUS_ASSET_ALREADY_EXISTS');
          writeFileSync(statusPath,JSON.stringify(publicStatus),{mode:0o644});
          const statusHeaders=[
            '/api/public/site-status',
            '  Content-Type: application/json; charset=utf-8',
            '  Cache-Control: public, max-age=60',
            '  X-Content-Type-Options: nosniff'
          ].join('\n');
          writeFileSync(headerFile,readFileSync(headerFile,'utf8')+'\n'+statusHeaders+'\n',{mode:0o644});
          console.log('COM_PUBLIC_ONLY_STATUS_STAGED_NO_BACKEND_CLAIMS');
          JS
          pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/com-canary-dry-run"
          echo 'EXACT_SHA_OPENNEXT_R2_DRY_RUN_PASS'
      - name: Create dedicated PUBLIC R2 bucket only when missing, never touch other buckets
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec wrangler r2 bucket list > "$RUNNER_TEMP/public-bucket-inventory.txt" 2> "$RUNNER_TEMP/public-bucket-errors.txt" || {
            echo "::error::CLOUDFLARE_R2_BUCKET_LIST_DENIED"; exit 1;
          }
          if grep -Fq 'lingxifield-com-large-public' "$RUNNER_TEMP/public-bucket-inventory.txt"; then
            echo 'R2_DEDICATED_PUBLIC_BUCKET_EXISTS'
          else
            pnpm exec wrangler r2 bucket create lingxifield-com-large-public --use-remote > /dev/null || {
              echo "::error::R2_DEDICATED_PUBLIC_BUCKET_CREATION_FAILED"; exit 1;
            }
            echo 'R2_DEDICATED_PUBLIC_BUCKET_CREATED_NO_PRIVATE_BUCKETS_CHANGED'
          fi
      - name: Reuse previously verified eight R2 objects, avoid re-upload of 365 MiB
        run: |
          set -Eeuo pipefail
          node scripts/cloudflare/stage-r2-public-assets.mjs --audit
          echo "EIGHT_R2_OBJECTS_PREVIOUSLY_UPLOAD_READBACK_SHA256_VERIFIED_RUN_42356646463"
          echo "This run does not rewrite remote R2; HTTPS Range validation follows after canary deploy."
      - name: Create tiny static gateway and bind current production Worker as unchanged backend
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          if(c.main!=='.open-next/offload-worker.mjs'||c.r2_buckets?.[0]?.bucket_name!=='lingxifield-com-large-public')
            throw Error('UNEXPECTED_VERIFIED_BACKEND_CONFIG');
          const gateway=[
            'export default {',
            '  async fetch(request,env){',
            '    const url=new URL(request.url);',
            '    if(url.hostname==="www.lingxifield.com"){',
            '      const dest=new URL(request.url);dest.hostname="lingxifield.com";',
            '      return Response.redirect(dest.toString(),308);',
            '    }',
            '    const isPublicJson=url.pathname==="/api/public/siai-widget"||url.pathname==="/api/public/site-status";',
            '    const sensitiveApi=url.pathname.startsWith("/api/")&&!isPublicJson;',
            '    if(!sensitiveApi&&(request.method==="GET"||request.method==="HEAD")){',
            '      const asset=await env.ASSETS.fetch(request);',
            '      if(asset.status===200||asset.status===206||asset.status===304||[301,302,307,308].includes(asset.status))return asset;',
            '    }',
            '    return env.LEGACY_BACKEND.fetch(request);',
            '  }',
            '};'
          ].join('\n')+'\n';
          writeFileSync('.open-next/static-gateway.mjs',gateway,{mode:0o644});
          c.name='lingxifield-com-static-gateway-canary-20261107';
          c.main='.open-next/static-gateway.mjs';
          c.workers_dev=true;
          c.minify=true;
          c.upload_source_maps=false;
          c.services=[{binding:'LEGACY_BACKEND',service:'lingxifield-com-full-canary-20261107'}];
          delete c.r2_buckets;
          delete c.route;
          delete c.routes;
          delete c.triggers;
          delete c.vars;
          c.assets.html_handling='auto-trailing-slash';
          c.assets.not_found_handling='none';
          c.assets.run_worker_first=[
            '/api/*','!/api/public/siai-widget','!/api/public/site-status',
            '/','/tools','/tools/*','/siai','/sasi','/sasi/*',
            '/runtime/*','/models/*','/media/*','/_next/static/media/ort-*.wasm'
          ];
          if(c.services.length!==1||c.services[0].service!=='lingxifield-com-full-canary-20261107')
            throw Error('EXACT_BACKEND_SERVICE_GUARD_FAILED');
          writeFileSync('wrangler.canary.jsonc',JSON.stringify(c,null,2)+'\n',{mode:0o600});
          console.log('COM_STATIC_GATEWAY_BINDING_TO_EXISTING_BACKEND_ONLY_NO_DNS_ROUTES');
          JS
      - name: Validate Cloudflare's CURRENT uncompressed Worker size after official minification
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec wrangler deploy --config wrangler.canary.jsonc --minify --no-upload-source-maps --dry-run --outdir "$RUNNER_TEMP/size-minified" > "$RUNNER_TEMP/minified-size.log" 2>&1
          node - <<'JS'
          const fs=require('node:fs');
          const s=fs.readFileSync(process.env.RUNNER_TEMP+'/minified-size.log','utf8');
          const m=s.match(/Total Upload:\s*([0-9.]+)\s*(KiB|MiB)/i);
          if(!m)throw new Error('CANARY_MINIFIED_WORKER_SIZE_MISSING');
          const kib=Number(m[1])*(m[2].toLowerCase()==='mib'?1024:1);
          console.log('CANARY_MINIFIED_WORKER_KIB='+kib.toFixed(1));
          if(kib>=64000)throw new Error('CANARY_MINIFIED_WORKER_EXCEEDS_SAFE_64_MIB_GATE');
          console.log('CANARY_MINIFIED_WORKER_UNDER_64_MIB_GATE');
          JS
      - name: Publish isolated worker canary only (NOT the .com or www production domains)
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec wrangler deploy --config wrangler.canary.jsonc --minify --no-upload-source-maps > "$RUNNER_TEMP/full-canary-publish.log" 2>&1 || {
            echo "::error::CLOUDFLARE_CANARY_PUBLISH_FAILED";
            tail -n 30 "$RUNNER_TEMP/full-canary-publish.log" | sed -E 's/(sb_publishable_|eyJ)[A-Za-z0-9_.-]{20,}/[REDACTED]/g';
            exit 1;
          }
          echo 'CLOUDFLARE_STATIC_GATEWAY_CANARY_DEPLOYED_SERVICE_BOUND_NO_MAIN_DOMAIN'
      - name: Probe live Cloudflare canary and R2 range reads without user login or financial writes
        shell: bash
        run: |
          set -Eeuo pipefail
          HOST='https://lingxifield-com-static-gateway-canary-20261107.3078024889.workers.dev'
          code="$(curl --silent --max-time 12 --output /dev/null --write-out '%{http_code}' "$HOST/api/health" || true)"
          echo "STATIC_GATEWAY_BACKEND_HEALTH_SEPARATE_NOT_ATTESTED:$code"
          # No payment/ledger or auth mutation is made. This public-only release
          # does not declare the legacy backend healthy.
          for row in '/ 200' '/tools 200' '/siai 200'; do
            path="${row% *}"; expected="${row##* }"
            code="$(curl --silent --max-time 30 --output /dev/null --write-out '%{http_code}' "$HOST$path" || true)"
            echo "CANARY_ROUTE:$path:$code"
            [ "$code" = "$expected" ] || { echo "::error::CANARY_ROUTE_NOT_READY:$path"; exit 1; }
          done
          # Dynamic authentication is checked separately. 503 is a recorded
          # blocker, not an acceptable substitute for a real 401.
          for path in /api/sasi/account /api/tools/jobs; do
            code="$(curl --silent --max-time 20 --output /dev/null --write-out '%{http_code}' "$HOST$path" || true)"
            echo "CANARY_DYNAMIC_ANON_DIAGNOSTIC:$path:$code"
            if [ "$code" != 401 ] && [ "$code" != 500 ] && [ "$code" != 503 ]; then
              echo "::error::CANARY_DYNAMIC_ANON_UNEXPECTED:$path:$code"; exit 1
            fi
            [ "$code" = 401 ] || echo "::warning::CANARY_DYNAMIC_ANON_NOT_ATTESTED:$path:$code"
          done
          header="$(mktemp)"
          trap 'rm -f "$header"' EXIT
          curl --silent --max-time 40 --range 0-1023 --dump-header "$header" --output /dev/null "$HOST/runtime/food-onnx/ort-wasm-simd-threaded.asyncify.wasm"
          grep -Eiq '^HTTP/[0-9.]+ 206' "$header" || { echo "::error::CANARY_R2_BYTES_RANGE_NOT_206"; exit 1; }
          grep -Eiq '^content-range: bytes 0-1023/26861777' "$header" || { echo "::error::CANARY_R2_CONTENT_RANGE_INVALID"; exit 1; }
          # Pin public pages to Next's proven prerendered artifacts. Run repeated HTTP probes
          # because earlier full Worker releases returned intermittent 1102 (CPU/memory) and 1101.
          for path in /siai /tools /sasi /sasi/pricing /api/public/siai-widget /api/public/site-status /tools/pdf-editor /tools/e-sign-pdf /tools/pdf-merge-split /tools/pdf-to-jpg; do
            for attempt in 1 2 3 4; do
              got="$(curl --silent --show-error --max-time 25 -H 'Cache-Control: no-cache' --output /dev/null --write-out '%{http_code}' "$HOST$path?real-accept=$attempt" || true)"
              echo "STATIC_FREE_CANARY_REPEAT:$path:$attempt:$got"
              [ "$got" = 200 ] || { echo "::error::FREE_CANARY_INTERMITTENT_FAILURE:$path:$attempt:$got"; exit 1; }
            done
          done
          # Verify actual on-wire HTML is identical to the prerendered files.
          # A 200 from SSR alone cannot establish that asset-first routing works.
          for slug in index tools siai sasi sasi/pricing; do
            path="/$slug"
            [ "$slug" = index ] && path="/"
            tmp="$(mktemp)"
            curl --silent --show-error --fail --max-time 35 \
              -H 'Accept-Encoding: identity' "$HOST$path" -o "$tmp"
            expected="$(sha256sum ".next/server/app/$slug.html" | awk '{print $1}')"
            actual="$(sha256sum "$tmp" | awk '{print $1}')"
            rm -f "$tmp"
            test "$actual" = "$expected" || { echo "::error::HTML_ASSET_NOT_DIRECTLY_SERVED:$path"; exit 1; }
            echo "COM_CLOUDFLARE_DIRECT_HTML_ASSET_SHA256_PASS:$path"
          done
          # The public widget MUST be delivered byte-for-byte as static JSON,
          # even when an /api/* wildcard normally invokes the Worker.
          tmp_json="$(mktemp)"
          tmp_hdr="$(mktemp)"
          curl --silent --show-error --fail --max-time 35 \
            -H 'Accept-Encoding: identity' -D "$tmp_hdr" \
            "$HOST/api/public/siai-widget" -o "$tmp_json"
          src_json=''
          for cand in .next/server/app/api/public/siai-widget/route.body .next/server/app/api/public/siai-widget.body .next/server/app/api/public/siai-widget/route.json; do
            if [ -f "$cand" ]; then src_json="$cand"; break; fi
          done
          [ -n "$src_json" ] || { echo "::error::SOURCE_WIDGET_JSON_MISSING"; exit 1; }
          test "$(sha256sum "$src_json" | awk '{print $1}')" = "$(sha256sum "$tmp_json" | awk '{print $1}')" || {
            echo "::error::PUBLIC_WIDGET_NOT_DIRECT_ASSET"; exit 1;
          }
          grep -Eiq '^content-type: application/json' "$tmp_hdr" || {
            echo "::error::STATIC_WIDGET_MIME_INVALID"; exit 1;
          }
          grep -Eiq '^access-control-allow-origin: \*' "$tmp_hdr" || {
            echo "::error::STATIC_WIDGET_CORS_MISSING"; exit 1;
          }
          rm -f "$tmp_json" "$tmp_hdr"
          # Demonstrate actual asset-first delivery for four representative
          # client-side PDF tools, including the former mobile HTTP 503 path.
          for slug in pdf-editor e-sign-pdf pdf-merge-split pdf-to-jpg; do
            file=".next/server/app/tools/$slug.html"
            tmp_tool="$(mktemp)"
            curl --silent --show-error --fail --max-time 35 \
              -H 'Accept-Encoding: identity' "$HOST/tools/$slug" -o "$tmp_tool"
            test "$(sha256sum "$file" | awk '{print $1}')" = "$(sha256sum "$tmp_tool" | awk '{print $1}')" || {
              echo "::error::PUBLIC_TOOL_NOT_DIRECT_STATIC_ASSET:$slug"; exit 1;
            }
            rm -f "$tmp_tool"
            echo "COM_TOOL_DIRECT_HTML_SHA256_PASS:$slug"
          done
          echo COM_PUBLIC_WIDGET_BYTES_AND_JSON_MIME_DIRECT_ASSET_PASS
          tmp_status="$(mktemp)"
          tmp_status_hdr="$(mktemp)"
          curl --silent --show-error --fail --max-time 35 \
            -H 'Accept-Encoding: identity' -D "$tmp_status_hdr" \
            "$HOST/api/public/site-status" -o "$tmp_status"
          node - "$tmp_status" <<'JS'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(p.publicSurface!=='ready'||p.scope!=='public-maintenance-assets-only'||
             p.dynamicBackend!=='not-attested'||p.payments!=='not-attested'||
             p.sasi!=='not-attested'||p.realLogin!=='not-attested')
            throw Error('PUBLIC_STATUS_MISREPRESENTS_RUNTIME');
          console.log('COM_PUBLIC_ONLY_STATUS_NO_DYNAMIC_SUCCESS_CLAIMS_PASS');
          JS
          test "$(sha256sum .open-next/assets/api/public/site-status | awk '{print $1}')" = "$(sha256sum "$tmp_status" | awk '{print $1}')" || {
            echo "::error::PUBLIC_STATUS_NOT_DIRECTLY_SERVED"; exit 1;
          }
          grep -Eiq '^content-type: application/json' "$tmp_status_hdr" || {
            echo "::error::PUBLIC_STATUS_JSON_MIME_MISSING"; exit 1;
          }
          rm -f "$tmp_status" "$tmp_status_hdr"
          echo COM_STATIC_PUBLIC_STATUS_DIRECT_ASSET_SHA256_PASS
          # Dynamic backend health remains a separate diagnostic and is NOT
          # treated as successful merely because public assets are available.
          dyn_status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$HOST/api/health" || true)"
          echo "COM_DYNAMIC_RUNTIME_HEALTH_DIAGNOSTIC_ONLY:$dyn_status"
          echo COM_DYNAMIC_BACKEND_NOT_ACCEPTED_BY_PUBLIC_ONLY_RELEASE
