name: CN3195 exact standalone build and immutable staging release
on:
  push:
    branches: [release/cn3194-payment-integrated-20261110]
    paths:
      - '.github/workflows/cn3195-release-build-20261110.yml'
      - 'scripts/ops/ecs-cn3195-unified-standalone-upgrade-20261110.template.sh'
      - 'scripts/ops/cn-payment-activate-3195-20261110.template.sh'
      - 'scripts/ops/cn-payment-signed-live-probe-20261110.mjs'
      - 'scripts/ops/R2-CN3195-Transfer-20261110.template.ps1'
      - 'tests/cn3195-release-templates-20261110.test.mjs'
      - 'app/api/pay/**'
      - 'app/api/sasi/marketplace/**'
      - 'app/api/sasi/software/**'
      - 'app/checkout/**'
      - 'app/checkout-usd/**'
      - 'components/SasiOpenMarketplace.tsx'
      - 'lib/alipay.ts'
      - 'lib/paypal.ts'
      - 'lib/wechatpay.ts'
      - 'lib/sasi-marketplace/**'
      - 'lib/sasi-software/**'
      - 'lib/tools/commerce/**'
      - 'supabase/migrations/20261110*.sql'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: cn3195-exact-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/release/cn3194-payment-integrated-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen dependencies and run payment, marketplace and money contracts
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile
          bash -n scripts/ops/cn-payment-activate-3195-20261110.template.sh
          bash -n scripts/ops/ecs-cn3195-unified-standalone-upgrade-20261110.template.sh
          node --check scripts/ops/cn-payment-signed-live-probe-20261110.mjs
          node --test tests/cn3195-release-templates-20261110.test.mjs
          node --test tests/cn-payment-activation-3194-20261110.test.mjs tests/cn-wallet-checkout-entry-20261108.test.mjs tests/cn-toolpass-public-ui-20261108.test.mjs tests/sasi-software-paypal-fulfillment-contract.test.mjs tests/paypal-merchant-idempotency-20261108.test.mjs tests/sasi-marketplace-security-contract.test.mjs tests/cn3194-source-only-software-catalog.test.mjs tests/cn3194-marketplace-readiness-gates.test.mjs
          python3 -m py_compile scripts/marketplace/scan-private-zip.py
          python3 -m unittest discover -s tests/marketplace -p 'test_*.py' -v
          node --test tests/com-admin-facade.test.mjs tests/tool-pass-server-http-contract.test.mjs
          node --test tests/unified-tools-pass-static-contract.test.mjs
          node scripts/test-money-reconcile-results.cjs
          node scripts/test-money-progress-api.cjs
          node --test tests/release/site-announcements-contract.test.mjs
          pnpm exec tsc --noEmit
      - name: Build exact Linux standalone application
        env:
          LINGXI_SELFHOST_BUILD: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: https://lingxifield.cn
          NEXT_PUBLIC_TOOL_PASS_ENFORCED: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
        run: |
          set -Eeuo pipefail
          pnpm build
          test -s .next/standalone/server.js
          test -s .next/BUILD_ID
          install -d .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          cp -a public .next/standalone/public
          cp .next/BUILD_ID .next/standalone/.next/BUILD_ID
          cp scripts/ops/cn-payment-signed-live-probe-20261110.mjs .next/standalone/cn-payment-signed-live-probe.mjs
          SHORT="${GITHUB_SHA:0:12}"
          TAG="ecs-cn-unified-20261110-$SHORT"
          python3 - "$GITHUB_SHA" "$RUNNER_TEMP/cn-payment-activate.sh" <<'PY'
          import sys
          from pathlib import Path
          sha=sys.argv[1]
          short=sha[:12]
          tag="ecs-cn-unified-20261110-"+short
          p=Path("scripts/ops/cn-payment-activate-3195-20261110.template.sh")
          s=p.read_text().replace("__SHORT__",short).replace("__TAG__",tag)
          if "__SHORT__" in s or "__TAG__" in s: raise SystemExit("UNRESOLVED_PAYMENT_SCRIPT_TEMPLATE")
          Path(sys.argv[2]).write_text(s)
          PY
          cp "$RUNNER_TEMP/cn-payment-activate.sh" .next/standalone/cn-payment-activate.sh
          printf '%s\n' "${GITHUB_SHA}" > .next/standalone/RELEASE_SOURCE_SHA
          test -s .next/standalone/cn-payment-signed-live-probe.mjs
          test -s .next/standalone/cn-payment-activate.sh
          echo CN3195_STANDALONE_BUILD_PASS
      - name: Real loopback smoke and authorization boundary
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
          NEXT_PUBLIC_TOOL_PASS_ENFORCED: 'true'
        run: |
          set -Eeuo pipefail
          cd .next/standalone
          HOSTNAME=127.0.0.1 PORT=33195 NODE_ENV=production node server.js > "$RUNNER_TEMP/cn33195.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 55); do
            if curl --noproxy '*' --silent --max-time 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:33195/api/health | grep -qx 200; then ready=1;break;fi
            sleep 1
          done
          [ "$ready" = 1 ] || { cat "$RUNNER_TEMP/cn33195.log"; echo STANDALONE_HEALTH_NOT_READY;exit 1; }
          for path in / /tools /siai /sasi /sasi/marketplace /announcements /tools/pass /ai-wallet /account;do
            code="$(curl --noproxy '*' --silent --max-time 20 -o /dev/null -w '%{http_code}' "http://127.0.0.1:33195$path" || true)"
            echo "PUBLIC_LOCAL_ROUTE:$path:$code"
            [ "$code" = 200 ] || exit 1
          done
          for path in /api/sasi/account /api/tools/jobs;do
            code="$(curl --noproxy '*' --silent --max-time 20 -o /dev/null -w '%{http_code}' "http://127.0.0.1:33195$path" || true)"
            echo "ANON_AUTH_BOUNDARY:$path:$code"
            [ "$code" = 401 ] || exit 1
          done
          echo CN3195_LOOPBACK_AND_ANON_BOUNDARY_PASS_NO_PAYMENT
      - name: Real desktop and mobile browser visual gate
        run: |
          set -Eeuo pipefail
          pnpm exec playwright install --with-deps chrome
          pnpm exec playwright test -c playwright.final.config.ts --project=desktop-chromium --project=mobile-chromium --workers=2 tests/final-closure/dual-premium-new-visual.spec.ts
          echo CN3195_DESKTOP_MOBILE_VISUAL_PASS
      - name: Package exact source archive and render pinned operations scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          SHORT="${GITHUB_SHA:0:12}"
          TAG="ecs-cn-unified-20261110-$SHORT"
          FILE="cn-20261110-unified-standalone.tar.gz"
          CHECK="cn-20261110-unified-standalone.sha256"
          UPGRADE_NAME="ecs-cn3195-unified-standalone-upgrade-20261110.sh"
          PAYMENT_NAME="cn-payment-activate-3195-20261110.sh"
          PS_NAME="R2-CN3195-Transfer-20261110.ps1"
          mkdir -p dist
          tar -C .next/standalone -czf "dist/$FILE" .
          sha256sum "dist/$FILE" > "dist/$CHECK"
          ARCHIVE_SHA="$(sha256sum "dist/$FILE" | awk '{print $1}')"
          ARCHIVE_BYTES="$(stat -c '%s' "dist/$FILE")"
          CHECK_SHA="$(sha256sum "dist/$CHECK" | awk '{print $1}')"
          CHECK_BYTES="$(stat -c '%s' "dist/$CHECK")"
          test "$CHECK_BYTES" = 104
          export SHORT TAG FILE CHECK UPGRADE_NAME PAYMENT_NAME PS_NAME ARCHIVE_SHA ARCHIVE_BYTES CHECK_SHA
          cp "$RUNNER_TEMP/cn-payment-activate.sh" "dist/$PAYMENT_NAME"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(".")
          short=os.environ["SHORT"];tag=os.environ["TAG"]
          repl={
            "__SHORT__":short,"__TAG__":tag,"__SOURCE_SHA__":os.environ["GITHUB_SHA"],
            "__ARCHIVE_SHA__":os.environ["ARCHIVE_SHA"],"__ARCHIVE_BYTES__":os.environ["ARCHIVE_BYTES"],
            "__ARCHIVE_FILE__":os.environ["FILE"],"__CHECK_FILE__":os.environ["CHECK"],
            "__CHECK_SHA__":os.environ["CHECK_SHA"]
          }
          def render(src,dst,extra=None):
            s=(root/src).read_text()
            for k,v in repl.items():s=s.replace(k,v)
            for k,v in (extra or {}).items():s=s.replace(k,v)
            unresolved=[k for k in repl if k in s]
            if unresolved:raise SystemExit("UNRESOLVED_TEMPLATE:"+str(unresolved))
            (root/"dist"/dst).write_text(s,encoding="utf-8")
          render("scripts/ops/ecs-cn3195-unified-standalone-upgrade-20261110.template.sh",os.environ["UPGRADE_NAME"])
          up=root/"dist"/os.environ["UPGRADE_NAME"]
          pay=root/"dist"/os.environ["PAYMENT_NAME"]
          extra={
            "__UPGRADE_NAME__":os.environ["UPGRADE_NAME"],"__PAYMENT_NAME__":os.environ["PAYMENT_NAME"],
            "__UPGRADE_SHA__":hashlib.sha256(up.read_bytes()).hexdigest(),"__UPGRADE_BYTES__":str(up.stat().st_size),
            "__PAYMENT_SHA__":hashlib.sha256(pay.read_bytes()).hexdigest(),"__PAYMENT_BYTES__":str(pay.stat().st_size)
          }
          render("scripts/ops/R2-CN3195-Transfer-20261110.template.ps1",os.environ["PS_NAME"],extra)
          PY
          bash -n "dist/$UPGRADE_NAME"
          bash -n "dist/$PAYMENT_NAME"
          node --check scripts/ops/cn-payment-signed-live-probe-20261110.mjs
          tar -tzf "dist/$FILE" > dist/archive.manifest
          grep -Fxq './server.js' dist/archive.manifest
          grep -Fxq './RELEASE_SOURCE_SHA' dist/archive.manifest
          grep -Fxq './cn-payment-signed-live-probe.mjs' dist/archive.manifest
          grep -Fxq './cn-payment-activate.sh' dist/archive.manifest
          if grep -Eq '(^/|(^|/)\.\.(/|$))' dist/archive.manifest;then exit 1;fi
          test "$(tar -xOzf "dist/$FILE" ./RELEASE_SOURCE_SHA | tr -d '\r\n')" = "$GITHUB_SHA"
          test "$ARCHIVE_BYTES" -lt 1300000000
          UPGRADE_SHA="$(sha256sum "dist/$UPGRADE_NAME"|awk '{print $1}')"
          PAYMENT_SHA="$(sha256sum "dist/$PAYMENT_NAME"|awk '{print $1}')"
          cat > dist/CN3195-RELEASE-MANIFEST.txt <<EOF
          source_sha=$GITHUB_SHA
          release_tag=$TAG
          archive=$FILE
          archive_sha256=$ARCHIVE_SHA
          archive_bytes=$ARCHIVE_BYTES
          checksum_sha256=$CHECK_SHA
          upgrade_script=$UPGRADE_NAME
          upgrade_sha256=$UPGRADE_SHA
          payment_script=$PAYMENT_NAME
          payment_sha256=$PAYMENT_SHA
          powershell_transfer=$PS_NAME
          deployment_target=Alibaba Cloud ECS CN
          blue_green_candidate_port=3195
          previous_upstream=3193_or_3194
          payment_flags=closed_until_signed_live_audit
          sasi_software_sales=closed_until_real_private_source_zip_uploaded_and_hash_verified
          status=STAGING_ONLY_NOT_DEPLOYED
          EOF
          echo "CN3195_ARCHIVE_SHA256=$ARCHIVE_SHA"
          echo "CN3195_ARCHIVE_BYTES=$ARCHIVE_BYTES"
          echo "CN3195_RELEASE_TAG=$TAG"
      - name: Upload immutable release candidate assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cn3195-release-${{ github.sha }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/release/cn3194-payment-integrated-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and verify exact release assets
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/cn3195-release"
          gh run download "$GITHUB_RUN_ID" --repo "$GH_REPO" --name "cn3195-release-${GITHUB_SHA}" --dir "$RUNNER_TEMP/cn3195-release"
          cd "$RUNNER_TEMP/cn3195-release"
          grep -Fxq "source_sha=$GITHUB_SHA" CN3195-RELEASE-MANIFEST.txt
          grep -Fxq "status=STAGING_ONLY_NOT_DEPLOYED" CN3195-RELEASE-MANIFEST.txt
          sha256sum -c cn-20261110-unified-standalone.sha256
          test "$(tar -xOzf cn-20261110-unified-standalone.tar.gz ./RELEASE_SOURCE_SHA | tr -d '\r\n')" = "$GITHUB_SHA"
          bash -n ecs-cn3195-unified-standalone-upgrade-20261110.sh
          bash -n cn-payment-activate-3195-20261110.sh
      - name: Publish immutable GitHub prerelease (no ECS, Nginx or payment mutation)
        run: |
          set -Eeuo pipefail
          tag="ecs-cn-unified-20261110-${GITHUB_SHA:0:12}"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1;then
            echo "::error::EXACT_RELEASE_TAG_ALREADY_EXISTS";exit 1
          fi
          cd "$RUNNER_TEMP/cn3195-release"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Exact SHA build, payment and marketplace regression, TypeScript, Next standalone, loopback auth and desktop/mobile visual tests passed.
          This is a staging prerelease only. It has not been deployed to ECS.
          Download R2-CN3195-Transfer-20261110.ps1 to D:\30780\lingxi-quantum and run it with the existing D:\LINGXIFIELDCN3192\rclone.conf.
          The script uploads the exact release to private R2 and generates a short-lived signed-URL ECS script.
          The ECS script stages on 3195 while the currently routed 3193/3194 service remains live, then promotes with rollback.
          Payment flags remain closed until Alipay, WeChat and PayPal Live signed no-charge probes all pass.
          The SASI source-only software SKU remains closed until the real private source ZIP is uploaded and SHA-256 verified.
          EOF
          gh release create "$tag" \
            cn-20261110-unified-standalone.tar.gz \
            cn-20261110-unified-standalone.sha256 \
            ecs-cn3195-unified-standalone-upgrade-20261110.sh \
            cn-payment-activate-3195-20261110.sh \
            R2-CN3195-Transfer-20261110.ps1 \
            CN3195-RELEASE-MANIFEST.txt \
            --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease \
            --title "LINGXIFIELD CN3195 payment-integrated exact source ${GITHUB_SHA:0:12} - STAGING ONLY" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "CN3195_IMMUTABLE_PRERELEASE_PUBLISHED_NOT_DEPLOYED:$tag"
