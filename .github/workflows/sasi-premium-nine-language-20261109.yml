name: SASI premium 9-language, 5k details and media invariants (NO DEPLOY)
on:
  push:
    branches: [feat/sasi-premium-nine-language-20261109]
  pull_request:
    branches: [release/com-sasi-full-20261108]
    paths:
      - 'components/SasiOpenMarketplace.tsx'
      - 'components/SasiMarketplaceProductDetail.tsx'
      - 'lib/sasi-software/ui-copy.ts'
      - 'tests/sasi-premium-nine-language-20261109.test.mjs'
      - 'tests/sasi-marketplace-long-description-20261109.test.mjs'
      - 'tests/sasi-software-public-branding-20261108.test.mjs'
      - '.github/workflows/sasi-premium-nine-language-20261109.yml'
permissions:
  contents: read
concurrency:
  group: sasi-premium-i18n-${{ github.ref }}
  cancel-in-progress: true
jobs:
  premium-locale-and-production-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      LINGXI_SELFHOST_BUILD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.cn
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.28.0,run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc,cache: pnpm}
      - name: Install pinned packages
        run: pnpm install --frozen-lockfile
      - name: Verify marketplace visuals, nine languages, payment protection and source-only products
        run: |
          node --test tests/sasi-premium-nine-language-20261109.test.mjs
          node --test tests/sasi-marketplace-long-description-20261109.test.mjs
          node --test tests/sasi-software-public-branding-20261108.test.mjs
          node --test tests/sasi-marketplace-one-cover-four-details-20261109.test.mjs
          node --test tests/sasi-marketplace-review-security-20261108.test.mjs
          node --test tests/sasi-software-verified-fulfillment-20261108.test.mjs
          node tests/sasi-marketplace-security-contract.test.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Full standalone production build without deployment
        run: |
          pnpm build
          test -s .next/standalone/server.js
          echo SASI_PREMIUM_NINE_LANGUAGE_100K_BUILD_PASS_NO_DEPLOY
