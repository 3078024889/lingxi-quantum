name: COM production payment and delivery readiness audit (READ ONLY)
on:
  push:
    branches: [ops/com-production-payment-audit-20261110]
    paths:
      - '.github/workflows/com-production-payment-audit-20261110.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: com-production-payment-readiness-audit
  cancel-in-progress: false
jobs:
  audit:
    environment: cloudflare-production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
      ALIPAY_APP_ID: ${{ secrets.ALIPAY_APP_ID }}
      ALIPAY_PRIVATE_KEY: ${{ secrets.ALIPAY_PRIVATE_KEY }}
      ALIPAY_PUBLIC_KEY: ${{ secrets.ALIPAY_PUBLIC_KEY }}
      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_MCH_ID: ${{ secrets.WECHAT_MCH_ID }}
      WECHAT_API_V3_KEY: ${{ secrets.WECHAT_API_V3_KEY }}
      WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
      WECHAT_CERT_SERIAL_NO: ${{ secrets.WECHAT_CERT_SERIAL_NO }}
      WECHAT_PLATFORM_PUBLIC_KEY: ${{ secrets.WECHAT_PLATFORM_PUBLIC_KEY }}
      WECHAT_PLATFORM_PUBLIC_KEY_ID: ${{ secrets.WECHAT_PLATFORM_PUBLIC_KEY_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_SASI_ARTIFACTS: ${{ secrets.R2_BUCKET_SASI_ARTIFACTS }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Audit actual COM production Worker bindings and public provider diagnostics without mutation
        run: |
          node --input-type=module <<'NODE'
          import { createPrivateKey, createPublicKey, sign, verify } from "node:crypto";
          const worker = "lingxifield-com-celestial-20261109";
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const present = value => typeof value === "string" && value.trim().length > 0;
          const emit = (key, value) => console.log(key + "=" + String(value));
          if (!present(account) || !present(token)) throw Error("CLOUDFLARE_READ_ONLY_AUDIT_CREDENTIALS_MISSING");
          const scriptBase = "https://api.cloudflare.com/client/v4/accounts/" + encodeURIComponent(account) + "/workers/scripts/";
          const base = scriptBase + worker;
          const response = await fetch(base + "/settings", {
            headers: { authorization: "Bearer " + token },
            signal: AbortSignal.timeout(25000)
          });
          const payload = await response.json().catch(() => null);
          if (!response.ok || payload?.success !== true || !Array.isArray(payload.result?.bindings)) {
            throw Error("COM_PRODUCTION_WORKER_SETTINGS_READ_FAILED_HTTP_" + response.status);
          }
          const bindings = payload.result.bindings;
          const byName = new Map(bindings.map(binding => [binding.name, binding]));
          const secretGroups = {
            PAYPAL: ["PAYPAL_CLIENT_ID", "PAYPAL_CLIENT_SECRET", "PAYPAL_WEBHOOK_ID"],
            ALIPAY: ["ALIPAY_APP_ID", "ALIPAY_PRIVATE_KEY", "ALIPAY_PUBLIC_KEY"],
            WECHAT: ["WECHAT_APP_ID", "WECHAT_MCH_ID", "WECHAT_API_V3_KEY", "WECHAT_PRIVATE_KEY", "WECHAT_CERT_SERIAL_NO", "WECHAT_PLATFORM_PUBLIC_KEY", "WECHAT_PLATFORM_PUBLIC_KEY_ID"],
            PRIVATE_R2: ["R2_ENDPOINT", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY", "R2_BUCKET_SASI_ARTIFACTS"]
          };
          emit("COM_AUDIT_WORKER", worker);
          for (const [group, names] of Object.entries(secretGroups)) {
            const workerMissing = names.filter(name => !byName.has(name));
            const githubMissing = names.filter(name => !present(process.env[name]));
            emit("COM_WORKER_" + group + "_SECRETS_PRESENT", workerMissing.length === 0);
            emit("COM_WORKER_" + group + "_MISSING_NAMES", workerMissing.join(","));
            emit("COM_GITHUB_" + group + "_SECRETS_PRESENT", githubMissing.length === 0);
            emit("COM_GITHUB_" + group + "_MISSING_NAMES", githubMissing.join(","));
          }
          const adminReady = byName.has("SUPABASE_SECRET_KEY") || byName.has("SUPABASE_SERVICE_ROLE_KEY");
          emit("COM_WORKER_SUPABASE_ADMIN_SECRET_PRESENT", adminReady);
          const flags = [
            "PAYPAL_ENABLED", "ALIPAY_ENABLED", "WECHAT_ENABLED",
            "TOOL_PASS_COMMERCE_READY", "TOOL_PASS_BACKEND_READY",
            "SASI_MARKET_UPLOADS_ENABLED", "SASI_MARKET_SALES_ENABLED",
            "SASI_MARKET_DELIVERY_ENABLED", "SASI_MARKET_PAYOUTS_ENABLED",
            "SASI_MARKETPLACE_COMMERCE_READY", "SOFTWARE_COMMERCE_READY"
          ];
          for (const name of flags) {
            const binding = byName.get(name);
            emit("COM_WORKER_FLAG_" + name, binding?.type === "plain_text" && binding.text === "true");
          }
          const paypalEnv = byName.get("PAYPAL_ENV");
          emit("COM_WORKER_PAYPAL_ENV", paypalEnv?.type === "plain_text" ? paypalEnv.text : "MISSING_OR_NOT_PLAIN_TEXT");
          // Locate any credentials the owner may have installed on a retired/alternate Worker.
          // Read only binding names and boolean flags; never read or emit secret values.
          for (const legacyWorker of [
            "lingxifield-com-unified-20261108",
            "lingxifield-com-static-gateway-canary-20261107",
            "lingxifield-com-main-20261108",
            "lingxifield-com-public-r2-relay-20261108"
          ]) {
            const legacyResponse = await fetch(scriptBase + legacyWorker + "/settings", {
              headers: { authorization: "Bearer " + token },
              signal: AbortSignal.timeout(20000)
            });
            const legacyJson = await legacyResponse.json().catch(() => null);
            emit("COM_ALT_WORKER_" + legacyWorker + "_HTTP", legacyResponse.status);
            if (!legacyResponse.ok || legacyJson?.success !== true || !Array.isArray(legacyJson.result?.bindings)) continue;
            const legacyBindings = legacyJson.result.bindings;
            const legacyNames = new Set(legacyBindings.map(binding => binding.name));
            for (const [group, names] of Object.entries(secretGroups)) {
              emit("COM_ALT_WORKER_" + legacyWorker + "_" + group + "_SECRETS_PRESENT",
                names.every(name => legacyNames.has(name)));
            }
            for (const flag of ["PAYPAL_ENABLED", "ALIPAY_ENABLED", "WECHAT_ENABLED", "TOOL_PASS_COMMERCE_READY", "SOFTWARE_COMMERCE_READY"]) {
              const binding = legacyBindings.find(item => item.name === flag);
              emit("COM_ALT_WORKER_" + legacyWorker + "_FLAG_" + flag,
                binding?.type === "plain_text" && binding.text === "true");
            }
            emit("COM_ALT_WORKER_" + legacyWorker + "_SUPABASE_ADMIN_SECRET_PRESENT",
              legacyNames.has("SUPABASE_SECRET_KEY") || legacyNames.has("SUPABASE_SERVICE_ROLE_KEY"));
            const legacyPaypalEnv = legacyBindings.find(item => item.name === "PAYPAL_ENV");
            emit("COM_ALT_WORKER_" + legacyWorker + "_PAYPAL_ENV",
              legacyPaypalEnv?.type === "plain_text" ? legacyPaypalEnv.text : "MISSING_OR_NOT_PLAIN_TEXT");
          }
          const publicStatus = await fetch("https://lingxifield.com/api/pay/providers?__audit=" + Date.now(), {
            cache: "no-store",
            headers: { accept: "application/json" },
            signal: AbortSignal.timeout(20000)
          });
          const publicJson = await publicStatus.json().catch(() => null);
          emit("COM_PUBLIC_PROVIDER_ENDPOINT_HTTP", publicStatus.status);
          if (publicStatus.ok && publicJson) {
            for (const name of ["paypal", "alipay", "wechat"]) {
              emit("COM_PUBLIC_" + name.toUpperCase() + "_ENABLED", publicJson[name] === true);
              emit("COM_PUBLIC_" + name.toUpperCase() + "_CONFIGURED", publicJson.diagnostics?.[name]?.configured === true);
              emit("COM_PUBLIC_" + name.toUpperCase() + "_MISSING_COUNT", publicJson.diagnostics?.[name]?.missingCount ?? "UNKNOWN");
            }
          } else {
            emit("COM_PUBLIC_PROVIDER_DIAGNOSTICS", "UNAVAILABLE");
          }
          // Cryptographic shape checks use only ephemeral local challenges; no payment/order is created.
          try {
            if (present(process.env.ALIPAY_PRIVATE_KEY) && present(process.env.ALIPAY_PUBLIC_KEY)) {
              const privateKey = createPrivateKey(process.env.ALIPAY_PRIVATE_KEY.replace(/\\n/g, "\n"));
              const publicKey = createPublicKey(process.env.ALIPAY_PUBLIC_KEY.replace(/\\n/g, "\n"));
              const challenge = Buffer.from("LINGXIFIELD-COM-ALIPAY-KEY-PAIR-CHECK-20261110");
              const signature = sign("RSA-SHA256", challenge, privateKey);
              emit("COM_ALIPAY_RSA_KEY_PAIR_MATCH", verify("RSA-SHA256", challenge, publicKey, signature));
            } else emit("COM_ALIPAY_RSA_KEY_PAIR_MATCH", "NOT_TESTED_MISSING_GITHUB_SECRET");
          } catch { emit("COM_ALIPAY_RSA_KEY_PAIR_MATCH", false); }
          try {
            if (present(process.env.WECHAT_PRIVATE_KEY) && present(process.env.WECHAT_PLATFORM_PUBLIC_KEY)) {
              createPrivateKey(process.env.WECHAT_PRIVATE_KEY.replace(/\\n/g, "\n"));
              createPublicKey(process.env.WECHAT_PLATFORM_PUBLIC_KEY.replace(/\\n/g, "\n"));
              emit("COM_WECHAT_KEY_FORMATS_VALID", true);
            } else emit("COM_WECHAT_KEY_FORMATS_VALID", "NOT_TESTED_MISSING_GITHUB_SECRET");
            emit("COM_WECHAT_API_V3_KEY_LENGTH_VALID", present(process.env.WECHAT_API_V3_KEY) && Buffer.byteLength(process.env.WECHAT_API_V3_KEY, "utf8") === 32);
          } catch {
            emit("COM_WECHAT_KEY_FORMATS_VALID", false);
            emit("COM_WECHAT_API_V3_KEY_LENGTH_VALID", false);
          }
          // PayPal OAuth and webhook identity are read-only. No order or capture is created.
          try {
            if (present(process.env.PAYPAL_CLIENT_ID) && present(process.env.PAYPAL_CLIENT_SECRET) && present(process.env.PAYPAL_WEBHOOK_ID)) {
              const basic = Buffer.from(process.env.PAYPAL_CLIENT_ID + ":" + process.env.PAYPAL_CLIENT_SECRET).toString("base64");
              const oauth = await fetch("https://api-m.paypal.com/v1/oauth2/token", {
                method: "POST",
                headers: { authorization: "Basic " + basic, "content-type": "application/x-www-form-urlencoded" },
                body: "grant_type=client_credentials",
                signal: AbortSignal.timeout(25000)
              });
              const oauthJson = await oauth.json().catch(() => null);
              emit("COM_PAYPAL_LIVE_OAUTH_HTTP", oauth.status);
              emit("COM_PAYPAL_LIVE_OAUTH_AUTH", oauth.ok && present(oauthJson?.access_token));
              if (oauth.ok && present(oauthJson?.access_token)) {
                const webhook = await fetch("https://api-m.paypal.com/v1/notifications/webhooks/" + encodeURIComponent(process.env.PAYPAL_WEBHOOK_ID), {
                  headers: { authorization: "Bearer " + oauthJson.access_token, accept: "application/json" },
                  signal: AbortSignal.timeout(25000)
                });
                const webhookJson = await webhook.json().catch(() => null);
                const expectedUrl = "https://lingxifield.com/api/pay/paypal/webhook";
                emit("COM_PAYPAL_LIVE_WEBHOOK_HTTP", webhook.status);
                emit("COM_PAYPAL_LIVE_WEBHOOK_URL_MATCH", webhook.ok && webhookJson?.url === expectedUrl);
                emit("COM_PAYPAL_LIVE_WEBHOOK_EVENT_COUNT", Array.isArray(webhookJson?.event_types) ? webhookJson.event_types.length : "UNKNOWN");
              }
            } else {
              emit("COM_PAYPAL_LIVE_OAUTH_AUTH", "NOT_TESTED_MISSING_GITHUB_SECRET");
            }
          } catch { emit("COM_PAYPAL_LIVE_OAUTH_AUTH", false); }
          emit("COM_AUDIT_COMPLETE", "READ_ONLY_NO_ORDER_NO_CHARGE_NO_SECRET_OUTPUT");
          NODE