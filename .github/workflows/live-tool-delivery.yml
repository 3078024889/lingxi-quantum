name: Verify deployed public tool delivery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-tool-delivery
  cancel-in-progress: false
jobs:
  live-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome
      - name: Actual public downloads and anonymous service boundaries
        run: node scripts/audit/verify-v88-live.cjs
        env:
          V88_LIVE_EVIDENCE: test-results/live-tool-delivery
      - name: Both domains and nine-language public routes
        run: node scripts/audit/live-tool-http-v87.cjs
      - name: Preserve real public results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: live-tool-delivery
          path: |
            test-results/
            _local/handoff/tool-runtime-20261015/live-http*
          retention-days: 7
