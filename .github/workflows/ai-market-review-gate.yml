name: AI Market Review Gate
on:
  push:
    branches:
      - 'feature/ai-market-review-gate-*'
    paths:
      - 'lib/ai-market-review-validation.*'
      - 'scripts/ai-market/**'
      - 'lib/ai-market/**'
      - 'lib/ai-market-*.mjs'
      - 'lib/ai-market-*.test.mjs'
      - 'supabase/migrations/*ai_market*'
      - 'app/api/ai-market/**'
      - 'app/ai-market/**'
      - 'components/ai-market/**'
      - 'docs/AI_MARKET_TOTAL_PACKAGE_*.md'
      - '.github/workflows/ai-market-review-gate.yml'
  pull_request:
    paths:
      - 'lib/ai-market-review-validation.*'
      - 'scripts/ai-market/**'
      - 'lib/ai-market/**'
      - 'lib/ai-market-*.mjs'
      - 'lib/ai-market-*.test.mjs'
      - 'supabase/migrations/*ai_market*'
      - 'app/api/ai-market/**'
      - 'app/ai-market/**'
      - 'components/ai-market/**'
      - 'docs/AI_MARKET_TOTAL_PACKAGE_*.md'
jobs:
  review-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies with lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: TypeScript integration check
        run: pnpm exec tsc --noEmit
      - name: Review input security contracts
        run: node --test scripts/ai-market/audit-review-gate.test.mjs scripts/ai-market/huggingface-discovery.test.mjs scripts/ai-market/candidate-store.test.mjs scripts/ai-market/import-huggingface.test.mjs lib/ai-market-review-validation.test.mjs lib/ai-market-candidate-query.test.mjs lib/ai-market-candidate-ingest.test.mjs lib/ai-market-review-decision.test.mjs lib/ai-market-entities.test.mjs lib/ai-market-search-core.test.mjs lib/ai-market-data-center.test.mjs scripts/ai-market/data-center-source-adapters.test.mjs scripts/ai-market/data-center-batch.test.mjs lib/ai-market/market-engine.test.mjs lib/ai-market/market-snapshots.test.mjs lib/ai-market/intent-engine.test.mjs lib/ai-market/visibility-engine.test.mjs lib/ai-market/profile-evidence.test.mjs lib/ai-market/vendor-commerce.test.mjs lib/ai-market/i18n-market.test.mjs scripts/ai-market/production-gate-h.test.mjs scripts/ai-market/integration-contracts.test.mjs scripts/ai-market/total-package-preflight.test.mjs lib/ai-market/integration-read.test.mjs lib/ai-market/profile-response.test.mjs lib/ai-market/metric-read.test.mjs lib/ai-market/live-hub.test.mjs lib/ai-market/market-ui-copy.test.mjs lib/ai-market/payment-settlement-gate.test.mjs scripts/ai-market/supabase-candidate-import.test.mjs
      - name: Source-only total package preflight\n        run: node scripts/ai-market/total-package-preflight.mjs\n      - name: Validate safe nonpublishable example
        run: |
          node scripts/ai-market/audit-review-gate.mjs scripts/ai-market/review-snapshot.example.json
