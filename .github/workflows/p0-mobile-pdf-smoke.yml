name: LINGXIFIELD P0 Mobile PDF & SIAI Smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingxifield-p0-mobile-pdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p0-mobile-pdf:
    # Avoid billing four browser suites after every .com-only preview edit.
    # Run manually on exact reviewed commit before promotion.
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'infra/com-cloudflare-readiness-20261106' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Use pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Build actual production server
        run: pnpm build
      - name: Install Chrome media runtime
        run: bash scripts/ci/ensure-chrome.sh
      - name: Mobile Chromium real PDF and SIAI smoke
        run: >-
          pnpm exec playwright test -c playwright.final.config.ts
          --project=mobile-chromium --workers=1
          tests/final-closure/pdf-real-delivery-next.spec.ts
          tests/final-closure/pdf-overlay-resize.spec.ts
          tests/final-closure/pdf-original-text-quick-edit.spec.ts
          tests/final-closure/pdf-native-export-reopen.spec.ts
          tests/final-closure/pdf-native-image-ui.spec.ts
          tests/final-closure/siai-market-ui.spec.ts
      - name: Upload mobile Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: lingxifield-p0-mobile-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
