name: Vercel WeChat configuration names only (read only)
on:
  push:
    branches: [fix/dual-payment-verified-enable-20261110]
    paths: ['.github/workflows/vercel-wechat-metadata-20261110.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VERCEL_READ_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_API_TOKEN || secrets.VERCEL_ACCESS_TOKEN }}
    steps:
      - name: Report only relevant variable names and IDs; never decrypt values
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.VERCEL_READ_TOKEN;
          if(!token){console.log('VERCEL_CI_AUTH_NOT_CONFIGURED_NO_CHANGES');process.exit(0);}
          const response=await fetch('https://api.vercel.com/v10/projects/prj_R2HMsUOG4DL0AK3kaHmOrcTpBT9f/env?decrypt=false&teamId=team_Bn6lqQau6e7MTvJ0JE4q8NkS',{
            headers:{Authorization:'Bearer '+token},redirect:'error',signal:AbortSignal.timeout(20000)
          });
          if(!response.ok){console.log('VERCEL_METADATA_HTTP_'+response.status);process.exit(1);}
          const data=await response.json();
          if(!Array.isArray(data.envs))throw Error('INVALID_METADATA_RESPONSE');
          const rows=data.envs.filter(x=>/^WECHAT_|^WX_|^WEIXIN_/i.test(x.key||'')).map(x=>({key:x.key,id:x.id,type:x.type,target:x.target}));
          console.log('WECHAT_VARIABLE_METADATA='+JSON.stringify(rows));
          console.log('NO_VALUES_DECRYPTED_OR_PRINTED_NO_PRODUCTION_CHANGES');
          NODE
