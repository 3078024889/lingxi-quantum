name: Cloudflare Worker 64MiB bundle size source attribution (NO DEPLOY)
on:
  push:
    branches: [cloudflare/com-size-analysis-20261107]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingxi-com-size-analysis
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: 'https://sxsgdpqojepgbbrxrzlq.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2dkcHFvamVwZ2JicnhyemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTc0ODIsImV4cCI6MjA5Nzk5MzQ4Mn0.x4LNnsCvmHsCiRk2HFIsVjg-0ddbTQlkcKpKQFaAdXE' }}
      NEXT_PUBLIC_SITE_URL: 'https://lingxifield.com'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: {version: 11.28.0, run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version-file: .nvmrc, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D @opennextjs/cloudflare@1.20.16 wrangler@4.158.0 --save-exact
      - name: Compile OpenNext and verify eight R2 asset reduction
        run: |
          set -Eeuo pipefail
          pnpm exec opennextjs-cloudflare build
          node scripts/cloudflare/stage-large-public-assets.mjs
          node scripts/cloudflare/stage-r2-public-assets.mjs --audit
          pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundle-size"
      - name: Show exact largest code modules and webpack/esbuild bundle attribution
        run: node scripts/cloudflare/audit-worker-size-20261107.mjs
