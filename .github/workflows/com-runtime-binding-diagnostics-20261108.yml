name: COM runtime binding diagnostics (READ ONLY)
on:
  push:
    branches: [release/com-sasi-full-20261108]
    paths: ['.github/workflows/com-runtime-binding-diagnostics-20261108.yml']
permissions:
  contents: read
jobs:
  inspect:
    environment: cloudflare-production
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Read binding names only and anonymous API results
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const names=['lingxifield-com-full-canary-20261107','lingxifield-com-static-gateway-canary-20261107','lingxifield-com-unified-20261108','lingxifield-com-admin-facade'];
          for(const name of names){
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT}/workers/scripts/${name}/settings`,{headers:{Authorization:`Bearer ${process.env.CF_TOKEN}`},signal:AbortSignal.timeout(20000)});
            const j=await r.json();
            console.log('BINDING_NAMES',name,r.status,JSON.stringify((j.result?.bindings||[]).map(b=>({name:b.name,type:b.type,...(b.type==='service'?{service:b.service}:{}),...(/^(PAYPAL_ENABLED|ALIPAY_ENABLED|WECHAT_ENABLED|SOFTWARE_COMMERCE_READY|SASI_MARKET_\w+_ENABLED|TOOL_PASS_COMMERCE_READY)$/.test(b.name)?{enabled:b.text==='true'}:{})}))));
          }
          for(const name of names.slice(0,3))for(const p of ['/api/pay/providers','/api/money/summary']){
            const r=await fetch(`https://${name}.3078024889.workers.dev${p}`,{redirect:'manual',signal:AbortSignal.timeout(20000)});
            const body=await r.text();
            console.log('ANON_API',name,p,r.status,r.headers.get('cf-ray'),p==='/api/pay/providers'&&r.status===200?body.slice(0,1500):'');
          }
          JS
