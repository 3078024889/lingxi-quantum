name: LINGXIFIELD Live Browser Free Tool Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-free-tool-e2e.yml'
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingxifield-live-free-tool-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-free-tool-usage:
    # PRs establish a real-site baseline; production events test only current main.
    if: >-
      ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success' }}
    name: real-public-website-${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        browser: [desktop-chromium, mobile-chromium]
    steps:
      - name: Checkout browser test fixtures without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Confirm production event is for current main
        id: gate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
          DEPLOY_ENV: ${{ github.event.deployment.environment }}
        run: |
          if [ "$EVENT" = 'deployment_status' ]; then
            if [[ "${DEPLOY_ENV,,}" != *production* ]] || [ -z "$DEPLOYED_SHA" ]; then
              echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
            git fetch --no-tags --depth=1 origin main
            if [ "$DEPLOYED_SHA" != "$(git rev-parse FETCH_HEAD)" ]; then
              echo 'Stale/non-primary production event; not measuring old release'; echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"
      - name: Install pnpm
        if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.0
          run_install: false
      - name: Pin Node and dependency cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install real Chrome browser
        if: steps.gate.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chrome
      - name: Real-site URL, input, conversion and reopened downloads (no payment or provider mocks)
        if: steps.gate.outputs.run == 'true'
        env:
          LINGXIFIELD_E2E_BASE_URL: https://lingxifield.com
          LINGXIFIELD_E2E_REMOTE: '1'
        run: |
          pnpm exec playwright test -c playwright.final.config.ts \
            --project=${{ matrix.browser }} --workers=2 \
            tests/final-closure/all-tools.spec.ts \
            tests/final-closure/tool-real-output.spec.ts \
            tests/final-closure/batch-image-trust-e2e.spec.ts \
            tests/final-closure/qr-cron-output-v86.spec.ts
      - name: Preserve failures and test evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: lingxifield-live-free-${{ github.sha }}-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
