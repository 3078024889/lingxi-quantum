name: ToolPass premium 9-language checkout and true-price build gate (NO DEPLOY)
on:
  push:
    branches: [feat/toolpass-premium-nine-language-20261109]
  pull_request:
    branches: [release/com-sasi-full-20261108]
    paths:
      - 'app/tools/pass/page.tsx'
      - 'lib/tools/commerce/toolpass-premium-copy.ts'
      - 'tests/toolpass-premium-nine-language-20261109.test.mjs'
      - '.github/workflows/toolpass-premium-nine-language-20261109.yml'
permissions: {contents: read}
concurrency:
  group: toolpass-premium-i18n-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validated-payment-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LINGXI_SELFHOST_BUILD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://lingxifield.cn
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sxsgdpqojepgbbrxrzlq.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.28.0,run_install: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc,cache: pnpm}
      - name: Pin dependencies
        run: pnpm install --frozen-lockfile
      - name: Source contracts
        run: |
          node --test tests/toolpass-premium-nine-language-20261109.test.mjs
          node --test tests/dual-premium-sasi-toolpass-20261109.test.mjs
          node tests/toolpass-direct-fulfillment-20261108.test.mjs
          node --test tests/cn-wallet-checkout-entry-20261108.test.mjs
      - name: Typecheck and production build
        run: |
          pnpm exec tsc --noEmit
          pnpm build
          test -s .next/standalone/server.js
          echo TOOLPASS_NINE_LANGUAGE_PREMIUM_BUILD_PASS_NO_DEPLOY
