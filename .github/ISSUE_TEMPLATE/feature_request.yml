name: Feature proposal
description: Propose a focused improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: reuse
    attributes:
      label: Shared infrastructure
      description: Which existing registry, processor, API, worker, billing, upload, or SASI component can be reused?
  - type: textarea
    id: verify
    attributes:
      label: Verification
      description: How should the result be tested?
